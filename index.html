/**
 * Загружает файл в Supabase Storage (бакет order-attachments, публичный
 * на чтение) и возвращает его публичную ссылку. Без Supabase (локальная
 * заглушка) просто возвращает имя файла — вложения не переживут перезагрузку.
 * @param {File} file
 */
async function uploadAttachment(file) {
  if (!isSupabaseConfigured()) return { url: file.name, path: null };
  const { url, key } = getConfig();
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '') || 'bin';
  const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const res = await fetch(`${url}/storage/v1/object/order-attachments/${path}`, {
    method: 'POST',
    headers: {
      apikey: key,
      Authorization: `Bearer ${key}`,
      'Content-Type': file.type || 'application/octet-stream',
    },
    body: file,
  });
  if (!res.ok) {
    throw new Error(`Не удалось загрузить файл: ${res.status} ${await res.text()}`);
  }
  return { url: `${url}/storage/v1/object/public/order-attachments/${path}`, path };
}

/** Загружает выбранные файлы, кладёт результат в targetArray (по ссылке) и обновляет chips в containerEl. */
async function handleFileSelection(files, targetArrayHolder, containerEl, onDone) {
  containerEl.innerHTML = files
    .map((f) => `<span class="attachment-chip">⏳ ${escapeHtml(f.name)}</span>`)
    .join('');
  const uploaded = [];
  for (const f of files) {
    try {
      const { url } = await uploadAttachment(f);
      uploaded.push({
        id: `att-${Date.now()}-${uploaded.length}`,
        type: f.type.startsWith('video') ? 'video' : 'photo',
        url,
        name: f.name,
        sizeBytes: f.size,
      });
    } catch (err) {
      console.error('[attachments] upload failed', err);
      showToast('Не удалось загрузить файл: ' + f.name);
    }
  }
  targetArrayHolder.value = targetArrayHolder.value.concat(uploaded);
  containerEl.innerHTML = targetArrayHolder.value
    .map((a) => `<span class="attachment-chip">${a.type === 'video' ? '🎬' : '📷'} ${escapeHtml(a.name || a.url)}</span>`)
    .join('');
  if (onDone) onDone();
}

function updateComposerSendState() {
  const composerInput = document.getElementById('composer-input');
  const composerSend = document.getElementById('composer-send');
  if (!composerSend) return;
  const textOk = Boolean(composerInput && composerInput.value.trim());
  const addressOk = Boolean(composerAddressValue.trim());
  composerSend.disabled = !(textOk && addressOk);
}

const COMPOSER_TEXTAREA_MAX_HEIGHT = 160;
// Подсказка-плейсхолдер теперь в две строки — пока поле пустое, держим
// высоту на две строки, чтобы обе были видны целиком.
const COMPOSER_TEXTAREA_PLACEHOLDER_HEIGHT = 48;

/** Тонкое поле ввода в одну строку по умолчанию, растёт по мере набора текста. */
function autosizeComposerTextarea(textarea) {
  if (!textarea) return;
  textarea.style.height = 'auto';
  const minHeight = textarea.value ? 0 : COMPOSER_TEXTAREA_PLACEHOLDER_HEIGHT;
  textarea.style.height = Math.max(minHeight, Math.min(textarea.scrollHeight, COMPOSER_TEXTAREA_MAX_HEIGHT)) + 'px';
}

/** Заголовок «Что нужно сделать?» уходит, как только человек начал печатать. */
function updateHomeHeroVisibility(textarea) {
  const hero = document.getElementById('home-hero');
  if (!hero) return;
  hero.classList.toggle('is-hidden', Boolean(textarea && textarea.value.trim()));
}

function wireEvents() {
  const composerInput = document.getElementById('composer-input');
  const composerSend = document.getElementById('composer-send');
  const composerFile = document.getElementById('composer-file');
  const composerAttachments = document.getElementById('composer-attachments');
  const composerAddress = document.getElementById('composer-address');
  const composerDate = document.getElementById('composer-date');
  const composerTimeFromInput = document.getElementById('composer-time-from');
  const composerTimeToInput = document.getElementById('composer-time-to');

  if (composerAddress) {
    composerAddress.addEventListener('input', () => {
      composerAddressValue = composerAddress.value;
      // Ручное редактирование адреса — сброс координат, захваченных геолокацией,
      // чтобы текст и точка на карте не расходились.
      composerExactLocation = null;
      updateComposerSendState();
    });
  }
  if (composerDate) {
    composerDate.addEventListener('change', () => {
      const bounds = composerDateBounds();
      let v = composerDate.value;
      // Дублируем min/max-проверку в JS — атрибуты min/max можно обойти
      // (например, через devtools), финальная защита всё равно на сервере
      // (см. CHECK-constraint orders_desired_date_range в Supabase).
      if (v && (v < bounds.min || v > bounds.max)) {
        v = '';
        composerDate.value = '';
        showToast('Дата должна быть от сегодня и не позднее чем через месяц');
      }
      composerDesiredDate = v;
    });
  }
  if (composerTimeFromInput) {
    composerTimeFromInput.addEventListener('change', () => {
      composerTimeFrom = composerTimeFromInput.value;
    });
  }
  if (composerTimeToInput) {
    composerTimeToInput.addEventListener('change', () => {
      composerTimeTo = composerTimeToInput.value;
    });
  }
  if (composerInput) {
    autosizeComposerTextarea(composerInput);
    composerInput.addEventListener('input', () => {
      updateComposerSendState();
      autosizeComposerTextarea(composerInput);
      updateHomeHeroVisibility(composerInput);
      scheduleComposerAssistantCheck(composerInput.value);
    });
    // Заголовок «Что нужно сделать?» прячется сразу по клику в поле, а не
    // только когда появился текст; если поле снова опустело и потеряло
    // фокус — заголовок возвращается.
    composerInput.addEventListener('focus', () => {
      const hero = document.getElementById('home-hero');
      if (hero) hero.classList.add('is-hidden');
    });
    composerInput.addEventListener('blur', () => {
      updateHomeHeroVisibility(composerInput);
    });
  }
  updateComposerSendState();

  if (composerFile) {
    composerFile.addEventListener('change', () => {
      const files = Array.from(composerFile.files);
      const holder = { value: pendingAttachments };
      handleFileSelection(files, holder, composerAttachments, () => {
        pendingAttachments = holder.value;
      });
    });
  }
  if (composerSend) {
    composerSend.addEventListener('click', () => {
      const text = composerInput.value.trim();
      const address = composerAddressValue.trim();
      if (!text || !address) return;

      const atts = pendingAttachments;
      pendingAttachments = [];
      // Телефон (для новых пользователей) запрашивается позже, на экране
      // подтверждения заявки — см. renderCompose()/case 'publish-draft'.
      startQuickDraft(text, atts, address, composerDesiredDate, composerTimeFrom, composerTimeTo, composerExactLocation);
      composerExpandedField = null;
      composerExactLocation = null;
    });
  }

  const gatePhone = document.getElementById('gate-phone');
  if (gatePhone) {
    const gateError = document.getElementById('gate-phone-error');
    const gateSend = document.getElementById('gate-phone-send');
    wirePhoneField(gatePhone, gateError, () => {
      gateSend.disabled = gatePhone.dataset.valid !== 'true';
    });
    gateSend.addEventListener('click', async () => {
      if (gatePhone.dataset.valid !== 'true') return;
      gateSend.disabled = true;
      try {
        const user = await ensureUserByPhone(gatePhone.value, {});
        state.currentUserId = user.id;
        saveSession(user.id);
        render();
      } catch (err) {
        console.error('[phone-gate] failed', err);
        showToast('Не получилось продолжить — попробуйте ещё раз');
        gateSend.disabled = false;
      }
    });
  }

  const composePhone = document.getElementById('compose-phone');
  if (composePhone) {
    const composePhoneError = document.getElementById('compose-phone-error');
    wirePhoneField(composePhone, composePhoneError, () => {});
  }

  const reviewFile = document.getElementById('quick-review-file');
  const reviewAttachments = document.getElementById('quick-review-attachments');
  if (reviewFile && reviewAttachments) {
    reviewFile.addEventListener('change', () => {
      const files = Array.from(reviewFile.files);
      const holder = { value: state.draft.attachments || [] };
      handleFileSelection(files, holder, reviewAttachments, () => {
        state.draft.attachments = holder.value;
        render();
      });
    });
  }

  document.body.onclick = null;
  document.querySelectorAll('[data-action]').forEach((node) => {
    node.addEventListener('click', (e) => {
      const action = node.getAttribute('data-action');
      const value = node.getAttribute('data-value');
      handleAction(action, value);
    });
  });

  wireOnboardingSwipe();
}

/**
 * Свайп по карточке онбординга/справки закрывает её — как вниз (обычный
 * жест для шторки), так и вверх, по просьбе — оба направления считаются
 * закрытием. Жест ловится с «шапки» карточки (ручка + иллюстрация), чтобы
 * не мешать прокрутке текста в теле карточки на длинном окне «Как это
 * работает».
 */
function wireOnboardingSwipe() {
  const card = document.querySelector('.onboarding-card');
  if (!card) return;
  const body = card.querySelector('.onboarding-body');
  const DISMISS_THRESHOLD = 70;
  let startY = null;
  let dragging = false;

  const bodyIsScrollable = () => Boolean(body && body.scrollHeight > body.clientHeight + 1);

  const onPointerDown = (e) => {
    if (bodyIsScrollable() && body.contains(e.target)) return;
    startY = e.clientY;
    dragging = true;
    card.style.transition = 'none';
    card.setPointerCapture?.(e.pointerId);
  };
  const onPointerMove = (e) => {
    if (!dragging || startY === null) return;
    card.style.transform = `translateY(${e.clientY - startY}px)`;
  };
  const onPointerEnd = (e) => {
    if (!dragging || startY === null) return;
    const delta = e.clientY - startY;
    dragging = false;
    startY = null;
    card.style.transition = 'transform 0.2s ease';
    if (Math.abs(delta) > DISMISS_THRESHOLD) {
      handleAction('dismiss-onboarding');
    } else {
      card.style.transform = 'translateY(0)';
    }
  };

  card.addEventListener('pointerdown', onPointerDown);
  card.addEventListener('pointermove', onPointerMove);
  card.addEventListener('pointerup', onPointerEnd);
  card.addEventListener('pointercancel', onPointerEnd);
}

async function handleAction(action, value) {
  switch (action) {
    case 'go-home': return go('home');
    case 'go-orders': return go('orders');
    case 'go-notifications': return go('notifications');
    case 'go-profile': return go('profile');
    case 'go-operator': return go('operator');
    case 'open-order': return go('orderDetail', { openOrderId: value });
    case 'voice-toggle':
      return toggleVoiceRecording();
    case 'capture-composer-geo':
      return captureComposerAddressGeo();

    case 'request-telegram-code': {
      const limit = getTelegramLinkLimitState();
      if (!limit.canRequest) return render();
      recordTelegramLinkAttempt();
      window.open(`https://t.me/${TELEGRAM_BOT_USERNAME}`, '_blank', 'noopener');
      return render();
    }
    case 'submit-telegram-code': {
      const el = document.getElementById('telegram-link-code');
      return submitTelegramLinkCode(el ? el.value : '');
    }

    case 'toggle-specialist-mode':
      state.specialistMode = !state.specialistMode;
      return render();
    case 'specialist-focus-address':
      composerExpandedField = 'address';
      render();
      document.getElementById('composer-address')?.focus();
      return;
    case 'toggle-composer-field': {
      composerExpandedField = composerExpandedField === value ? null : value;
      render();
      const idByField = { address: 'composer-address', date: 'composer-date' };
      if (composerExpandedField && idByField[composerExpandedField]) {
        document.getElementById(idByField[composerExpandedField])?.focus();
      }
      return;
    }
    case 'collapse-composer-field':
      composerExpandedField = null;
      return render();
    case 'dismiss-onboarding':
      state.infoOverlay = null;
      return render();
    case 'show-help':
      state.infoOverlay = 'long';
      return render();
    case 'publish-draft': {
      const fullAddressField = document.getElementById('field-full-address');
      if (fullAddressField) state.draft.fullAddress = fullAddressField.value.trim();

      // Телефон запрашивается тут, на экране подтверждения заявки, а не в
      // composer'е — учётка (для новых пользователей) создаётся прямо перед
      // публикацией заказа.
      if (!currentUser()) {
        const composePhone = document.getElementById('compose-phone');
        if (!composePhone || composePhone.dataset.valid !== 'true') {
          const err = document.getElementById('compose-phone-error');
          if (err) {
            err.textContent = 'Укажите номер телефона, чтобы отправить заявку';
            err.style.display = 'block';
          }
          return;
        }
        const sendBtn = document.getElementById('compose-publish-send');
        if (sendBtn) sendBtn.disabled = true;
        try {
          const user = await ensureUserByPhone(composePhone.value, {
            location: CENTER,
            district: state.draft.district,
          });
          state.currentUserId = user.id;
          saveSession(user.id);
        } catch (err) {
          console.error('[compose] phone step failed', err);
          showToast('Не получилось продолжить — попробуйте ещё раз');
          if (sendBtn) sendBtn.disabled = false;
          return;
        }
      }
      return publishDraft();
    }

    case 'accept-order':
      return acceptOrder(value);
    case 'advance-order': {
      const [orderId, next] = value.split(':');
      return advanceWorkerStatus(orderId, next);
    }
    case 'report-issue':
      return reportIssue(value);
    case 'confirm-completion':
      return confirmCompletion(value);
    case 'rate-order': {
      const [orderId, n] = value.split(':');
      return rateOrder(orderId, Number(n));
    }

    case 'use-geo-profile':
      return captureGeolocation();
    case 'save-radius': {
      const user = currentUser();
      saveUser({ ...user, searchRadiusKm: Number(document.getElementById('field-radius').value || 3) });
      showToast('Радиус сохранён');
      return render();
    }
    case 'add-skill': {
      const cat = document.getElementById('field-skill-category').value;
      const note = document.getElementById('field-skill-note').value.trim();
      if (!note) return showToast('Опишите коротко навык');
      return addSkill(cat, note);
    }
    case 'switch-demo-user': {
      state.currentUserId = document.getElementById('field-demo-user').value;
      showToast('Демо-пользователь переключён');
      return render();
    }
    case 'toggle-service': {
      const services = getServices();
      const s = services.find((x) => x.id === value);
      s.active = !s.active;
      saveService(s);
      return render();
    }
    case 'reset-demo': {
      resetDb(buildInitialDb());
      showToast('Демо-данные сброшены');
      return render();
    }
    case 'logout':
      return logout();
    default:
      return;
  }
}

async function boot() {
  setSyncErrorHandler(showToast);
  render(); // показать экран загрузки сразу
  await initDb(buildInitialDb());

  if (isSupabaseConfigured() && hadBootLoadFailure()) {
    state.booting = false;
    state.screen = 'bootError';
    return render();
  }

  if (isSupabaseConfigured()) {
    // Пробуем восстановить сессию по сохранённому id пользователя, но НЕ
    // требуем входа для просмотра главной страницы — заявку можно начать
    // без авторизации, номер телефона спросим прямо в форме отправки.
    const saved = loadSession();
    let user = null;
    if (saved) {
      user = getUsers().find((u) => u.id === saved) || null;
    }
    if (user) {
      state.currentUserId = user.id;
    } else if (saved) {
      clearSession();
    }
  } else {
    // Локальная разработка без Supabase: как раньше, сразу демо-пользователь.
    state.currentUserId = getUsers()[0]?.id ?? null;
  }
  state.screen = 'home';

  // Краткая карточка-подсказка сама всплывает при старте, пока человек не
  // авторизован (телефон/Telegram не привязаны). Подробное объяснение
  // работы сайта в любой момент открывается кнопкой «?» в шапке.
  state.infoOverlay = currentUser() ? null : 'short';

  state.booting = false;
  console.info(assistantDemoNotice());
  render();
}

boot();
