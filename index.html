/**
 * Подключает выпадающий список подсказок адреса к текстовому полю: с
 * задержкой (дебаунс) ищет реальные адреса по мере ввода (Геосаджест) и по
 * клику на вариант подставляет его текст, а следом — координаты (их
 * приходится получать отдельным запросом по uri, см. resolveGeosuggestUri —
 * сам Геосаджест координат не отдаёт). Работает через прямые
 * DOM-манипуляции, а не через полный render() — иначе поле теряло бы фокус
 * на каждую подсказку (см. общий паттерн composer-assistant-hint). Если
 * прокси-функция не настроена (ASSISTANT_FUNCTION_URL пуст, см.
 * isGeosuggestConfigured) — подсказки просто не показываются, поле
 * остаётся обычным текстовым.
 * @param {HTMLInputElement} input
 * @param {HTMLElement} listEl
 * @param {(item: {text:string, lat:number|null, lng:number|null}) => void} onSelect
 */
function wireAddressSuggestions(input, listEl, onSelect) {
  if (!input || !listEl) return;
  let timer = null;
  let requestId = 0;

  function hideList() {
    listEl.innerHTML = '';
  }

  function renderList(items) {
    if (!items.length) {
      hideList();
      return;
    }
    listEl.innerHTML = items
      .map((item, i) => `<button type="button" class="address-suggest-item" data-suggest-index="${i}">${escapeHtml(item.text)}</button>`)
      .join('');
    listEl.querySelectorAll('.address-suggest-item').forEach((btn) => {
      // mousedown, а не click — срабатывает раньше, чем blur поля успеет
      // скрыть список (см. обработчик blur ниже).
      btn.addEventListener('mousedown', async (e) => {
        e.preventDefault();
        const item = items[Number(btn.dataset.suggestIndex)];
        if (!item) return;
        input.value = item.text;
        hideList();
        // У самой подсказки координат нет — запрашиваем их отдельно по uri.
        // Если это не удастся, всё равно передаём текст дальше (lat/lng —
        // null, вызывающий код воспринимает это как «точка не определена» и
        // либо пробует прямой geocodeAddressYandex(text), либо человек
        // уточнит точку на карте на экране подтверждения заявки).
        let coords = null;
        try {
          coords = await resolveGeosuggestUri(item.uri);
        } catch (err) {
          console.warn('[geo] не удалось получить координаты подсказки', err);
        }
        onSelect({ text: item.text, lat: coords ? coords.lat : null, lng: coords ? coords.lng : null });
      });
    });
  }

  input.addEventListener('input', () => {
    if (timer) clearTimeout(timer);
    const query = input.value.trim();
    if (!isGeosuggestConfigured() || query.length < 5) {
      hideList();
      return;
    }
    const myRequestId = ++requestId;
    timer = setTimeout(async () => {
      try {
        const items = await searchAddressSuggestionsYandex(query);
        if (myRequestId !== requestId) return; // поле уже изменилось — ответ устарел
        renderList(items);
      } catch (err) {
        console.warn('[geo] подсказки адреса не удалось получить', err);
      }
    }, 400);
  });

  input.addEventListener('blur', () => {
    setTimeout(hideList, 150);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') hideList();
  });
}

function captureComposerAddressGeo() {
  if (!navigator.geolocation) {
    showToast('Геолокация недоступна в этом браузере — введите адрес вручную');
    return;
  }
  const btn = document.getElementById('composer-geo-btn');
  if (btn) {
    btn.disabled = true;
    btn.querySelector('span').textContent = 'Определяем…';
  }
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude, longitude } = pos.coords;
      composerExactLocation = { lat: latitude, lng: longitude };
      try {
        const address = await reverseGeocodeYandex(latitude, longitude);
        if (address) composerAddressValue = address;
      } catch (err) {
        console.warn('[geo] обратное геокодирование не удалось', err);
      }
      if (!composerAddressValue.trim()) {
        composerAddressValue = `Координаты: ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
      }
      showToast('Адрес определён автоматически — проверьте и уточните при необходимости');
      render();
      document.getElementById('composer-address')?.focus();
    },
    () => {
      showToast('Доступ к геолокации отклонён — введите адрес вручную');
      if (btn) {
        btn.disabled = false;
        btn.querySelector('span').textContent = 'Определить автоматически';
      }
    },
    { timeout: 8000, enableHighAccuracy: true }
  );
}

// ---------------------------------------------------------------------
// ИИ-ассистент (YandexGPT + SpeechKit через Supabase Edge Function).
// Полностью необязателен: если ASSISTANT_FUNCTION_URL не задан (или
// запрос не удался), функции ниже просто ничего не делают — сайт и так
// собирает нужные данные вручную (текст/адрес/дата/фото). См. также
// interpretCustomerMessage() выше — офлайн-заглушка на ключевых словах,
// которая продолжает работать независимо от этого блока.
// ---------------------------------------------------------------------

function isAssistantConfigured() {
  const env = (typeof window !== 'undefined' && window.__ENV__) || {};
  return Boolean(env.ASSISTANT_FUNCTION_URL);
}

let mediaRecorderInstance = null;
let mediaRecorderChunks = [];
let isRecordingVoice = false;

function updateVoiceButtonUi() {
  const btn = document.querySelector('[data-action="voice-toggle"]');
  if (!btn) return;
  btn.classList.toggle('recording', isRecordingVoice);
  btn.title = isRecordingVoice ? 'Остановить запись' : 'Голосовое сообщение';
}

async function toggleVoiceRecording() {
  if (!isAssistantConfigured()) {
    return showToast('Демо: голосовое сообщение имитируется текстовой расшифровкой');
  }
  if (isRecordingVoice) {
    mediaRecorderInstance?.stop();
    return;
  }
  if (!navigator.mediaDevices?.getUserMedia) {
    showToast('Запись голоса не поддерживается этим браузером — введите текст вручную');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorderChunks = [];
    mediaRecorderInstance = new MediaRecorder(stream);
    mediaRecorderInstance.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) mediaRecorderChunks.push(e.data);
    };
    mediaRecorderInstance.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      isRecordingVoice = false;
      updateVoiceButtonUi();
      const blob = new Blob(mediaRecorderChunks, { type: mediaRecorderInstance.mimeType || 'audio/webm' });
      await sendVoiceForTranscription(blob);
    };
    mediaRecorderInstance.start();
    isRecordingVoice = true;
    updateVoiceButtonUi();
    showToast('Идёт запись — нажмите ещё раз, чтобы остановить');
  } catch (err) {
    console.error('[voice] доступ к микрофону не получен', err);
    showToast('Не удалось получить доступ к микрофону — введите текст вручную');
  }
}

async function sendVoiceForTranscription(blob) {
  const env = (typeof window !== 'undefined' && window.__ENV__) || {};
  showToast('Расшифровываем голосовое сообщение…');
  try {
    const res = await fetch(`${env.ASSISTANT_FUNCTION_URL}/transcribe`, {
      method: 'POST',
      headers: {
        'Content-Type': blob.type || 'audio/webm',
        // Supabase Edge Functions по умолчанию проверяют JWT — публичный
        // anon-ключ сайта (он и так открыт в window.__ENV__) этой проверке
        // удовлетворяет и не даёт дёргать функцию мимо сайта напрямую.
        Authorization: `Bearer ${env.SUPABASE_ANON_KEY}`,
        apikey: env.SUPABASE_ANON_KEY,
      },
      body: blob,
    });
    if (!res.ok) throw new Error(`transcribe ${res.status}`);
    const data = await res.json();
    const text = (data && data.text) || '';
    if (!text.trim()) {
      showToast('Не удалось распознать речь — попробуйте ещё раз или введите текст вручную');
      return;
    }
    const input = document.getElementById('composer-input');
    if (input) {
      input.value = input.value.trim() ? `${input.value.trim()} ${text.trim()}` : text.trim();
      updateComposerSendState();
      autosizeComposerTextarea(input);
      updateHomeHeroVisibility(input);
      scheduleComposerAssistantCheck(input.value);
    }
    showToast('Голосовое расшифровано — проверьте текст');
  } catch (err) {
    console.error('[voice] расшифровка не удалась', err);
    showToast('Не получилось расшифровать — попробуйте ещё раз или напишите текст вручную');
  }
}

let composerAssistantTimer = null;
let composerAssistantRequestId = 0;

/**
 * Последний реальный ответ ассистента (/interpret) по ТЕКУЩЕМУ тексту
 * композера. startQuickDraft() использует его вместо офлайн-заглушки
 * interpretCustomerMessage(), если он «свежий» — то есть text совпадает
 * с тем, что заказчик отправляет прямо сейчас. Если ассистент не
 * настроен, не успел ответить или текст с тех пор поменялся — сайт как и
 * раньше падает обратно на офлайн-классификацию по ключевым словам.
 */
let lastAssistantInterpretation = null;

/** Вызывается при каждом вводе текста в композере — с задержкой спрашивает ассистента, не нужно ли уточнение. */
function scheduleComposerAssistantCheck(text) {
  if (!isAssistantConfigured()) return;
  if (composerAssistantTimer) clearTimeout(composerAssistantTimer);
  const trimmed = text.trim();
  if (trimmed.length < 8) {
    const hintEl = document.getElementById('composer-assistant-hint');
    if (hintEl) hintEl.innerHTML = '';
    return;
  }
  composerAssistantTimer = setTimeout(() => runComposerAssistantCheck(trimmed), 1500);
}

async function runComposerAssistantCheck(text) {
  const env = (typeof window !== 'undefined' && window.__ENV__) || {};
  const requestId = ++composerAssistantRequestId;
  try {
    const res = await fetch(`${env.ASSISTANT_FUNCTION_URL}/interpret`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${env.SUPABASE_ANON_KEY}`,
        apikey: env.SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) throw new Error(`interpret ${res.status}`);
    const data = await res.json();
    if (requestId !== composerAssistantRequestId) return; // текст уже изменился — ответ устарел

    // Доверяем только известным сайту id категорий — если сервер вернул
    // что-то незнакомое, считаем, что категория не определена.
    const categoryId =
      data && typeof data.categoryId === 'string' && CATEGORIES.some((c) => c.id === data.categoryId)
        ? data.categoryId
        : null;
    const normalizedText =
      data && typeof data.normalizedText === 'string' && data.normalizedText.trim() ? data.normalizedText.trim() : null;
    lastAssistantInterpretation = { text, categoryId, normalizedText };

    const hintEl = document.getElementById('composer-assistant-hint');
    if (!hintEl) return;
    const parts = [];
    if (normalizedText) {
      parts.push(
        `<div class="msg assistant"><span class="assistant-suggestion-text">Может, так понятнее: «${escapeHtml(
          normalizedText
        )}»?</span><button type="button" class="assistant-suggestion-btn" id="composer-assistant-apply-btn">Использовать эту формулировку</button></div>`
      );
    }
    if (data && data.clarifyingQuestion) {
      parts.push(`<div class="msg assistant">${escapeHtml(data.clarifyingQuestion)}</div>`);
    }
    hintEl.innerHTML = parts.join('');
    const applyBtn = document.getElementById('composer-assistant-apply-btn');
    if (applyBtn) applyBtn.addEventListener('click', applyAssistantNormalizedText);
  } catch (err) {
    console.warn('[assistant] уточнение не удалось получить', err);
    // Тихо игнорируем — ассистент необязателен, форма и так собирает нужные данные.
  }
}

/**
 * Структурированное ТЗ для исполнителя (/format-brief) — вызывается один раз,
 * в момент публикации заказа (см. publishDraft()), с уже полным контекстом
 * (текст заявки + всё, что заказчик указал в форме: категория, объём, адрес,
 * дата, срочность, фото). В отличие от /interpret (черновик, только
 * категория), это разбор для конкретного мастера: суть работы, детали по
 * месту, материалы, ожидаемый результат и что уточнить при первом контакте.
 *
 * Необязателен: если ассистент не настроен, запрос не удался или вернул
 * пустой результат — возвращает null, и сайт как и раньше показывает
 * исполнителю только «сырое» описание клиента (order.description).
 */
async function requestFormattedBrief(order, draft) {
  if (!isAssistantConfigured()) return null;
  const env = (typeof window !== 'undefined' && window.__ENV__) || {};
  try {
    const res = await fetch(`${env.ASSISTANT_FUNCTION_URL}/format-brief`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${env.SUPABASE_ANON_KEY}`,
        apikey: env.SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({
        description: order.description,
        categoryId: order.categoryId,
        quantity: order.scope?.quantity ?? null,
        accessDifficulty: order.scope?.accessDifficulty ?? null,
        needsMaterials: Boolean(draft && draft.needsMaterials),
        attachmentsCount: Array.isArray(order.attachments) ? order.attachments.length : 0,
        district: order.district || null,
        fullAddress: order.fullAddress || null,
        desiredDate: order.desiredDate || null,
        timeWindow: order.timeWindow || null,
        urgency: order.urgency || null,
      }),
    });
    if (!res.ok) throw new Error(`format-brief ${res.status}`);
    const data = await res.json();
    if (!data || typeof data.problem !== 'string' || !data.problem.trim()) return null;
    return data;
  } catch (err) {
    console.warn('[assistant] не удалось сформировать ТЗ для исполнителя', err);
    return null;
  }
}

/** Заказчик нажал «Использовать эту формулировку» — подставляем предложенный ассистентом текст вместо своего. */
function applyAssistantNormalizedText() {
  const input = document.getElementById('composer-input');
  if (!input || !lastAssistantInterpretation || !lastAssistantInterpretation.normalizedText) return;
  input.value = lastAssistantInterpretation.normalizedText;
  composerDescriptionValue = sanitizeComposerTextarea(input);
  updateComposerSendState();
  autosizeComposerTextarea(input);
  updateHomeHeroVisibility(input);
  // Текст поменялся — переспрашиваем ассистента заново по новой формулировке.
  scheduleComposerAssistantCheck(input.value);
  const hintEl = document.getElementById('composer-assistant-hint');
  if (hintEl) hintEl.innerHTML = '';
}

// ---------------------------------------------------------------------
// Рендер
// ---------------------------------------------------------------------

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------------------------------------------------------------------
// Фильтр символов в описании задачи (composer-input): разрешены только
// буквы (рус/лат), цифры, пробелы/переносы строк и обычные знаки
// препинания — символы вроде <, >, {, }, `, которые в принципе могли бы
// что-то сломать при выводе, вырезаются прямо во время набора. Это
// дополнительная страховка поверх escapeHtml() (который и так экранирует
// весь пользовательский текст при отрисовке) — двойная защита не помешает.
// ---------------------------------------------------------------------
const TASK_TEXT_DISALLOWED_CHARS = /[^a-zA-Zа-яёА-ЯЁ0-9\s.,!?:;()'"«»\-–—/№#+%&*@]/g;
let sanitizeHintTimer = null;

/**
 * Убирает запрещённые символы из значения textarea, сохраняя позицию
 * курсора (иначе после каждого «плохого» символа курсор прыгал бы в конец
 * поля). Показывает короткую подсказку, если что-то было вырезано.
 * @returns {string} очищенное значение
 */
function sanitizeComposerTextarea(textarea) {
  const before = textarea.value;
  const cleaned = before.replace(TASK_TEXT_DISALLOWED_CHARS, '');
  if (cleaned === before) return before;

  const cursor = textarea.selectionStart ?? before.length;
  const beforeCursor = before.slice(0, cursor);
  const removedBeforeCursor = beforeCursor.length - beforeCursor.replace(TASK_TEXT_DISALLOWED_CHARS, '').length;
  textarea.value = cleaned;
  const newCursor = Math.max(0, cursor - removedBeforeCursor);
  try {
    textarea.setSelectionRange(newCursor, newCursor);
  } catch (err) {
    // не критично, если конкретный тип поля не поддерживает setSelectionRange
  }

  const hintEl = document.getElementById('composer-sanitize-hint');
  if (hintEl) {
    hintEl.textContent = 'Некоторые символы убраны — доступны буквы, цифры и обычные знаки препинания';
    clearTimeout(sanitizeHintTimer);
    sanitizeHintTimer = setTimeout(() => {
      hintEl.textContent = '';
    }, 2500);
  }
  return cleaned;
}

// «Прочитанные» уведомления — только на этом устройстве: сервер не хранит
// признак прочтения (таблица notifications его не знает), поэтому просто
// запоминаем в localStorage момент последнего захода на экран
// «Уведомления» для каждого пользователя и на бейдже в шапке показываем
// количество уведомлений, пришедших после этого момента. Простая и
// достаточная замена полноценному read/unread на сервере — бейдж и так
// сбрасывается сразу, как только человек открыл список.
// ---------------------------------------------------------------------
const NOTIFICATIONS_SEEN_KEY = 'muzhik_notifications_seen_v1';

function loadNotificationsSeenMap() {
  if (typeof localStorage === 'undefined') return {};
  try {
    return JSON.parse(localStorage.getItem(NOTIFICATIONS_SEEN_KEY) || '{}');
  } catch {
    return {};
  }
}

function markNotificationsSeen(userId) {
  if (!userId || typeof localStorage === 'undefined') return;
  const map = loadNotificationsSeenMap();
  map[userId] = new Date().toISOString();
  localStorage.setItem(NOTIFICATIONS_SEEN_KEY, JSON.stringify(map));
}

function getUnreadNotificationsCount(userId) {
  if (!userId) return 0;
  const list = getNotificationsFor(userId);
  if (!list.length) return 0;
  const seenAt = loadNotificationsSeenMap()[userId];
  if (!seenAt) return list.length;
  const seenTime = new Date(seenAt).getTime();
  return list.filter((n) => new Date(n.createdAt).getTime() > seenTime).length;
}

function orderCardHtml(order, { viewer }) {
  const catTitle = CATEGORY_TITLES[order.categoryId] || order.categoryId;
  // Для карточек-кандидатов из available-orders точных координат заказа нет
  // (сервер их намеренно не отдаёт, пока заказ не принят, — см. Edge
  // Function available-orders) — расстояние уже посчитано там же и приходит
  // готовым в order.distanceKm.
  const dist =
    typeof order.distanceKm === 'number'
      ? order.distanceKm.toFixed(1)
      : hasValidLocation(order.exactLocation) && currentUser()
      ? distanceKm(currentUser().location, order.exactLocation).toFixed(1)
      : null;
  return `
    <div class="order-card" data-action="open-order" data-value="${order.id}">

        order.isPrecedent
          ? `<div class="order-warning">Прецедент: цена согласовывается сторонами</div>`
          : typeof order.finalPrice === 'number'
          ? `<div class="order-meta"><span>Итого: ${order.finalPrice} ₽</span></div>`
          : `<div class="order-meta"><span>Ориентир: ${order.estimate.min}–${order.estimate.max} ₽</span></div>`

      ${!hasValidLocation(order.exactLocation) ? `<div class="order-warning">⚠ Точная точка на карте не определена — проверьте адрес заявки</div>` : ''}
      ${order.warnings.map((w) => `<div class="order-warning">${escapeHtml(w)}</div>`).join('')}

  `;
}

// ---------------------------------------------------------------------
// Сортировка и фильтр статусов для списков заказов на экране «Заказы» (см.
// renderOrders) — маленькая кнопка рядом с заголовком каждого из трёх
// блоков («Мои заказы», «Заказы, которые я выполняю», «Подходит вам
// рядом») открывает полноэкранную модалку renderOrdersSortModal, по
// образцу «Сортировки на карте» в админке (admin.html,
// renderMapSortModal) — полный список параметров, а не маленький попап:
// можно и скрыть ненужные статусы из списка (чтобы не загромождали экран),
// и включить сортировку по статусу.
//
// Единственный критерий сортировки сейчас — «По статусу»; ORDER_SORT_OPTIONS
// сделан списком специально, чтобы позже добавить ещё критерии одной
// записью, не трогая остальной код модалки.
// ---------------------------------------------------------------------
const ORDER_SORT_OPTIONS = [{ key: 'byStatus', label: 'По статусу' }];

const ORDERS_BLOCK_TITLES = {
  my: 'Мои заказы',
  assigned: 'Заказы, которые я выполняю',
  candidates: 'Подходит вам рядом',
};

// statuses — Set статусов, которые нужно ПОКАЗЫВАТЬ (пустой Set — как
// «ничего не выбрано — любой» в админской «Сортировке на карте» — значит
// показывать все статусы, фильтр не активен). byStatus — включена ли
// сортировка по статусу.
function makeOrdersBlockSettings() {
  return { statuses: new Set(), byStatus: false };
}

// Настройки по каждому из трёх блоков — независимо друг от друга (фильтр
// или сортировка в «Моих заказах» не должны затрагивать «Заказы, которые я
// выполняю»).
const ordersSortSettings = {
  my: makeOrdersBlockSettings(),
  assigned: makeOrdersBlockSettings(),
  candidates: makeOrdersBlockSettings(),
};

// Какая из трёх модалок сейчас открыта ('my' | 'assigned' | 'candidates')
// или null — как mapPickerOpenFor, окно на весь экран поверх текущего
// экрана (см. renderOrdersSortModal), закрывается своей кнопкой ✕, кликом
// по затемнению, клавишей Esc или кнопкой «Готово».
let ordersSortModalOpenFor = null;

// Кнопка светится синим, если в блоке скрыт хотя бы один статус фильтром
// и/или включена сортировка — см. .sort-btn.active.
function isOrderSortActive(blockKey) {
  const settings = ordersSortSettings[blockKey];
  return Boolean(settings) && (settings.statuses.size > 0 || settings.byStatus);
}

function applyOrdersBlockSettings(list, blockKey) {
  const settings = ordersSortSettings[blockKey];
  if (!settings) return list;
  let result = list;
  if (settings.statuses.size > 0) {
    result = result.filter((o) => settings.statuses.has(o.status));
  }
  if (settings.byStatus) {
    // Сортировка стабильна (Array#sort в современных движках), поэтому
    // заказы с одинаковым статусом сохраняют исходный взаимный порядок.
    result = [...result].sort(
      (a, b) => (ORDER_STATUS_SORT_INDEX[a.status] ?? 99) - (ORDER_STATUS_SORT_INDEX[b.status] ?? 99)
    );
  }
  return result;
}

const ICON_SORT =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6.5 7.5v5.5l-3 1.5v-7L4 5z"/></svg>';

/**
 * Полноэкранная модалка сортировки/фильтра одного блока заказов — фон
 * переиспользует .map-picker-overlay (как renderPasswordStepOverlay/
 * renderEditNameOverlay), карточка — свой .orders-sort-card. Список

        </div>
        <div class="orders-sort-body">

            <p class="orders-sort-section-label">Показывать статусы (можно несколько; ничего не выбрано — все)</p>
            <div class="orders-sort-pills">
              ${STATUS_KEYS.map(
                (key) => `
                <button type="button" class="sort-pill ${settings.statuses.has(key) ? 'active' : ''}" data-action="toggle-order-status-filter" data-value="${blockKey}:${key}">${escapeHtml(STATUS_LABELS[key])}</button>

/**
 * Заголовок блока заказов с маленькой кнопкой сортировки/фильтра (и, для
 * «Подходит вам рядом», ещё и кнопкой «Обновить» — extraButtonHtml). Кнопка
 * светится синим (см. .sort-btn.active), когда в этом блоке скрыт хотя бы
 * один статус фильтром и/или включена сортировка, и остаётся нейтральной
 * (цвет панели, var(--gray-100)), когда ни то ни другое не активно.
 */
function renderOrdersSectionHeader(title, blockKey, { extraButtonHtml = '' } = {}) {
  const active = isOrderSortActive(blockKey);
  return `
    <div class="section-title-row">
      <div class="section-title">${escapeHtml(title)}</div>
      <div class="section-title-row-actions">

      </div>
    </div>
  `;
}

function renderOrders() {
  const user = currentUser();
  const myOrders = getOrders().filter((o) => o.customerId === state.currentUserId);
  const hasSkills = user.skills.length > 0;
  // В режиме Supabase список кандидатов считает и фильтрует сервер (Edge
  // Function available-orders, см. refreshAvailableOrders) — здесь просто
  // читаем уже готовый результат из кэша. В демо-режиме без Supabase
  // Edge Function недоступна — считаем как раньше, прямо по cache.orders.
  const candidateOrders = !hasSkills
    ? []
    : isSupabaseConfigured()
    ? cache.availableOrders
    : getOrders().filter(
        (o) =>
          o.status === 'searching' &&
          o.customerId !== state.currentUserId &&
          user.skills.some((s) => s.categoryId === o.categoryId) &&
          hasValidLocation(o.exactLocation) &&
          distanceKm(user.location, o.exactLocation) <= (o.searchRadiusKm || user.searchRadiusKm || 3)
      );
  const assignedToMe = getOrders().filter(
    (o) => o.assignedWorkerId === state.currentUserId && !['rated', 'cancelled'].includes(o.status)
  );
  // Кнопка «Обновить» и разделение «ошибка / честный ноль» имеют смысл
  // только пока список реально считает сервер (см. refreshAvailableOrders) —
  // в демо-режиме без Supabase candidateOrders считается синхронно тут же,
  // ошибок сети там не бывает.
  const showsServerList = hasSkills && isSupabaseConfigured();

  // Фильтр статусов и сортировка (см. ordersSortSettings рядом с
  // renderOrdersSectionHeader) — применяются только к отображению, исходные
  // массивы (myOrders/assignedToMe/candidateOrders) не меняются.
  const myOrdersSorted = applyOrdersBlockSettings(myOrders, 'my');
  const assignedSorted = applyOrdersBlockSettings(assignedToMe, 'assigned');
  const candidatesSorted = applyOrdersBlockSettings(candidateOrders, 'candidates');

  // Если фильтр статусов скрыл все карточки блока (а не «заказов правда
  // нет») — отдельная подсказка со ссылкой на сброс, а не то же самое
  // сообщение, что и для честно пустого блока.
  const hiddenByFilterNote = (blockKey) => `
    <div class="empty-state">Все заказы скрыты фильтром статусов. <button type="button" style="border:none;background:none;padding:0;font:inherit;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer;" data-action="reset-order-sort" data-value="${blockKey}">Сбросить фильтр</button></div>
  `;

  return `
    <div class="screen">
      ${renderOrdersSectionHeader('Мои заказы', 'my')}
      ${
        myOrdersSorted.length
          ? myOrdersSorted.map((o) => orderCardHtml(o, { viewer: 'customer' })).join('')
          : myOrders.length
          ? hiddenByFilterNote('my')
          : `<div class="empty-state">Вы ещё не публиковали заказы</div>`
      }

      ${renderOrdersSectionHeader('Заказы, которые я выполняю', 'assigned')}
      ${
        assignedSorted.length
          ? assignedSorted.map((o) => orderCardHtml(o, { viewer: 'worker' })).join('')
          : assignedToMe.length
          ? hiddenByFilterNote('assigned')
          : `<div class="empty-state">Пока нет назначенных вам заказов</div>`
      }

      ${renderOrdersSectionHeader('Подходит вам рядом', 'candidates', {
        extraButtonHtml: showsServerList
          ? `<button class="section-refresh-btn" type="button" data-action="refresh-available-orders" ${
              cache.availableOrdersLoading ? 'disabled' : ''
            }>${cache.availableOrdersLoading ? 'Обновляем…' : 'Обновить'}</button>`
          : '',
      })}
      ${
        !hasSkills
          ? `<div class="empty-state">Добавьте навык в профиле, чтобы видеть подходящие заказы поблизости</div>`
          : showsServerList && cache.availableOrdersError && !candidatesSorted.length
          ? `<div class="available-orders-error">Не удалось обновить список заказов — проверьте соединение и нажмите «Обновить» выше.</div>`
          : candidatesSorted.length
          ? candidatesSorted.map((o) => orderCardHtml(o, { viewer: 'worker' })).join('')
          : candidateOrders.length
          ? hiddenByFilterNote('candidates')
          : `<div class="empty-state">В вашем радиусе пока нет подходящих заказов по вашим навыкам</div>`
      }
    </div>
    ${ordersSortModalOpenFor ? renderOrdersSortModal(ordersSortModalOpenFor) : ''}
  `;
}

/**
 * Карточка структурированного ТЗ для исполнителя (см. requestFormattedBrief()
 * и Edge Function /format-brief). Показывается только мастеру/кандидату —
 * заказчик и так видит свой исходный текст выше. Если ассистент не
 * сформировал ТЗ (не настроен, сбой запроса, старый заказ) — ничего не
 * выводим, мастер видит только «сырое» описание клиента, как раньше.
 */
function formattedBriefHtml(brief) {
  if (!brief || !brief.problem) return '';
  const rows = [
    ['Суть работы', brief.problem],
    ['Место / доступ', brief.locationDetails],
    ['Материалы', brief.materialsNeeded],
    ['Ожидаемый результат', brief.expectedOutcome],
  ].filter(([, v]) => v && String(v).trim());
  const missing =
    Array.isArray(brief.missingInfo) && brief.missingInfo.length
      ? `<p class="order-meta"><span>Уточнить у клиента: ${brief.missingInfo.map((m) => escapeHtml(m)).join('; ')}</span></p>`
      : '';
  return `
    <div class="order-card" style="background:#f6f8fa;margin:8px 0;">
      <p class="order-meta"><b>ТЗ для исполнителя (сформировано ассистентом)</b></p>
      ${rows.map(([label, value]) => `<p><b>${escapeHtml(label)}:</b> ${escapeHtml(value)}</p>`).join('')}
      ${missing}
    </div>
  `;
}

/**
 * Блок «сколько мастер получит на руки» в карточке заказа — рядом со
 * стоимостью, которую видит заказчик, но заработок мастера подан крупнее и
 * акцентирован цветом (см. .worker-payout-* в CSS), похоже на то, как
 * акцентирована сумма в форме оплаты у заказчика. Комиссия площадки — см.
 * WORKER_PAYOUT_RATE/workerPayout().
 */
function renderWorkerPayoutBlock(order) {
  if (order.isPrecedent) {
    const offer = order.negotiation && order.negotiation.customerOffer;
    if (!offer) {
      return `<p class="order-meta">Прецедент — сумма ещё не согласована с заказчиком, заработок будет известен после согласования цены</p>`;
    }
    return `
      <div class="worker-payout">
        <p class="worker-payout-price">Стоимость заказа ${offer} ₽</p>
        <p class="worker-payout-earn-label">Вы заработаете</p>
        <p class="worker-payout-earn-amount">${workerPayout(offer)} ₽</p>
      </div>
    `;
  }
  if (typeof order.finalPrice === 'number') {
    return `
      <div class="worker-payout">
        <p class="worker-payout-price">Стоимость заказа ${order.finalPrice} ₽</p>
        <p class="worker-payout-earn-label">Вы заработаете</p>
        <p class="worker-payout-earn-amount">${workerPayout(order.finalPrice)} ₽</p>
      </div>
    `;
  }
  const earnMin = workerPayout(order.estimate.min);
  const earnMax = workerPayout(order.estimate.max);
  return `
    <div class="worker-payout">
      <p class="worker-payout-price">Стоимость заказа ${order.estimate.min}–${order.estimate.max} ₽</p>
      <p class="worker-payout-earn-label">Вы заработаете</p>
      <p class="worker-payout-earn-amount">${earnMin === earnMax ? `${earnMin} ₽` : `${earnMin}–${earnMax} ₽`}</p>
    </div>
  `;
}

function renderOrderDetail() {
  const order = getOrders().find((o) => o.id === state.openOrderId);
  if (!order) return `<div class="screen"><div class="empty-state">Заказ не найден</div></div>`;

  const isCustomer = order.customerId === state.currentUserId;
  const isAssignedWorker = order.assignedWorkerId === state.currentUserId;
  const user = currentUser();
  const iCanAccept =
    !isCustomer &&
    order.status === 'searching' &&
    user.skills.some((s) => s.categoryId === order.categoryId);

  let actions = '';
  if (iCanAccept) {
    actions = `<button class="primary-button" data-action="accept-order" data-value="${order.id}">Принять заказ</button>`;
  } else if (isAssignedWorker) {
    if (canTransition(order.status, 'en_route')) actions += `<button class="primary-button" data-action="advance-order" data-value="${order.id}:en_route">Выехал</button>`;
    if (canTransition(order.status, 'in_progress')) actions += `<button class="primary-button" data-action="advance-order" data-value="${order.id}:in_progress">Начал работу</button>`;
    if (canTransition(order.status, 'completed')) actions += `<button class="primary-button" data-action="advance-order" data-value="${order.id}:completed">Завершил</button>`;
    if (['assigned', 'en_route', 'in_progress'].includes(order.status)) actions += `<button class="secondary-button" data-action="report-issue" data-value="${order.id}">Сообщить о проблеме</button>`;
    // Оценка заказчика мастером доступна с момента, когда работа отмечена
    // выполненной, и не привязана к машине состояний заказа (см. rateCustomer()).
    if (['completed', 'confirmed', 'rated'].includes(order.status) && !order.customerRating) {
      actions += `
        <p class="order-meta">Оцените заказчика:</p>
        <div class="chip-row">
          ${[1, 2, 3, 4, 5].map((n) => `<button data-action="rate-customer" data-value="${order.id}:${n}">${n}★</button>`).join('')}
        </div>
      `;
    }
  } else if (isCustomer) {
    if (order.status === 'clarification_requested') {
      // Администратору не хватило данных для расчёта цены (см. admin.html
      // requestClarification) — заказ на паузе до ответа. Ответ возвращает
      // заказ на модерацию (submitClarificationAnswer), без выбора «принять
      // /отклонить»: это не решение по заказу, а просто недостающая деталь.
      actions = `
        <p class="order-meta"><b>Администратору нужно уточнение:</b></p>
        <p>${escapeHtml(order.clarification?.question || '')}</p>
        <textarea id="clarification-answer-${order.id}" class="composer-textarea" placeholder="Ваш ответ…" rows="2"></textarea>
        <button class="primary-button" data-action="submit-clarification" data-value="${order.id}">Отправить ответ</button>
      `;
    } else if (order.status === 'estimate_ready') {
      // Оплата — имитация платёжного шлюза: сумма и две кнопки, без
      // ввода карты и реального списания (см. payOrder/paymentAdapter).
      const amount = typeof order.finalPrice === 'number' ? order.finalPrice : order.estimate.min;
      actions = `
        <p class="order-meta">Оплата — демо-режим: реального списания нет, форма ввода карты не нужна.</p>
        <button class="primary-button" data-action="pay-order" data-value="${order.id}">Оплатить ${amount} ₽</button>
        <button class="secondary-button" data-action="decline-order" data-value="${order.id}">Отказаться</button>
      `;
    } else if (order.status === 'completed') {
      actions = `
        <button class="primary-button" data-action="confirm-completion" data-value="${order.id}">Подтвердить выполнение</button>
        <button class="secondary-button" data-action="report-issue" data-value="${order.id}">Сообщить о проблеме</button>
      `;
    } else if (order.status === 'confirmed') {
      actions = `
        <p class="order-meta">Оцените работу:</p>
        <div class="chip-row">
          ${[1, 2, 3, 4, 5].map((n) => `<button data-action="rate-order" data-value="${order.id}:${n}">${n}★</button>`).join('')}
        </div>
      `;
    }
  }

  const showExact = isCustomer || isAssignedWorker;

  return `
    <div class="screen">
      <div class="order-card">
        <div class="order-card-top">
          <p class="order-title">${escapeHtml(order.title)}</p>
          <span class="status-pill">${STATUS_LABELS[order.status]}</span>
        </div>
        <p class="order-meta">
          <span>${escapeHtml(CATEGORY_TITLES[order.categoryId] || '')}</span>
          <span>${escapeHtml(order.district)}${order.houseNumberPublic ? ', д. ' + escapeHtml(order.houseNumberPublic) : ''}</span>
        </p>
        <p>${escapeHtml(order.description)}</p>
        ${!isCustomer ? formattedBriefHtml(order.formattedBrief) : ''}
        ${
          showExact && hasValidLocation(order.exactLocation)
            ? `<p class="order-meta"><span>Точный адрес: ${order.fullAddress ? escapeHtml(order.fullAddress) + ' · ' : ''}${order.exactLocation.lat.toFixed(4)}, ${order.exactLocation.lng.toFixed(4)}</span></p>`
            : showExact
            ? `<div class="order-warning">⚠ Точная точка на карте не определена — адрес: ${order.fullAddress ? escapeHtml(order.fullAddress) : escapeHtml(order.district) || 'не указан'}. На карте в админке эта заявка не отобразится.</div>`
            : ''
        }
        ${
          // Контакт заказчика показываем мастеру только после того, как он
          // взял заказ в работу (isAssignedWorker) — до этого в списке
          // кандидатов и на карточке видно только район и номер дома
          // (см. orderCardHtml). Пока заказ не принят, ни имени, ни телефона
          // заказчика мастер не видит. Подъезд/домофон/квартиру мастер
          // уточнит по телефону сам — это не критично для отображения.
          isAssignedWorker
            ? (() => {
                // Полного профиля заказчика (с телефоном) в общем кэше теперь
                // может не быть — bulk-загрузка отдаёт только users_public
                // (см. initDb). Запрашиваем контакт отдельно и по требованию
                // (см. ensureCustomerContact) — как только ответ придёт,
                // ensureCustomerContact сам вызовет render().
                const contact = ensureCustomerContact(order.customerId);
                if (contact === 'loading' || contact === null) {
                  return `<p class="order-meta"><span>Контакт заказчика: загрузка…</span></p>`;
                }
                if (contact === 'error') {
                  return `<p class="order-meta"><span>Контакт заказчика: не удалось загрузить</span></p>`;
                }
                return `<p class="order-meta"><span>Контакт заказчика: ${escapeHtml(contact.displayName || 'без имени')} · ${escapeHtml(displayPhone(contact.phone) || 'телефон не указан')}</span></p>`;
              })()
            : ''
        }
        ${
          order.desiredDate || order.timeWindow
            ? `<p class="order-meta"><span>${escapeHtml(formatOrderDateLabel(order.desiredDate))} ${escapeHtml(order.timeWindow)}</span></p>`
            : ''
        }
        ${
          isCustomer
            ? order.isPrecedent
              ? `<p>Прецедент — предложение клиента: ${order.negotiation.customerOffer ?? '—'} ₽</p>`
              : `<p>Ориентир: ${order.estimate.min}–${order.estimate.max} ₽</p>`
            : renderWorkerPayoutBlock(order)
        }
        ${isCustomer && typeof order.finalPrice === 'number' ? `<p><b>Итого к оплате: ${order.finalPrice} ₽</b></p>` : ''}
        <p class="order-meta"><span>Оплата: ${order.payment.method === 'on_site' ? 'на месте' : 'предоплата (демо)'}, статус — ${order.payment.status}</span></p>
        ${
          order.attachments && order.attachments.length
            ? `<div class="attachment-preview" style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;">${order.attachments
                .map(
                  (a) =>
                    `<img src="${escapeHtml(a.url)}" alt="${escapeHtml(a.name || '')}" style="width:72px;height:72px;object-fit:cover;border-radius:8px;" loading="lazy" />`
                )
                .join('')}</div>`

        <div class="timeline">

function renderPhoneGate() {
  if (phoneVerifyState) return renderPhoneVerifyStep(phoneVerifyState);

  const limit = getTelegramLinkLimitState();
  let hint = '';
  if (limit.overDay) {

  } else if (limit.overHour) {
    hint = 'Часовой лимит запросов кода исчерпан — попробуйте позже.';

  return `

/** Подшаг renderPhoneGate() — ожидание/результат звонка на проверочный номер (см. beginPhoneCallVerification). */
function renderPhoneVerifyStep(st) {
  const number = displayPhone(st.numberToCall);
  if (st.status === 'confirmed') {
    return `
      <div class="field-card">
        <p><b>Номер подтверждён ✓</b></p>

    return `

        <p class="order-meta">Мы не увидели звонок с вашего номера на ${escapeHtml(number)}. Проверьте, что звонили именно с этого телефона, и попробуйте ещё раз.</p>
        <button class="primary-button" data-action="phone-verify-retry">Попробовать ещё раз</button>
        <button class="secondary-button" type="button" style="margin-top:10px;box-sizing:border-box;" data-action="phone-verify-skip">Продолжить без подтверждения</button>
      </div>

  }
  return `
    <div class="field-card">
      <p><b>Позвоните на ${escapeHtml(number)}</b></p>
      <p class="order-meta">Наберите этот номер со своего телефона и сразу сбросьте — отвечать не нужно, ничего вводить не нужно. Мы сами узнаем ваш номер по входящему звонку.</p>

      <button class="secondary-button" type="button" style="box-sizing:border-box;" data-action="phone-verify-cancel">Ввести другой номер</button>
    </div>
  `;
}

// Экран (.screen) целиком пересоздаётся при каждом render() — это полная
// замена innerHTML, а не точечное обновление DOM. У нового элемента
// scrollTop всегда 0, поэтому без специальной обработки любое действие на
// экране (звезда рейтинга, добавление навыка, всплывающий toast и т.п.)
// незаметно для пользователя «подбрасывало» страницу наверх. Раз в
// pending-переменную запоминаем, на каком экране и с каким scrollTop
// произошёл предыдущий render(); если экран не поменялся — восстанавливаем
// прежнюю прокрутку сразу после перерисовки. При настоящем переходе между
// экранами (go()) scrollTop намеренно остаётся 0 — так и должно быть.
let lastRenderedScreen = null;

function render() {
  const app = document.getElementById('app');
  const prevScreenEl = app.querySelector('.screen');
  const preserveScroll = Boolean(prevScreenEl) && lastRenderedScreen === state.screen;
  const savedScrollTop = preserveScroll ? prevScreenEl.scrollTop : 0;

  if (state.screen === 'boot' || state.booting) {
    app.innerHTML = renderBooting();
    return;
  }

  if (state.screen === 'bootError') {
    app.innerHTML = renderBootError();
    return;
  }

  const screensRequiringUser = ['orders', 'profile', 'notifications', 'orderDetail'];
  if (isSupabaseConfigured() && screensRequiringUser.includes(state.screen) && !currentUser()) {
    app.innerHTML = `
      ${renderTopbarNoUser()}
      <div class="screen">
        <div class="section-title">Нужен номер телефона</div>
        <div class="chat-thread">${renderPhoneGate()}</div>
      </div>
      ${renderBottomNav()}
      ${state.infoOverlay === 'short' ? renderOnboardingOverlay() : state.infoOverlay === 'long' ? renderHelpOverlay() : state.infoOverlay === 'radius' ? renderRadiusNoticeOverlay() : state.infoOverlay === 'support' ? renderSupportOverlay() : ''}
      ${passwordStepState ? renderPasswordStepOverlay(passwordStepState) : ''}
    `;
    wireEvents();
    return;
  }

  if (!currentUser() && !isSupabaseConfigured()) {
    app.innerHTML = `
      ${renderTopbarNoUser()}
      ${renderNoUsers()}
    `;
    return;
  }

  let content = '';
  if (state.screen === 'home') content = renderHome();
  else if (state.screen === 'orders') content = renderOrders();
  else if (state.screen === 'compose') content = renderCompose();
  else if (state.screen === 'orderDetail') content = renderOrderDetail();
  else if (state.screen === 'notifications') content = renderNotifications();
  else if (state.screen === 'profile') content = renderProfile();

  app.innerHTML = `
    ${renderTopbar()}
    ${content}
    ${renderBottomNav()}
    ${state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : ''}
    ${state.infoOverlay === 'short' ? renderOnboardingOverlay() : state.infoOverlay === 'long' ? renderHelpOverlay() : state.infoOverlay === 'radius' ? renderRadiusNoticeOverlay() : state.infoOverlay === 'support' ? renderSupportOverlay() : ''}
    ${mapPickerOpenFor ? renderMapPickerOverlay() : ''}
    ${passwordStepState ? renderPasswordStepOverlay(passwordStepState) : ''}
    ${editNameState ? renderEditNameOverlay(editNameState) : ''}
  `;

  lastRenderedScreen = state.screen;
  if (preserveScroll) {
    const newScreenEl = app.querySelector('.screen');
    if (newScreenEl) newScreenEl.scrollTop = savedScrollTop;
  }

  wireEvents();
}

const RU_MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

/**
 * Разрешённое окно для выбора даты заказа: от сегодня и не дальше чем на
 * месяц вперёд — то же ограничение продублировано в CHECK-constraint
 * orders_desired_date_range на таблице orders (защита от подмены даты в
 * обход интерфейса — client-side min/max тут только для UX).
 */
/**
 * Проверка интервала «с/до»: «до» должно быть строго позже «с». Строки
 * HH:MM сравниваются как обычные строки — при одинаковой длине это
 * эквивалентно сравнению времени. Пустые значения (одно из полей ещё не
 * заполнено) считаются валидными — ошибка показывается, только когда
 * интервал уже указан целиком и он действительно обратный.
 * @param {string} from — HH:MM
 * @param {string} to — HH:MM
 * @returns {string} — текст ошибки или '', если всё в порядке
 */
function timeWindowError(from, to) {
  if (!from || !to) return '';
  return to <= from ? 'Время «до» должно быть позже времени «с»' : '';
}

function composerDateBounds() {
  const pad = (n) => String(n).padStart(2, '0');
  const toIso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const now = new Date();
  const max = new Date(now);
  max.setMonth(max.getMonth() + 1);
  return { min: toIso(now), max: toIso(max) };
}

/** Человекочитаемая дата для отображения в карточке/деталях заказа (без «Сегодня/Завтра» — там нужна именно дата). @param {string} dateStr — yyyy-mm-dd */
function formatOrderDateLabel(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (Number.isNaN(d.getTime())) return '';
  return `${d.getDate()} ${RU_MONTHS_SHORT[d.getMonth()]}`;
}

/** @param {string} dateStr — yyyy-mm-dd, @param {string} timeFrom — HH:MM, @param {string} timeTo — HH:MM */
function formatComposerDateLabel(dateStr, timeFrom, timeTo) {
  if (!dateStr) return 'Дата';
  const d = new Date(dateStr + 'T00:00:00');
  if (Number.isNaN(d.getTime())) return 'Дата';
  const today = new Date();
  const tomorrow = new Date(today);
  tomorrow.setDate(today.getDate() + 1);
  let label;
  if (d.toDateString() === today.toDateString()) label = 'Сегодня';
  else if (d.toDateString() === tomorrow.toDateString()) label = 'Завтра';
  else label = `${d.getDate()} ${RU_MONTHS_SHORT[d.getMonth()]}`;
  const time = timeFrom && timeTo ? `${timeFrom}–${timeTo}` : timeFrom || '';
  return time ? `${label}, ${time}` : label;
}

/**
 * Загружает файл в Supabase Storage (бакет order-attachments, публичный
 * на чтение) и возвращает его публичную ссылку. Без Supabase (локальная
 * заглушка) просто возвращает имя файла — вложения не переживут перезагрузку.
 * @param {File} file
 */
async function uploadAttachment(file) {
  if (!isSupabaseConfigured()) return { url: file.name, path: null };
  const { url, key } = getConfig();
  const ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '') || 'bin';
  const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const res = await fetch(`${url}/storage/v1/object/order-attachments/${path}`, {
    method: 'POST',
    headers: {
      apikey: key,
      Authorization: `Bearer ${key}`,
      'Content-Type': file.type || 'application/octet-stream',
    },
    body: file,
  });
  if (!res.ok) {
    throw new Error(`Не удалось загрузить файл: ${res.status} ${await res.text()}`);
  }
  return { url: `${url}/storage/v1/object/public/order-attachments/${path}`, path };
}

/**
 * Загружает аватарку профиля — тот же бакет order-attachments (публичный
 * на чтение), что и фото к заявкам, просто в отдельной «папке» avatars/,
 * чтобы не заводить для этого отдельный бакет и не просить настраивать
 * новые политики доступа в Supabase.
 * @param {File} file
 * @param {string} userId
 */
async function uploadAvatar(file, userId) {
  if (!isSupabaseConfigured()) return { url: file.name };
  const { url, key } = getConfig();
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
  const path = `avatars/${userId}-${Date.now()}.${ext}`;
  const res = await fetch(`${url}/storage/v1/object/order-attachments/${path}`, {
    method: 'POST',
    headers: {
      apikey: key,
      Authorization: `Bearer ${key}`,
      'Content-Type': file.type || 'application/octet-stream',
    },
    body: file,
  });
  if (!res.ok) {
    throw new Error(`Не удалось загрузить фото: ${res.status} ${await res.text()}`);
  }
  return { url: `${url}/storage/v1/object/public/order-attachments/${path}` };
}

// Видео к заказу больше не прикладываем — только фото (проще для мастера
// посмотреть, дешевле для нас хранить), и не больше этого числа за раз.
const MAX_ORDER_PHOTOS = 5;

/**
 * Сжимает фото на клиенте (canvas — встроенная возможность браузера, без
 * серверной обработки и без плагинов) до примерно maxBytes в JPEG, чтобы
 * (а) не забить хранилище — с телефона фото часто весит 5–15 МБ, и
 * (б) фото открывалось быстро на любом устройстве и медленном интернете.
 * Уменьшает сначала качество, а если этого мало — ещё и размер картинки.
 * Если файл не картинка или не получилось декодировать — возвращает файл
 * как есть, не блокируя отправку заявки из-за одного проблемного файла.
 * @param {File} file
 * @param {{maxBytes?: number, maxDim?: number}} [opts]
 * @returns {Promise<File>}
 */
async function compressImageFile(file, opts = {}) {
  const maxBytes = opts.maxBytes ?? 1_000_000;
  let maxDim = opts.maxDim ?? 1920;
  if (!file.type || !file.type.startsWith('image/') || file.type === 'image/gif' || file.type === 'image/svg+xml') {
    return file;
  }
  let bitmap;
  try {
    bitmap = await createImageBitmap(file);
  } catch (err) {
    console.warn('[compress] не удалось декодировать изображение — отправляем как есть', err);
    return file;
  }

  let blob = null;
  for (let attempt = 0; attempt < 6; attempt++) {
    const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
    const w = Math.max(1, Math.round(bitmap.width * scale));
    const h = Math.max(1, Math.round(bitmap.height * scale));
    const canvas = document.createElement('canvas');
    canvas.width = w;
    canvas.height = h;
    canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
    const quality = attempt < 3 ? 0.85 - attempt * 0.2 : 0.45;
    blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', quality));
    if (!blob || blob.size <= maxBytes || maxDim <= 480) break;
    maxDim = Math.round(maxDim * 0.75);
  }
  if (bitmap.close) bitmap.close();
  if (!blob) return file;

  const newName = (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg';
  return new File([blob], newName, { type: 'image/jpeg' });
}

/** Загружает выбранные файлы, кладёт результат в targetArray (по ссылке) и обновляет chips в containerEl. */
async function handleFileSelection(files, targetArrayHolder, containerEl, onDone) {
  let incoming = Array.from(files).filter((f) => f.type && f.type.startsWith('image/'));
  if (incoming.length < files.length) {
    showToast('Принимаются только фото');
  }
  const room = Math.max(0, MAX_ORDER_PHOTOS - targetArrayHolder.value.length);
  if (incoming.length > room) {
    showToast(`Можно приложить не больше ${MAX_ORDER_PHOTOS} фото`);
    incoming = incoming.slice(0, room);
  }
  if (!incoming.length) {
    if (onDone) onDone();
    return;
  }

  containerEl.innerHTML = targetArrayHolder.value
    .map((a) => `<span class="attachment-chip">📷 ${escapeHtml(a.name || a.url)}</span>`)
    .concat(incoming.map((f) => `<span class="attachment-chip">⏳ ${escapeHtml(f.name)}</span>`))
    .join('');

  const uploaded = [];
  for (const f of incoming) {
    try {
      const compact = await compressImageFile(f);
      const { url } = await uploadAttachment(compact);
      uploaded.push({
        id: `att-${Date.now()}-${uploaded.length}`,
        type: 'photo',
        url,
        name: compact.name,
        sizeBytes: compact.size,
      });
    } catch (err) {
      console.error('[attachments] upload failed', err);
      showToast('Не удалось загрузить файл: ' + f.name);
    }
  }
  targetArrayHolder.value = targetArrayHolder.value.concat(uploaded);
  containerEl.innerHTML = targetArrayHolder.value
    .map((a) => `<span class="attachment-chip">📷 ${escapeHtml(a.name || a.url)}</span>`)
    .join('');
  if (onDone) onDone();
}

/**
 * Три градации цвета кнопки отправки (см. .send-button в CSS), вместо
 * жёсткого disabled — кнопка остаётся нажимаемой всегда, а не заполненные
 * поля объясняются сообщением по клику (см. composerSend click-обработчик
 * в wireEvents), а не молчаливым бездействием кнопки.
 */
function updateComposerSendState() {
  const composerInput = document.getElementById('composer-input');
  const composerSend = document.getElementById('composer-send');
  if (!composerSend) return;
  const textOk = Boolean(composerInput && composerInput.value.trim());
  const addressOk = Boolean(composerAddressValue.trim());
  composerSend.classList.remove('grade-2', 'grade-3');
  if (textOk && addressOk) {
    composerSend.classList.add('grade-3');
  } else if (textOk) {
    composerSend.classList.add('grade-2');
  }
}

/** Тонкое поле ввода в одну строку по умолчанию, растёт по мере набора текста. */
function autosizeComposerTextarea(textarea) {
  if (!textarea) return;
  textarea.style.height = 'auto';
  const minHeight = textarea.value ? 0 : COMPOSER_TEXTAREA_PLACEHOLDER_HEIGHT;
  textarea.style.height = Math.max(minHeight, Math.min(textarea.scrollHeight, COMPOSER_TEXTAREA_MAX_HEIGHT)) + 'px';
