function wireEvents() {
  const composerInput = document.getElementById('composer-input');
  const composerSend = document.getElementById('composer-send');
  const composerFile = document.getElementById('composer-file');
  const composerAttachments = document.getElementById('composer-attachments');
  const composerAddress = document.getElementById('composer-address');
  const composerDate = document.getElementById('composer-date');
  const composerTimeFromInput = document.getElementById('composer-time-from');
  const composerTimeToInput = document.getElementById('composer-time-to');

  if (composerAddress) {
    composerAddress.addEventListener('input', () => {
      composerAddressValue = composerAddress.value;
      // Ручное редактирование адреса — сброс координат, захваченных геолокацией,
      // чтобы текст и точка на карте не расходились.
      composerExactLocation = null;
      updateComposerSendState();
    });
    // Подсказки реального адреса (см. wireAddressSuggestions/
    // searchAddressSuggestionsYandex выше) — выбор из списка сразу
    // проставляет проверенные координаты, минуя повторное геокодирование.
    wireAddressSuggestions(composerAddress, document.getElementById('composer-address-suggestions'), (item) => {
      composerAddressValue = item.text;
      composerExactLocation = { lat: item.lat, lng: item.lng };
      updateComposerSendState();
    });
  }
  const profileDistrictInput = document.getElementById('field-profile-district');
  if (profileDistrictInput) {
    profileDistrictInput.addEventListener('input', () => {
      profileDistrictValue = profileDistrictInput.value;
      // Ручное редактирование после выбора подсказки — координаты из
      // подсказки больше не гарантированно соответствуют тексту.
      profileDistrictSelectedLocation = null;
    });
    wireAddressSuggestions(profileDistrictInput, document.getElementById('profile-district-suggestions'), (item) => {
      profileDistrictValue = item.text;
      profileDistrictSelectedLocation = { lat: item.lat, lng: item.lng };
    });
  }
  if (composerDate) {
    composerDate.addEventListener('change', () => {
      const bounds = composerDateBounds();
      let v = composerDate.value;
      // Дублируем min/max-проверку в JS — атрибуты min/max можно обойти
      // (например, через devtools), финальная защита всё равно на сервере
      // (см. CHECK-constraint orders_desired_date_range в Supabase).
      if (v && (v < bounds.min || v > bounds.max)) {
        v = '';
        composerDate.value = '';
        showToast('Дата должна быть от сегодня и не позднее чем через месяц');
      }
      composerDesiredDate = v;
    });
  }
  if (composerTimeFromInput) {
    composerTimeFromInput.addEventListener('change', () => {
      composerTimeFrom = composerTimeFromInput.value;
      composerTimeError = timeWindowError(composerTimeFrom, composerTimeTo);
      render();
    });
  }
  if (composerTimeToInput) {
    composerTimeToInput.addEventListener('change', () => {
      composerTimeTo = composerTimeToInput.value;
      composerTimeError = timeWindowError(composerTimeFrom, composerTimeTo);
      render();
    });
  }
  if (composerInput) {
    autosizeComposerTextarea(composerInput);
    updateHomeHeroVisibility(composerInput);
    composerInput.addEventListener('input', () => {
      composerDescriptionValue = sanitizeComposerTextarea(composerInput);
      updateComposerSendState();
      autosizeComposerTextarea(composerInput);
      updateHomeHeroVisibility(composerInput);
      scheduleComposerAssistantCheck(composerInput.value);
    });
    // Заголовок «Что нужно сделать?» прячется сразу по клику в поле, а не
    // только когда появился текст; если поле снова опустело и потеряло
    // фокус — заголовок возвращается.
    composerInput.addEventListener('focus', () => {
      const hero = document.getElementById('home-hero');
      if (hero) hero.classList.add('is-hidden');
    });
    composerInput.addEventListener('blur', () => {
      updateHomeHeroVisibility(composerInput);
    });
  }
  updateComposerSendState();

  if (composerFile) {
    composerFile.addEventListener('change', () => {
      const files = Array.from(composerFile.files);
      const holder = { value: pendingAttachments };
      handleFileSelection(files, holder, composerAttachments, () => {
        pendingAttachments = holder.value;
      });
    });
  }
  if (composerSend) {
    composerSend.addEventListener('click', async () => {
      const text = composerInput.value.trim();
      const address = composerAddressValue.trim();
      // Кнопка больше не disabled жёстко (см. updateComposerSendState) — она
      // нажимаема всегда, три градации цвета лишь подсказывают готовность.
      // Незаполненные обязательные поля объясняются тостом по клику, а не
      // молчаливым бездействием кнопки.
      if (!text) {
        showToast('Опишите, что нужно сделать');
        return;
      }
      if (!address) {
        showToast('Укажите адрес, чтобы отправить заявку');
        return;
      }
      // Финальная защита от обратного интервала времени — на случай, если
      // поле даты/времени так и осталось открытым с ошибкой (собственно
      // «Готово» это уже не пропускает, см. collapse-composer-field).
      if (timeWindowError(composerTimeFrom, composerTimeTo)) {
        showToast('Время «до» должно быть позже времени «с» — поправьте интервал');
        composerExpandedField = 'date';
        composerTimeError = timeWindowError(composerTimeFrom, composerTimeTo);
        render();
        return;
      }
      // Дата — необязательна (в отличие от адреса): без неё заявку всё
      // равно можно отправить, просто предупреждаем, что так сложнее
      // подобрать мастера на конкретный день.
      if (!composerDesiredDate) {
        showToast('Дата не указана — так сложнее подобрать мастера, но заявку можно отправить');
      }

      // composerExactLocation заполняется кнопкой «геолокация»
      // (captureComposerAddressGeo) или выбором подсказки адреса
      // (wireAddressSuggestions). Если адрес вписан вручную и точных
      // координат ещё нет — пробуем прямое геокодирование, тем же
      // способом, что и адрес мастера в профиле (geocodeAddressYandex).
      // Отдельного ключа Геосаджеста с честным автодополнением по базе
      // реальных адресов у нас нет, поэтому это лишь попытка подсказать
      // точку заранее — блокировать отправку не нужно: если геокодирование
      // не удалось, заявка всё равно уходит с сентинелом {0,0} и
      // предупреждением, а точную точку человек подтвердит на карте на
      // следующем шаге («Проверьте заявку»).
      let exactLocation = composerExactLocation;
      if (!hasValidLocation(exactLocation) && isGeocoderConfigured()) {
        composerSend.disabled = true;
        try {
          exactLocation = await geocodeAddressYandex(address);
        } catch (err) {
          console.warn('[geo] геокодирование адреса заявки не удалось', err);
          exactLocation = null;
        } finally {
          composerSend.disabled = false;
        }
        if (!hasValidLocation(exactLocation)) {
          showToast('Адрес не распознан на карте — уточните точку на следующем шаге');
        }
      }

      const atts = pendingAttachments;
      pendingAttachments = [];
      composerDescriptionValue = '';

      // Телефон (для новых пользователей) запрашивается позже, на экране
      // подтверждения заявки — см. renderCompose()/case 'publish-draft'.
      startQuickDraft(text, atts, address, composerDesiredDate, composerTimeFrom, composerTimeTo, exactLocation);
      composerExpandedField = null;
      composerExactLocation = null;
    });
  }

  const gatePhone = document.getElementById('gate-phone');
  if (gatePhone) {
    const gateError = document.getElementById('gate-phone-error');
    const gateSend = document.getElementById('gate-phone-send');
    wirePhoneField(gatePhone, gateError, () => {
      gateSend.disabled = gatePhone.dataset.valid !== 'true';
    });
    gateSend.addEventListener('click', async () => {
      if (gatePhone.dataset.valid !== 'true') return;
      gateSend.disabled = true;
      try {
        const user = await ensureUserByPhone(gatePhone.value, {});
        await beginPhoneCallVerification(user);
      } catch (err) {
        console.error('[phone-gate] failed', err);
        showToast('Не получилось продолжить — попробуйте ещё раз');
        gateSend.disabled = false;
      }
    });
  }

  const passwordStepInput = document.getElementById('password-step-input');
  if (passwordStepInput) {
    const passwordStepConfirm = document.getElementById('password-step-confirm');
    const passwordStepSubmit = document.getElementById('password-step-submit');
    const submit = () => submitPasswordStep(passwordStepInput.value, passwordStepConfirm ? passwordStepConfirm.value : undefined);
    if (passwordStepSubmit) passwordStepSubmit.addEventListener('click', submit);
    const onEnter = (e) => {
      if (e.key === 'Enter') submit();
    };
    passwordStepInput.addEventListener('keydown', onEnter);
    if (passwordStepConfirm) passwordStepConfirm.addEventListener('keydown', onEnter);
    passwordStepInput.focus();
  }

  const editNameInput = document.getElementById('edit-name-input');
  if (editNameInput) {
    const editNameSubmit = document.getElementById('edit-name-submit');
    const submit = () => submitEditName(editNameInput.value);
    if (editNameSubmit) editNameSubmit.addEventListener('click', submit);
    editNameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submit();
    });
    editNameInput.focus();
    // Курсор в конец, а не выделение всего текста — иначе первое нажатие
    // случайной клавиши стирало бы существующее имя целиком.
    const len = editNameInput.value.length;
    editNameInput.setSelectionRange(len, len);
  }

  const composeName = document.getElementById('compose-name');
  if (composeName) {
    composeName.addEventListener('input', () => {
      composeNameFieldValue = composeName.value;
    });
  }

  const composePhone = document.getElementById('compose-phone');
  if (composePhone) {
    const composePhoneError = document.getElementById('compose-phone-error');
    wirePhoneField(composePhone, composePhoneError, () => {
      composePhoneFieldValue = composePhone.value;
    });
  }

  const profileAvatarFile = document.getElementById('profile-avatar-file');
  if (profileAvatarFile) {
    profileAvatarFile.addEventListener('change', () => {
      const file = profileAvatarFile.files && profileAvatarFile.files[0];
      if (file) changeProfileAvatar(file);
    });
  }

  const reviewFile = document.getElementById('quick-review-file');
  const reviewAttachments = document.getElementById('quick-review-attachments');
  if (reviewFile && reviewAttachments) {
    reviewFile.addEventListener('change', () => {
      const files = Array.from(reviewFile.files);
      const holder = { value: state.draft.attachments || [] };
      handleFileSelection(files, holder, reviewAttachments, () => {
        state.draft.attachments = holder.value;
        render();
      });
    });
  }

  // Карта подтверждения точки (renderCompose → quickReview) — есть в DOM,
  // только пока открыт этот шаг композера (initQuickReviewMap сама
  // проверяет наличие #quick-review-map и ничего не делает на других
  // экранах). Обновление координат при перетаскивании метки/клике по карте
  // делается точечно (см. applyPoint внутри initQuickReviewMap), без
  // полного render() — иначе каждый клик пересоздавал бы саму карту.
  initQuickReviewMap();

  // Всплывающий выбор точки на карте (см. renderMapPickerOverlay) — та же
  // логика: initMapPickerMap сама проверяет наличие #map-picker-map и
  // ничего не делает, если попап сейчас закрыт.
  initMapPickerMap();

  // Esc закрывает попап выбора точки — присваиванием, а не addEventListener,
  // чтобы не плодить по обработчику на каждый render() (см. тот же приём
  // чуть ниже для document.body.onclick).
  document.onkeydown = (e) => {
    if (e.key === 'Escape' && mapPickerOpenFor) closeMapPicker();
    if (e.key === 'Escape' && avatarMenuOpen) {
      avatarMenuOpen = false;
      render();
    }
    // Модалка сортировки/фильтра заказов (см. renderOrdersSortModal) — окно
    // на весь экран, как выбор точки на карте, а не маленький попап, поэтому
    // и закрывается так же: Esc, клик по затемнению (data-action на самом
    // .map-picker-overlay, обрабатывается ниже общим делегированием) или
    // кнопкой ✕/«Готово».
    if (e.key === 'Escape' && ordersSortModalOpenFor) {
      ordersSortModalOpenFor = null;
      render();
    }
  };

  // Клик мимо открытого попапа аккаунта закрывает его — сама
  // кнопка-переключатель и пункты внутри попапа обрабатываются своими
  // data-action-обработчиками ниже (и там же попап закрывается через
  // handleAction), так что здесь достаточно проверить, что клик пришёлся не
  // на них.
  document.body.onclick = (e) => {
    if (avatarMenuOpen && !e.target.closest('[data-action="toggle-avatar-menu"]') && !e.target.closest('#avatar-menu')) {
      avatarMenuOpen = false;
      render();
    }
  };
  document.querySelectorAll('[data-action]').forEach((node) => {
    node.addEventListener('click', (e) => {
      const action = node.getAttribute('data-action');
      const value = node.getAttribute('data-value');
      handleAction(action, value);
    });
  });

  wireOnboardingSwipe();
}

/**
 * Свайп по карточке онбординга/справки закрывает её — как вниз (обычный
 * жест для шторки), так и вверх, по просьбе — оба направления считаются
 * закрытием. Жест ловится с «шапки» карточки (ручка + иллюстрация), чтобы
 * не мешать прокрутке текста в теле карточки на длинном окне «Как это
 * работает».
 */
function wireOnboardingSwipe() {
  const card = document.querySelector('.onboarding-card');
  if (!card) return;
  const body = card.querySelector('.onboarding-body');
  const DISMISS_THRESHOLD = 70;
  let startY = null;
  let dragging = false;

  const onPointerDown = (e) => {
    // Тап по кнопке/ссылке (крестик «✕», «Понятно» и т.п.) не должен
    // запускать жест свайпа-закрытия — иначе обычный клик «проглатывается»
    // (см. onPointerEnd: короткий тап без движения ничего не делает, кроме
    // возврата карточки на место) и кнопки визуально не реагируют. Жест
    // остаётся только для пустых областей карточки.
    if (e.target.closest('button, a, [data-action]')) return;
    // Жест, начатый внутри тела карточки, целиком отдаём
    // wireScrollBoundarySwipe ниже — она сама решает, когда обычный скролл
    // должен превратиться в свайп-закрытие (см. её комментарий). Здесь
    // ловим только шапку/иллюстрацию/пустые поля — там свайп закрывает
    // сразу, без всякого скролла.
    if (body && body.contains(e.target)) return;
    startY = e.clientY;
    dragging = true;
    card.style.transition = 'none';
    card.setPointerCapture?.(e.pointerId);
  };
  const onPointerMove = (e) => {
    if (!dragging || startY === null) return;
    card.style.transform = `translateY(${e.clientY - startY}px)`;
  };
  const onPointerEnd = (e) => {
    if (!dragging || startY === null) return;
    const delta = e.clientY - startY;
    dragging = false;
    startY = null;
    card.style.transition = 'transform 0.2s ease';
    if (Math.abs(delta) > DISMISS_THRESHOLD) {
      handleAction('dismiss-onboarding');
    } else {
      card.style.transform = 'translateY(0)';
    }
  };

  card.addEventListener('pointerdown', onPointerDown);
  card.addEventListener('pointermove', onPointerMove);
  card.addEventListener('pointerup', onPointerEnd);
  card.addEventListener('pointercancel', onPointerEnd);

  wireScrollBoundarySwipe(body, card, () => handleAction('dismiss-onboarding'));
}

/**
 * Скролл, объединённый со свайпом-закрытием: пока тело карточки листается
 * обычным образом, жест никак не трогает саму карточку. Но как только
 * скролл упирается в границу (низ — если тащим вверх, верх — если вниз) и
 * палец продолжает тащить в ту же сторону, дальнейшее движение превращает
 * жест в перетаскивание карточки на закрытие — совсем как обычная шторка.
 * Порог закрытия — половина высоты экрана (а не небольшие 70px, как при
 * свайпе за шапку), чтобы обычное «доскроллили до конца» не закрывало
 * окно случайно. Применяется ко всем масштабируемым всплывающим окнам с
 * прокручиваемым телом.
 */
function wireScrollBoundarySwipe(bodyEl, cardEl, onDismiss) {
  if (!bodyEl || !cardEl) return;
  let startY = null;
  let lastY = null;
  let closeStartY = null;
  let mode = 'scroll'; // 'scroll' — обычный скролл тела, 'close' — уже тащим карточку
  let pointerId = null;

  const atTop = () => bodyEl.scrollTop <= 0;
  const atBottom = () => bodyEl.scrollTop + bodyEl.clientHeight >= bodyEl.scrollHeight - 1;

  const onPointerDown = (e) => {
    if (e.target.closest('button, a, select, input, textarea, [data-action]')) return;
    startY = e.clientY;
    lastY = e.clientY;
    closeStartY = null;
    mode = 'scroll';
    pointerId = e.pointerId;
  };
  const onPointerMove = (e) => {
    if (startY === null || e.pointerId !== pointerId) return;
    const dy = e.clientY - lastY;
    lastY = e.clientY;
    if (mode === 'scroll') {
      // Направление жеста «вниз» (dy>0) конвертируем в закрытие только
      // если тело уже докручено до самого верха (иначе это просто скролл
      // назад к началу); «вверх» (dy<0) — только если докручено до низа.
      // Если тело вовсе не прокручивается (короткий попап), оба условия
      // истинны сразу — жест закрывает с первого же движения.
      if (dy > 0 && atTop()) {
        mode = 'close';
        closeStartY = e.clientY;
        cardEl.style.transition = 'none';
        cardEl.setPointerCapture?.(pointerId);
      } else if (dy < 0 && atBottom()) {
        mode = 'close';
        closeStartY = e.clientY;
        cardEl.style.transition = 'none';
        cardEl.setPointerCapture?.(pointerId);
      } else {
        return; // обычный скролл — ничего не трогаем, нативное поведение само сработает
      }
    }
    e.preventDefault();
    cardEl.style.transform = `translateY(${e.clientY - closeStartY}px)`;
  };
  const onPointerEnd = (e) => {
    if (startY === null || e.pointerId !== pointerId) return;
    const wasClose = mode === 'close';
    const delta = wasClose ? e.clientY - closeStartY : 0;
    startY = null;
    lastY = null;
    closeStartY = null;
    mode = 'scroll';
    pointerId = null;
    if (!wasClose) return;
    cardEl.style.transition = 'transform 0.2s ease';
    if (Math.abs(delta) > window.innerHeight * 0.5) {
      onDismiss();
    } else {
      cardEl.style.transform = 'translateY(0)';
    }
  };

  bodyEl.addEventListener('pointerdown', onPointerDown);
  bodyEl.addEventListener('pointermove', onPointerMove, { passive: false });
  bodyEl.addEventListener('pointerup', onPointerEnd);
  bodyEl.addEventListener('pointercancel', onPointerEnd);
}

async function handleAction(action, value) {
  // Попап аккаунта закрывается при любом другом действии (переход по
  // пункту меню, клик по чему угодно ещё на экране) — сам toggle
  // управляет собой ниже отдельным case'ом.
  if (avatarMenuOpen && action !== 'toggle-avatar-menu') avatarMenuOpen = false;

  switch (action) {
    case 'toggle-avatar-menu':
      avatarMenuOpen = !avatarMenuOpen;
      return render();
    // Модалка сортировки/фильтра заказов (см. renderOrdersSortModal) — окно
    // на весь экран, по образцу «Сортировки на карте» в админке. В отличие
    // от прежнего маленького попапа НЕ закрывается автоматически при любом
    // другом действии — только своими явными действиями (✕/«Готово»/Esc/
    // клик по затемнению), как и остальные полноэкранные оверлеи
    // (mapPickerOpenFor, editNameState).
    case 'open-orders-sort':
      ordersSortModalOpenFor = value;
      return render();
    case 'close-orders-sort':
      ordersSortModalOpenFor = null;
      return render();
    case 'toggle-order-status-filter': {
      const [blockKey, statusKey] = value.split(':');
      const settings = ordersSortSettings[blockKey];
      if (settings) {
        if (settings.statuses.has(statusKey)) settings.statuses.delete(statusKey);
        else settings.statuses.add(statusKey);
      }
      // Модалка намеренно остаётся открытой — как и «Сортировка на карте» в
      // админке, где переключение одного пункта не закрывает панель, чтобы
      // можно было включить сразу несколько статусов подряд.
      return render();
    }
    case 'toggle-order-sort': {
      const [blockKey, optionKey] = value.split(':');
      if (ordersSortSettings[blockKey]) {
        ordersSortSettings[blockKey][optionKey] = !ordersSortSettings[blockKey][optionKey];
      }
      return render();
    }
    case 'reset-order-sort': {
      if (ordersSortSettings[value]) {
        ordersSortSettings[value] = makeOrdersBlockSettings();
      }
      return render();
    }
    case 'go-home':
      // Сброс черновика при уходе на главную — в т.ч. по кнопке «Отменить»
      // на экране проверки заявки (см. resetComposerDraft). Клик по логотипу
      // с других экранов (где активного черновика уже нет) это не портит.
      resetComposerDraft();
      return go('home');
    case 'go-orders': return go('orders');
    case 'go-notifications': return go('notifications');
    case 'go-profile': return go('profile');
    case 'open-order': return go('orderDetail', { openOrderId: value });
    case 'voice-toggle':
      return toggleVoiceRecording();
    case 'capture-composer-geo':
      return captureComposerAddressGeo();

    // Ручное обновление «Подходит вам рядом» — раньше единственным способом
    // перезапросить список было уйти с экрана «Заказы» и вернуться (или
    // ждать автополлинг/сворачивание вкладки, см. startAvailableOrdersPolling).
    // Кнопка рядом с заголовком снимает зависимость от таймингов полностью:
    // человек всегда может прямо сейчас перепроверить, не «застрял» ли
    // список пустым из-за сетевой ошибки (см. cache.availableOrdersError).
    case 'refresh-available-orders':
      if (cache.availableOrdersLoading) return;
      return refreshAvailableOrders();

    case 'request-telegram-code': {
      const limit = getTelegramLinkLimitState();
      if (!limit.canRequest) return render();
      recordTelegramLinkAttempt();
      window.open(`https://t.me/${TELEGRAM_BOT_USERNAME}`, '_blank', 'noopener');
      return render();
    }
    case 'submit-telegram-code': {
      const el = document.getElementById('telegram-link-code');
      return submitTelegramLinkCode(el ? el.value : '');
    }

    case 'phone-verify-cancel':
      return cancelPhoneCallVerification();
    case 'phone-verify-retry': {
      const user = phoneVerifyState && (cache.users.find((u) => u.id === phoneVerifyState.userId) || { id: phoneVerifyState.userId, phone: phoneVerifyState.phone });
      if (!user) return;
      return beginPhoneCallVerification(user);
    }
    case 'phone-verify-skip':
      return skipPhoneCallVerification();

    case 'password-step-cancel':
      return cancelPasswordStep();

    case 'edit-name':
      return openEditName();
    case 'edit-name-cancel':
      return cancelEditName();

    case 'toggle-specialist-mode':
      state.specialistMode = !state.specialistMode;
      return render();
    case 'specialist-focus-address':
      composerExpandedField = 'address';
      render();
      document.getElementById('composer-address')?.focus();
      return;
    case 'toggle-composer-field': {
      composerExpandedField = composerExpandedField === value ? null : value;
      render();
      const idByField = { address: 'composer-address', date: 'composer-date' };
      if (composerExpandedField && idByField[composerExpandedField]) {
        document.getElementById(idByField[composerExpandedField])?.focus();
      }
      return;
    }
    case 'collapse-composer-field':
      // Не даём закрыть карточку даты/времени, пока интервал обратный —
      // иначе ошибка (см. timeWindowError) исчезает из виду вместе с полями
      // и невозможно понять, что не так (QA-отчёт от 12.09, BUG 01/02).
      if (composerExpandedField === 'date' && composerTimeError) {
        return render();
      }
      composerExpandedField = null;
      return render();
    case 'dismiss-onboarding':
      if (state.infoOverlay === 'short') markOnboardingDismissed();
      state.infoOverlay = null;
      return render();
    case 'show-help':
      state.infoOverlay = 'long';
      return render();
    case 'show-support':
      state.infoOverlay = 'support';
      return render();
    case 'publish-draft': {
      const fullAddressField = document.getElementById('field-full-address');
      if (fullAddressField) state.draft.fullAddress = fullAddressField.value.trim();

      // Имя запрашивается тут же, на экране подтверждения заявки — раньше
      // при входе только по телефону оно никак не собиралось. Спрашиваем,
      // только пока у пользователя ещё нет сохранённого имени.
      const needsName = !currentUser() || !currentUser().displayName;
      let composeNameValue = '';
      if (needsName) {
        const nameField = document.getElementById('compose-name');
        composeNameValue = nameField ? nameField.value.trim() : '';
        if (!composeNameValue) {
          const nameErr = document.getElementById('compose-name-error');
          if (nameErr) {
            nameErr.textContent = 'Укажите ваше имя, чтобы отправить заявку';
            nameErr.style.display = 'block';
          }
          return;
        }
      }

      // Собственно отправка — вынесена в замыкание, т.к. для новых
      // пользователей (см. ниже) она теперь происходит не сразу, а после
      // обязательного экрана пароля (см. enterPasswordStep/onComplete).
      const finishPublish = () => {
        if (needsName && composeNameValue) {
          const nameUser = currentUser();
          if (nameUser && nameUser.displayName !== composeNameValue) {
            saveUser({ ...nameUser, displayName: composeNameValue });
          }
        }
        composeNameFieldValue = '';
        composePhoneFieldValue = '';
        return publishDraft();
      };

      // Телефон запрашивается тут, на экране подтверждения заявки, а не в
      // composer'е — учётка (для новых пользователей) создаётся прямо перед
      // публикацией заказа.
      if (!currentUser()) {
        const composePhone = document.getElementById('compose-phone');
        if (!composePhone || composePhone.dataset.valid !== 'true') {
          const err = document.getElementById('compose-phone-error');
          if (err) {
            err.textContent = 'Укажите номер телефона, чтобы отправить заявку';
            err.style.display = 'block';
          }
          return;
        }
        const sendBtn = document.getElementById('compose-publish-send');
        if (sendBtn) sendBtn.disabled = true;
        try {
          // Берём тот же exactLocation, что и у заказа (startQuickDraft уже
          // нормализовал его — либо реальные координаты, либо сентинел
          // {lat:0,lng:0}, см. hasValidLocation), а не отдельный дефолт
          // CENTER — профиль нового заказчика не должен выглядеть точнее
          // (или неправильнее), чем сама заявка.
          const user = await ensureUserByPhone(composePhone.value, {
            location: state.draft.exactLocation,
            district: state.draft.district,
          });
          // Гостевой чекаут — тоже обязательный пароль (см. README/памятку):
          // заявка доотправится сама через onComplete сразу после успешного
          // пароля/входа, а не раньше.
          enterPasswordStep(user, finishPublish);
        } catch (err) {
          console.error('[compose] phone step failed', err);
          showToast('Не получилось продолжить — попробуйте ещё раз');
          if (sendBtn) sendBtn.disabled = false;
        }
        return;
      }

      return finishPublish();
    }

    case 'accept-order':
      return acceptOrder(value);
    case 'submit-clarification':
      return submitClarificationAnswer(value);
    case 'pay-order':
      return payOrder(value);
    case 'decline-order':
      return declineOrder(value);
    case 'advance-order': {
      const [orderId, next] = value.split(':');
      return advanceWorkerStatus(orderId, next);
    }
    case 'report-issue':
      return reportIssue(value);
    case 'confirm-completion':
      return confirmCompletion(value);
    case 'rate-order': {
      const [orderId, n] = value.split(':');
      return rateOrder(orderId, Number(n));
    }
    case 'rate-customer': {
      const [orderId, n] = value.split(':');
      return rateCustomer(orderId, Number(n));
    }

    case 'use-geo-profile':
      return captureGeolocation();
    case 'save-profile-district':
      return saveProfileDistrict();
    case 'edit-profile-address':
      profileAddressEditing = true;
      render();
      document.getElementById('field-profile-district')?.focus();
      return;
    case 'cancel-edit-profile-address':
      profileAddressEditing = false;
      return render();
    case 'open-map-picker':
      return openMapPicker(value);
    case 'close-map-picker':
      return closeMapPicker();
    case 'save-map-picker':
      return saveMapPicker();
    case 'pick-avatar':
      document.getElementById('profile-avatar-file')?.click();
      return;
    case 'save-radius': {
      const user = currentUser();
      saveUser({ ...user, searchRadiusKm: Number(document.getElementById('field-radius').value || 3) });
      showToast('Радиус сохранён');
      return render();
    }
    case 'toggle-skill-picker':
      // Открыт максимум один рейтинг за раз — клик по уже открытому навыку закрывает его.
      state.openSkillPicker = state.openSkillPicker === value ? null : value;
      return render();
    case 'set-skill-level': {
      const [catId, levelStr] = value.split(':');
      return setUserSkillLevel(catId, Number(levelStr));
    }
    case 'switch-demo-user': {
      state.currentUserId = document.getElementById('field-demo-user').value;
      showToast('Демо-пользователь переключён');
      return render();
    }
    case 'toggle-service': {
      const services = getServices();
      const s = services.find((x) => x.id === value);
      s.active = !s.active;
      saveService(s);
      return render();
    }
    case 'reset-demo': {
      resetDb(buildInitialDb());
      showToast('Демо-данные сброшены');
      return render();
    }
    case 'logout':
      return logout();
    default:
      return;
  }
}

async function boot() {
  setSyncErrorHandler(showToast);
  render(); // показать экран загрузки сразу
  await initDb(buildInitialDb());

  if (isSupabaseConfigured() && hadBootLoadFailure()) {
    state.booting = false;
    state.screen = 'bootError';
    return render();
  }

  if (isSupabaseConfigured()) {
    // Пробуем восстановить сессию по сохранённому id пользователя, но НЕ
    // требуем входа для просмотра главной страницы — заявку можно начать
    // без авторизации, номер телефона спросим прямо в форме отправки.
    const saved = loadSession();
    const savedToken = loadSessionToken();
    let user = null;
    if (saved) {
      user = getUsers().find((u) => u.id === saved) || null;
    }
    if (user && savedToken) {
      // Токен сессии выдаётся только после успешного пароля/входа (см.
      // set-password/login-with-password) — раз он есть на этом
      // устройстве, доверяем ему и не спрашиваем пароль заново при
      // каждом открытии (это и есть «запомнить устройство», см. README).
      state.currentUserId = user.id;
    } else if (user && !savedToken) {
      // Раньше отсюда тихо выпускался токен по одному лишь сохранённому
      // id из localStorage — без единой проверки (см. README/памятку про
      // уязвимость «войти под кем угодно, зная/подставив id»). Теперь
      // вместо этого просто не восстанавливаем сессию: человек попадёт на
      // обычный вход по телефону и (обязательно) пароль, как при первом
      // визите. Разово затронет тех, кто был в сессии ДО этого пароля.
      clearSession();
    } else if (saved) {
      clearSession();
    }
  } else {
    // Локальная разработка без Supabase: как раньше, сразу демо-пользователь.
    state.currentUserId = getUsers()[0]?.id ?? null;
  }
  state.screen = 'home';

  // Краткая карточка-подсказка сама всплывает при старте, пока человек не
  // авторизован (телефон/Telegram не привязаны). Подробное объяснение
  // работы сайта в любой момент открывается кнопкой «?» в шапке. Картинка
  // в этой карточке — реальная карта зоны покрытия мастеров (см.
  // renderOnboardingOverlay).
  state.infoOverlay = currentUser() || wasOnboardingDismissed() ? null : 'short';

  state.booting = false;
  console.info(assistantDemoNotice());
  render();
}

boot();

// Вкладку свернули или браузер закрыли и вернулись обратно, пока были на
// экране «Заказы», — сразу подтягиваем актуальный список кандидатов, не
// дожидаясь следующего тика поллинга (см. startAvailableOrdersPolling выше).
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.screen === 'orders') refreshAvailableOrders();
});

// Регистрация service worker для PWA/офлайн app-шелла (см. sw.js —
// намеренно network-first, чтобы новый деплой всегда был виден). Только
// на главном сайте, не в admin.html — там регистрации нет вообще.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch((err) => {
      console.error('[sw] регистрация не удалась', err);
    });
  });
}

})();
  </script>
