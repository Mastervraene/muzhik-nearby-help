<style>
/* Только мобильная раскладка. Оттенки серого (цвет не используется намеренно). */

:root {
  --gray-0: #ffffff;
  --gray-50: #f7f7f7;
  --gray-100: #eeeeee;
  --gray-200: #dddddd;
  --gray-300: #c4c4c4;
  --gray-400: #9c9c9c;
  --gray-500: #767676;
  --gray-600: #545454;
  --gray-700: #383838;
  --gray-800: #232323;
  --gray-900: #121212;
  --accent: #2563eb;
  --accent-strong: #1d4ed8;
  --accent-soft: #eff6ff;
  --accent-muted: #a8c8fb;
  /* Бейджи непрочитанных уведомлений (шапка + попап аккаунта) — намеренно
     красный, не в тон общей палитре: должны привлекать внимание. */
  --notify-badge: #e02424;
  --radius: 20px;
  --radius-sm: 14px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 1px rgba(15, 23, 42, 0.03);
  --shadow-md: 0 2px 6px rgba(15, 23, 42, 0.05), 0 14px 32px rgba(15, 23, 42, 0.08);
  --danger: #6b6b6b; /* без цвета — предупреждения выделяются текстурой/жирностью, не цветом */
  --max-width: 480px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden; /* страница не скроллится целиком — внутри скроллится только .screen */
  background: var(--gray-0);
  color: var(--gray-800);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  display: flex;
  justify-content: center;
  /* 100dvh, а не 100vh — на мобильных 100vh считает высоту без вычета
     адресной строки браузера, из-за чего низ страницы (поле ввода)
     оказывался за пределами видимой области и требовал прокрутки. */
  height: 100vh;
  height: 100dvh;
}

.app-shell {
  width: 100%;
  max-width: var(--max-width);
  height: 100%;
  background: var(--gray-0);
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ---------- Header ---------- */

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  /* Плавный переход вместо жёсткой границы: верх шапки почти непрозрачный
     (логотип/заголовок/иконка профиля остаются чёткими), к низу самой
     шапки уже уходит в прозрачность — контент под ней не обрезается
     резкой линией, а мягко тает. Основную часть растяжки даёт ::after
     ниже — она продолжает угасание на content под шапкой. */
  background: linear-gradient(to bottom, rgba(255, 255, 255, 0.97) 0%, rgba(255, 255, 255, 0.97) 65%, rgba(255, 255, 255, 0) 100%);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 10;
}

.topbar::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 100%;
  height: 28px;
  background: linear-gradient(to bottom, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0));
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  pointer-events: none;
}

.logo-slot {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  object-fit: cover;
  flex-shrink: 0;
}

.brand-block {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--gray-900);
}

.brand-sub {
  font-size: 11px;
  color: var(--gray-500);
  display: block;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.icon-button {
  border: none;
  background: var(--gray-100);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--gray-700);
  position: relative;
}

.icon-button .badge {
  position: absolute;
  top: -2px;
  right: -2px;
  background: var(--notify-badge);
  color: var(--gray-0);
  font-size: 10px;
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 3px;
}

/* ---------- Avatar menu (попап аккаунта в шапке) ---------- */

.avatar-menu-anchor {
  position: relative;
}

.avatar-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 240px;
  background: var(--gray-0, #fff);
  border-radius: 14px;
  box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08), 0 12px 32px rgba(15, 23, 42, 0.12);
  padding: 8px;
  z-index: 30;
}

.avatar-menu-header {
  padding: 8px 10px 10px;
}

.avatar-menu-name {
  font-weight: 700;
  font-size: 14px;
  color: var(--gray-900);
}

.avatar-menu-phone {
  font-size: 12px;
  color: var(--gray-500);
  margin-top: 2px;
}

.avatar-menu-divider {
  height: 1px;
  background: var(--gray-100);
  margin: 4px 0;
}

.avatar-menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  border: none;
  background: transparent;
  padding: 9px 10px;
  border-radius: 10px;
  font-size: 14px;
  color: var(--gray-800, var(--gray-900));
  text-align: left;
  cursor: pointer;
}

.avatar-menu-item:hover,
.avatar-menu-item:active {
  background: var(--gray-100);
}

.avatar-menu-item-icon {
  width: 20px;
  text-align: center;
  flex-shrink: 0;
}

.avatar-menu-item-label {
  flex: 1;
}

.avatar-menu-item-badge {
  background: var(--notify-badge);
  color: var(--gray-0);
  font-size: 10px;
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 3px;
  flex-shrink: 0;
}

.avatar-menu-item-danger {
  color: #d33;
}

/* ---------- Bottom nav ---------- */

.bottom-nav {
  display: flex;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 -1px 2px rgba(15, 23, 42, 0.04), 0 -8px 24px rgba(15, 23, 42, 0.06);
  position: sticky;
  bottom: 0;
  z-index: 10;
}

.bottom-nav button {
  flex: 1;
  border: none;
  background: transparent;
  padding: 10px 4px 14px;
  font-size: 11px;
  color: var(--gray-500);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.bottom-nav button.active {
  color: var(--accent);
  font-weight: 700;
}

.bottom-nav .nav-icon {
  font-size: 18px;
}

/* ---------- Main content ---------- */

.screen {
  flex: 1;
  /* min-height:0 — иначе флекс-элемент не сжимается до отведённого места
     и «выталкивает» контент (включая composer) за пределы экрана вместо
     появления внутренней прокрутки. */
  min-height: 0;
  padding: 16px;
  padding-bottom: 24px;
  overflow-y: auto;
}

/* ---------- Home / composer (главный экран как в чате) ---------- */

.home-screen {
  display: flex;
  flex-direction: column;
  padding-bottom: 6px;
}

.home-hero-wrap {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.home-hero {
  text-align: center;
  padding: 10px 8px;
  transition: opacity 0.18s ease, transform 0.18s ease;
  opacity: 1;
}

.home-hero.is-hidden {
  opacity: 0;
  transform: translateY(-6px);
  pointer-events: none;
}

.home-hero h1 {
  font-family: "Oswald", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 0.01em;
  margin: 0;
  color: var(--gray-900);
}

.composer-card {
  background: var(--gray-0);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius);
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06), 0 16px 36px rgba(15, 23, 42, 0.1);
  padding: 14px;
}

.legal-footer {
  margin: 6px 4px 0;
  font-size: 9px;
  line-height: 1.3;
  color: var(--gray-500);
  text-align: center;
}

.composer-textarea {
  display: block;
  width: 100%;
  height: 24px;
  min-height: 24px;
  max-height: 160px;
  border: none;
  resize: none;
  font-size: 15px;
  line-height: 24px;
  font-family: inherit;
  color: var(--gray-900);
  outline: none;
  background: transparent;
  overflow-y: auto;
}

.composer-textarea::placeholder {
  color: var(--gray-400);
}

.composer-hint {
  font-size: 12px;
  color: var(--gray-400);
  margin: 2px 0 10px;
}

.composer-chip-row {
  display: flex;
  gap: var(--composer-gap);
  flex-wrap: nowrap;
  flex: 0 1 auto;
  min-width: 0;
}

.composer-chip {
  border: none;
  background: var(--gray-100);
  color: var(--gray-600);
  padding: clamp(6px, 2vw, 8px) clamp(6px, 2vw, 9px);
  border-radius: 999px;
  font-size: clamp(11px, 3vw, 12.5px);
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex: 0 1 auto;
  max-width: clamp(68px, 24vw, 100px);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.composer-chip.filled {
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-weight: 600;
}

.composer-field-inline {
  margin-top: 10px;
  background: var(--gray-50);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.composer-field-inline input[type="text"],
.composer-field-inline input[type="date"],
.composer-field-inline input[type="time"] {
  width: 100%;
  border: 1px solid var(--gray-200);
  background: var(--gray-0);
  border-radius: 10px;
  padding: 9px 10px;
  font-size: 14px;
  font-family: inherit;
  color: var(--gray-900);
}

.composer-field-inline .composer-field-row {
  display: flex;
  gap: 8px;
}

.composer-field-inline .composer-field-row input {
  flex: 1;
  min-width: 0;
}

.composer-field-done {
  align-self: flex-end;
  border: none;
  background: var(--accent);
  color: var(--gray-0);
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
}

.composer-actions {
  --composer-gap: clamp(5px, 1.8vw, 7px);
  display: flex;
  align-items: center;
  gap: var(--composer-gap);
  padding-top: 10px;
  margin-top: 10px;
}

.composer-tools {
  display: flex;
  gap: var(--composer-gap);
  flex-shrink: 0;
}

.composer-actions > .composer-tools:last-child {
  margin-left: auto;
}

.tool-button,
.send-button {
  border: none;
  width: clamp(26px, 7.5vw, 30px);
  height: clamp(26px, 7.5vw, 30px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 0;
}

.tool-button {
  background: var(--gray-100);
  color: var(--gray-600);
}

.tool-button svg,
.send-button svg {
  width: 46%;
  height: 46%;
  display: block;
}

/*
 * Три градации цвета кнопки отправки заявки (composer-send), вместо
 * жёсткого disabled — так нажатие всегда что-то отвечает, а не просто
 * молчит, если человек пытается отправить раньше времени:
 *   1. .send-button (без модификатора) — ничего не заполнено, бесцветная;
 *   2. .send-button.grade-2 — текст задачи есть, адреса ещё нет;
 *   3. .send-button.grade-3 — и текст, и адрес заполнены, готово к отправке.
 * Классы навешивает updateComposerSendState().
 */
.send-button {
  background: var(--gray-300);
  color: var(--gray-0);
  transition: background-color 0.15s ease;
}

.send-button.grade-2 {
  background: var(--accent-muted);
}

.send-button.grade-3 {
  background: var(--accent);
}

.tool-button.recording {
  background: var(--gray-900);
  color: var(--gray-0);
}

.composer-geo-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.composer-geo-button svg {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
}

.composer-assistant-hint:empty {
  display: none;
}

.composer-sanitize-hint {
  font-size: 11.5px;
  color: var(--gray-500);
  margin-top: 2px;
}

.composer-sanitize-hint:empty {
  display: none;
}

/* Выпадающий список подсказок реального адреса (Яндекс.Геокодер) —
   добавляется прямо под текстовым полем адреса, без полного render(),
   чтобы не терять фокус/курсор во время набора (см. wireAddressSuggestions). */
.address-suggest-list {
  border: 1px solid var(--gray-200);
  border-radius: 10px;
  overflow: hidden;
  max-height: 220px;
  overflow-y: auto;
}

.address-suggest-list:empty {
  display: none;
  border: none;
}

.address-suggest-item {
  display: block;
  width: 100%;
  text-align: left;
  border: none;
  border-bottom: 1px solid var(--gray-100);
  background: var(--gray-0);
  padding: 9px 10px;
  font-size: 13px;
  font-family: inherit;
  color: var(--gray-800);
  cursor: pointer;
}

.address-suggest-item:last-child {
  border-bottom: none;
}

.address-suggest-item:hover,
.address-suggest-item:active {
  background: var(--accent-soft);
  color: var(--accent-strong);
}

.msg.assistant .assistant-suggestion-text {
  display: block;
  margin-bottom: 6px;
}

.assistant-suggestion-btn {
  border: none;
  background: var(--gray-900);
  color: var(--gray-0);
  font-size: 12px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 999px;
}

.attachment-preview {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.attachment-chip {
  font-size: 11px;
  background: var(--gray-100);
  color: var(--gray-600);
  padding: 4px 8px;
  border-radius: 999px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.attachment-chip button {
  border: none;
  background: transparent;
  color: var(--gray-500);
  font-size: 12px;
  padding: 0;
}

.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--gray-600);
  text-transform: uppercase;
  letter-spacing: 0.02em;
  margin: 22px 0 10px;
}

/* Заголовок секции с кнопкой ручного обновления рядом (см. «Подходит вам
   рядом» на экране «Заказы») — сам .section-title остаётся как есть везде,
   где кнопка не нужна. */
.section-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin: 22px 0 10px;
}
.section-title-row .section-title {
  margin: 0;
}
.section-refresh-btn {
  flex: none;
  border: none;
  background: var(--gray-100);
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 999px;
}
.section-refresh-btn:disabled {
  color: var(--gray-400);
}
.available-orders-error {
  background: #fff7ed;
  color: #9a5b13;
  border: 1px solid #fed7aa;
  border-radius: var(--radius-sm);
  padding: 12px;
  font-size: 13.5px;
  margin-bottom: 6px;
}

/* Кнопки справа от заголовка секции (кнопка «Обновить» + кнопка сортировки,
   см. section-title-row-actions ниже) — раньше в этом месте была только
   одна кнопка, поэтому обёртка не требовалась. */
.section-title-row-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: none;
}

/* Маленькая кнопка сортировки/фильтра рядом с заголовком блока заказов
   (см. renderOrdersSectionHeader/ordersSortSettings рядом с renderOrders) —
   открывает полноэкранную модалку renderOrdersSortModal, по образцу
   «Сортировки на карте» в админке (admin.html, renderMapSortModal): там же
   позаимствован приём с кнопками-переключателями (.sort-pill ниже). Фон
   модалки — переиспользованный .map-picker-overlay, карточка —
   .orders-sort-card чуть ниже. */
.sort-btn {
  flex: none;
  border: none;
  background: var(--gray-100);
  color: var(--gray-600);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.sort-btn svg {
  width: 14px;
  height: 14px;
}
/* Синим — когда в этом блоке включена сортировка и/или скрыты какие-то
   статусы фильтром; в остальное время кнопка нейтрального цвета панели
   (var(--gray-100), как и все прочие маленькие кнопки рядом с заголовками). */
.sort-btn.active {
  background: var(--accent);
  color: var(--gray-0);
}
.orders-sort-card {
  width: 100%;
  max-width: 420px;
  max-height: 86vh;
  background: var(--gray-0);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: onboarding-rise 0.2s ease-out;
}
.orders-sort-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 16px 18px;
  border-bottom: 1px solid var(--gray-100);
  flex-shrink: 0;
}
.orders-sort-head h2 {
  font-size: 16px;
  font-weight: 700;
  color: var(--gray-900);
  margin: 0;
}
.orders-sort-close {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: var(--gray-100);
  color: var(--gray-600);
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
}
.orders-sort-body {
  padding: 16px 18px;
  overflow-y: auto;
  min-height: 0;
}
.orders-sort-section + .orders-sort-section {
  margin-top: 18px;
}
.orders-sort-section-label {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--gray-500);
  text-transform: uppercase;
  letter-spacing: 0.02em;
  margin: 0 0 8px;
}
.orders-sort-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.sort-pill {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--gray-200);
  background: var(--gray-0);
  color: var(--gray-700);
  font-size: 12.5px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
}
.sort-pill.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--gray-0);
}
.orders-sort-actions {
  display: flex;
  gap: 8px;
  padding: 14px 18px;
  border-top: 1px solid var(--gray-100);
  flex-shrink: 0;
}
.orders-sort-actions button {
  flex: 1;
  margin-top: 0;
}

/* ---------- Chat dialog (уточнение деталей) ---------- */

.chat-thread {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.msg {
  max-width: 86%;
  padding: 10px 12px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.35;
}

.msg.assistant {
  align-self: flex-start;
  background: var(--gray-100);
  color: var(--gray-800);
  border-bottom-left-radius: 4px;
}

.msg.user {
  align-self: flex-end;
  background: var(--gray-900);
  color: var(--gray-0);
  border-bottom-right-radius: 4px;
}

.msg small {
  display: block;
  margin-top: 4px;
  opacity: 0.7;
  font-size: 11px;
}

.field-card {
  background: var(--gray-0);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 14px;
  margin-top: 10px;
}

.field-card label {
  display: block;
  font-size: 12.5px;
  color: var(--gray-600);
  margin-bottom: 6px;
}

.field-card input[type="text"],
.field-card input[type="date"],
.field-card input[type="number"],
.field-card input[type="password"],
.field-card select,
.field-card textarea {
  width: 100%;
  border: 1px solid var(--gray-200);
  border-radius: 10px;
  padding: 10px;
  font-size: 14px;
  font-family: inherit;
  color: var(--gray-900);
  background: var(--gray-50);
  margin-bottom: 10px;
}

.chip-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.chip-row button {
  border: none;
  background: var(--gray-100);
  color: var(--gray-700);
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 12.5px;
}

.chip-row button.selected {
  background: var(--accent);
  color: var(--gray-0);
}

.primary-button {
  width: 100%;
  border: none;
  background: var(--accent);
  color: var(--gray-0);
  padding: 13px;
  border-radius: var(--radius-sm);
  font-size: 14.5px;
  font-weight: 700;
}

.primary-button:disabled {
  background: var(--gray-300);
}

.secondary-button {
  width: 100%;
  border: none;
  background: var(--gray-100);
  color: var(--gray-700);
  padding: 12px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  margin-top: 8px;
}

/* ---------- Cards (заказы) ---------- */

.order-card {
  background: var(--gray-0);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 14px;
  margin-bottom: 10px;
}

.order-card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}

.order-title {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--gray-900);
  margin: 0 0 4px;
}

.status-pill {
  font-size: 10.5px;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--gray-800);
  color: var(--gray-0);
  white-space: nowrap;
}

.status-pill.muted {
  background: var(--gray-200);
  color: var(--gray-600);
}

.order-meta {
  font-size: 12px;
  color: var(--gray-500);
  margin: 6px 0 0;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.order-warning {
  margin-top: 8px;
  font-size: 12px;
  color: var(--gray-700);
  background: var(--gray-100);
  border-left: 3px solid var(--gray-500);
  padding: 6px 8px;
  border-radius: 6px;
}

/* ---------- Блок заработка мастера в карточке заказа (см. renderWorkerPayoutBlock) ---------- */
.worker-payout {
  margin-top: 10px;
}

.worker-payout-price {
  font-size: 12px;
  color: var(--gray-500);
  margin: 0;
}

.worker-payout-earn-label {
  font-size: 14px;
  color: var(--gray-800);
  margin: 4px 0 0;
}

.worker-payout-earn-amount {
  font-size: 27px;
  font-weight: 800;
  color: var(--accent);
  margin: 0;
  line-height: 1.25;
}

.location-confirm {
  margin-top: 10px;
}

.location-confirm-map {
  height: 220px;
  border-radius: var(--radius-sm, 10px);
  overflow: hidden;
  box-shadow: var(--shadow-sm, 0 1px 4px rgba(0,0,0,0.08));
  background: var(--gray-100);
}

.location-confirm-hint {
  font-size: 12px;
  color: var(--gray-500);
  margin: 6px 0 0;
}

.location-confirm-address {
  font-size: 13px;
  color: var(--gray-700);
  margin: 6px 0 0;
  font-weight: 500;
}

/* Ссылка «Указать на карте» под строкой ввода адреса (и в профиле, и при
   оформлении заказа) — открывает .map-picker-overlay ниже. */
.map-pick-link {
  display: flex;
  align-items: center;
  gap: 6px;
  align-self: flex-start;
  background: none;
  border: none;
  padding: 2px 0;
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  cursor: pointer;
}
.map-pick-link:active {
  opacity: 0.7;
}

/* ---------- Всплывающий выбор точки на карте (map-picker) ---------- */
/* Открывается кнопкой «Указать на карте» — из профиля (адрес мастера) и
   из адреса заявки при оформлении. Центрированное модальное окно, а не
   нижняя шторка (как онбординг) — карте нужна предсказуемая высота, а не
   высота, «съезжающая» при свайпе. Высота считается в vh с потолком в px,
   чтобы окно гарантированно помещалось целиком даже на очень маленьком
   экране телефона и не обрезало кнопки «Сохранить»/«Закрыть» снизу. */
.map-picker-overlay {
  position: fixed;
  inset: 0;
  background: rgba(18, 18, 18, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 150;
  padding: 16px;
}

.map-picker-card {
  width: 100%;
  max-width: 480px;
  /* Раньше здесь был только max-height — без явной height flex-колонка
     сама сжималась по контенту (шапка+подсказка+кнопки), и карте ниже
     (flex:1 1 auto) было нечего «занимать»: она получала 0px высоты и
     оставалась невидимой, хотя JS честно создавал ymaps.Map внутри неё
     (баг, который клиент увидел вживую — попап показывал текст, но не
     саму карту). Явная height даёт колонке фиксированный размер, и
     .map-picker-map получает реальное место. */
  height: min(560px, 92vh);
  max-height: min(560px, 92vh);
  background: var(--gray-0);
  border-radius: var(--radius, 16px);
  box-shadow: var(--shadow-md, 0 8px 40px rgba(15, 23, 42, 0.18));
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: onboarding-rise 0.2s ease-out;
}

.map-picker-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--gray-100);
  flex-shrink: 0;
}

.map-picker-head h2 {
  font-size: 16px;
  font-weight: 700;
  color: var(--gray-900);
  margin: 0;
}

.map-picker-close {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: var(--gray-100);
  color: var(--gray-600);
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* flex:1 — карта занимает всё, что осталось от окна после шапки/подсказки/
   кнопок (у .map-picker-card теперь есть явная height, так что тут есть,
   из чего расти — см. комментарий там). min-height:160px — подстраховка
   на случай совсем маленького экрана: шапка и кнопки «Сохранить»/
   «Закрыть» (у них flex-shrink:0) не обрезаются, а карта не пропадает
   полностью — это единственный способ закрыть попап и сохранить
   результат. */
.map-picker-map {
  flex: 1 1 auto;
  min-height: 160px;
  background: var(--gray-100);
}

.map-picker-address {
  font-size: 13px;
  color: var(--gray-700);
  font-weight: 500;
  margin: 0;
  padding: 8px 16px;
  border-top: 1px solid var(--gray-100);
  flex-shrink: 0;
}

.map-picker-actions {
  display: flex;
  gap: 8px;
  padding: 12px 16px 16px;
  flex-shrink: 0;
}

.map-picker-actions button {
  flex: 1;
  margin-top: 0;
}

/* ---------- Адрес мастера подтверждён (профиль) ---------- */
.profile-address-confirmed {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 6px 0 0;
  font-size: 14px;
  color: var(--gray-900);
}

.profile-address-check {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent-soft, #e0f2ea);
  color: var(--accent-strong, #1a7f4e);
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
}

/* ---------- Значок «карандаш» поверх аватарки и рядом с именем (профиль) ---------- */
.profile-avatar-edit-badge {
  position: absolute;
  bottom: -2px;
  right: -2px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--gray-0, #fff);
  flex-shrink: 0;
}

.profile-avatar-edit-badge svg {
  width: 11px;
  height: 11px;
}

.icon-edit-btn {
  border: none;
  background: var(--gray-100);
  color: var(--gray-600);
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  cursor: pointer;
}

.icon-edit-btn svg {
  width: 13px;
  height: 13px;
}

.empty-state {
  text-align: center;
  color: var(--gray-400);
  font-size: 13px;
  padding: 40px 10px;
}

.boot-error-screen {
  display: flex;
  align-items: center;
  justify-content: center;
}

.boot-error-card {
  max-width: 340px;
  text-align: center;
  background: var(--gray-0);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 28px 22px;
}

.boot-error-code {
  font-family: "Oswald", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  font-weight: 700;
  font-size: 52px;
  line-height: 1;
  letter-spacing: -0.02em;
  color: var(--accent);
  margin: 0 0 12px;
}

(function(){
"use strict";

// ---- js/domain/orderStateMachine.js ----
/**
 * Машина состояний заказа. Единственное место, где разрешаются или
 * запрещаются переходы статуса. UI и адаптеры не должны содержать
 * собственную логику допустимости перехода — только вызывать transition().
 */

/** @type {Record<string, string[]>} */
const ALLOWED_TRANSITIONS = {
  draft: ['collecting_details', 'cancelled'],
  // collecting_details теперь означает «на проверке» (первичная модерация
  // администратором, см. STATUS_LABELS и publishDraft) — заказ либо
  // одобряют (→ estimate_ready — см. admin.html approveOrder), либо он
  // остаётся здесь/отменяется.
  collecting_details: ['estimate_ready', 'draft', 'cancelled'],
  // clarification_requested — админ поставил заказ на паузу вопросом
  // клиенту прямо на модерации (см. admin.html requestClarification), когда
  // без ответа нельзя посчитать цену (пример: навеска на стену — цена
  // зависит от материала). В этот статус заказ переводит ТОЛЬКО админ
  // напрямую в базе (минуя эту машину состояний, как и approveOrder), а
  // обратно в collecting_details его возвращает уже клиент — отправив ответ
  // (см. submitClarificationAnswer).
  clarification_requested: ['collecting_details', 'cancelled'],
  // estimate_ready теперь означает «ожидает оплаты»: цена уже выставлена
  // модератором, и заказчик видит экран оплаты-имитации (кнопки
  // «Оплатить»/«Отказаться», см. payOrder/declineOrder) — реального
  // эквайринга нет, см. paymentAdapter. «Оплатить» переводит заказ сразу
  // в paid и следом в searching (см. payOrder) — «оплачено» видно как шаг
  // в истории заказа, а искать мастеров начинаем с того же клика.
  estimate_ready: ['paid', 'cancelled'],
  paid: ['searching', 'cancelled'],
  searching: ['assigned', 'cancelled'],
  assigned: ['en_route', 'cancelled', 'issue_reported'],
  en_route: ['in_progress', 'issue_reported', 'cancelled'],
  in_progress: ['completed', 'issue_reported'],
  completed: ['confirmed', 'issue_reported'],
  confirmed: ['rated'],
  rated: [],
  cancelled: [],
  issue_reported: ['searching', 'cancelled', 'in_progress', 'assigned'],
};

class InvalidTransitionError extends Error {
  constructor(from, to) {
    super(`Недопустимый переход статуса заказа: ${from} → ${to}`);
    this.name = 'InvalidTransitionError';
    this.from = from;
    this.to = to;
  }
}

/**
 * @param {import('./types.js').Order} order
 * @param {import('./types.js').OrderStatus} nextStatus
 * @returns {import('./types.js').Order} новый объект заказа (не мутирует исходный)
 */
function transition(order, nextStatus) {
  const allowed = ALLOWED_TRANSITIONS[order.status] || [];
  if (!allowed.includes(nextStatus)) {
    throw new InvalidTransitionError(order.status, nextStatus);
  }
  return {
    ...order,
    status: nextStatus,
    timeline: [...order.timeline, { status: nextStatus, at: new Date().toISOString() }],
  };
}

function canTransition(fromStatus, toStatus) {
  return (ALLOWED_TRANSITIONS[fromStatus] || []).includes(toStatus);
}


// ---- js/domain/pricing.js ----
/**
 * Расчёт предварительной цены на основе каталога услуг.
 *
 * По требованию заказчика: ассистент не должен «выдумывать» цену.
 * Если задача сопоставляется с позицией каталога — используется
 * диапазон каталога с модификаторами. Если совпадения нет — заказ
 * помечается как прецедент (isPrecedent = true), и цена определяется
 * переговорами клиента и мастера (см. negotiation в types.js). После
 * закрытия такого заказа оператор может добавить согласованную цену
 * в каталог как новую позицию (см. createCatalogItemFromPrecedent).
 */

/** @type {Record<string, (basePrice:number, ctx:any)=>number>} */
const MODIFIERS = {
  urgency_urgent: (price) => price * 1.25,
  high_quantity: (price, ctx) => price * Math.max(1, ctx.quantity || 1) * 0.9,
  hard_access: (price) => price * 1.15,
  needs_materials: (price) => price * 1.1,
};

/**
 * Доля мастера от суммы, которую платит заказчик, — комиссия площадки
 * (сейчас 30%) удерживается автоматически, остальное получает мастер.
 * Пока единая ставка для всех заказов; появится дифференциация по
 * категориям/мастерам — выносить в каталог/профиль, а не хардкодить здесь.
 */
const WORKER_PAYOUT_RATE = 0.7;

/** Сколько мастер получит на руки с суммы, которую платит заказчик. Округляем
 * до рубля — копейки в демо-режиме ни к чему. */
function workerPayout(customerAmount) {
  return Math.round(customerAmount * WORKER_PAYOUT_RATE);
}

/**
 * @param {import('./types.js').ServiceCatalogItem[]} catalog
 * @param {{categoryId:string, keywords?:string[]}} taskHint
 * @returns {import('./types.js').ServiceCatalogItem|null}
 */
function matchCatalogItem(catalog, taskHint) {
  const activeInCategory = catalog.filter(
    (item) => item.active && item.categoryId === taskHint.categoryId
  );
  if (activeInCategory.length === 0) return null;

  if (taskHint.keywords && taskHint.keywords.length > 0) {
    const lowerKeywords = taskHint.keywords.map((k) => k.toLowerCase());
    const byTitle = activeInCategory.find((item) =>
      lowerKeywords.some((k) => item.title.toLowerCase().includes(k))
    );
    if (byTitle) return byTitle;
  }
  return activeInCategory[0];
}

/**
 * @param {import('./types.js').ServiceCatalogItem} item
 * @param {{quantity?:number, urgency?:string, hardAccess?:boolean, needsMaterials?:boolean}} ctx
 * @returns {{min:number, max:number, factors:string[]}}
 */
function calculateEstimate(item, ctx = {}) {
  let min = item.basePriceMin;
  let max = item.basePriceMax;
  const factors = [];

  if (ctx.urgency === 'urgent' && item.modifiers.includes('urgency_urgent')) {
    min = MODIFIERS.urgency_urgent(min, ctx);
    max = MODIFIERS.urgency_urgent(max, ctx);
    factors.push('Срочность (сегодня/в течение часов)');
  }
  if ((ctx.quantity || 1) > 1 && item.modifiers.includes('high_quantity')) {
    min = MODIFIERS.high_quantity(min, ctx);
    max = MODIFIERS.high_quantity(max, ctx);
    factors.push(`Количество: ${ctx.quantity}`);
  }
  if (ctx.hardAccess && item.modifiers.includes('hard_access')) {
    min = MODIFIERS.hard_access(min);
    max = MODIFIERS.hard_access(max);
    factors.push('Затруднённый доступ к месту работы');
  }
  if (ctx.needsMaterials && item.modifiers.includes('needs_materials')) {
    min = MODIFIERS.needs_materials(min);
    max = MODIFIERS.needs_materials(max);
    factors.push('Требуются материалы');
  }

  return {
    min: Math.round(min),
    max: Math.round(max),
    factors,
  };
}

/**
 * Создаёт кандидата в каталог из закрытого заказа-прецедента.
 * Не добавляет автоматически — решение принимает оператор.
 * @param {import('./types.js').Order} order
 * @returns {import('./types.js').ServiceCatalogItem}
 */
function createCatalogItemFromPrecedent(order) {
  const agreed =
    order.negotiation.workerOffer ?? order.negotiation.customerOffer ?? 0;
  const spread = Math.max(200, Math.round(agreed * 0.15));
  return {
    id: `precedent-${order.id}`,
    categoryId: order.categoryId,
    title: order.title,
    basePriceMin: Math.max(0, agreed - spread),
    basePriceMax: agreed + spread,
    unit: 'услуга',
    modifiers: [],
    riskFlag: false,
    active: false, // оператор включает вручную после проверки
    origin: 'precedent',
  };
}

function compareBudgetToEstimate(customerBudget, estimate) {
  if (customerBudget == null) return { warning: null };
  if (customerBudget < estimate.min) {
    return {
      warning:
        'Указанный бюджет ниже предварительной оценки. Заказ можно опубликовать, но откликов может быть меньше.',
    };
  }
  return { warning: null };
}


// ---- js/domain/matching.js ----
/**
 * Подбор исполнителей.
 *
 * Важное требование заказчика: подбор должен идти через запрос к базе
 * данных (по координатам, сохранённым в профиле), а НЕ через обращение
 * к карте/геокодеру на каждый поиск — иначе при росте числа заказов и
 * пользователей это не будет масштабироваться.
 *
 * В прототипе это реализовано как чистая функция над массивом
 * пользователей (эквивалент выборки из локального хранилища). Для
 * продакшена — тот же алгоритм переносится в SQL-запрос к Supabase
 * (Postgres) с использованием предвычисленного bounding box по
 * широте/долготе + индекса, либо расширения earthdistance/PostGIS,
 * например:
 *
 *   select * from users
 *   where available_as_worker = true
 *     and not blocked
 *     and lat between :minLat and :maxLat
 *     and lng between :minLng and :maxLng
 *   order by (point(lng,lat) <@> point(:orderLng,:orderLat)) asc
 *
 * Bounding box отсекает большинство строк по индексу ДО точного расчёта
 * расстояния — так поиск остаётся быстрым при большой базе.
 */

/**
 * lat/lng === 0 — наш «пустой» сентинел для точки на карте (реальный адрес
 * в Москве никогда не попадёт ровно в (0,0), это Гвинейский залив), а не
 * настоящая координата. Колонки exact_lat/exact_lng и lat/lng в БД — NOT
 * NULL, поэтому null туда не запишешь; вместо null-проверки используем
 * этот сентинел везде, где раньше подставлялся CENTER/старая точка —
 * см. startQuickDraft, saveProfileDistrict. Отсутствие валидной точки — это
 * сигнал не рисовать метку на карте (см. fillMapPoints в admin.html) и
 * показать предупреждение в UI, а не подставлять случайную координату.
 */
function hasValidLocation(loc) {
  return Boolean(loc && loc.lat && loc.lng);
}

const EARTH_RADIUS_KM = 6371;

/**
 * @param {import('./types.js').GeoPoint} a
 * @param {import('./types.js').GeoPoint} b
 */
function distanceKm(a, b) {
  const dLat = ((b.lat - a.lat) * Math.PI) / 180;
  const dLng = ((b.lng - a.lng) * Math.PI) / 180;
  const lat1 = (a.lat * Math.PI) / 180;
  const lat2 = (b.lat * Math.PI) / 180;

  const h =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
  const c = 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
  return EARTH_RADIUS_KM * c;
}

/** Bounding box для быстрого предварительного отсева по индексу. */
function boundingBox(center, radiusKm) {
  const latDelta = radiusKm / 111; // ~111 км на градус широты
  const lngDelta =
    radiusKm / (111 * Math.cos((center.lat * Math.PI) / 180) || 1);
  return {
    minLat: center.lat - latDelta,
    maxLat: center.lat + latDelta,
    minLng: center.lng - lngDelta,
    maxLng: center.lng + lngDelta,
  };
}

/**
 * @param {import('./types.js').User[]} users
 * @param {import('./types.js').Order} order
 * @returns {Array<{user: import('./types.js').User, distanceKm: number}>}
 */
function findCandidateWorkers(users, order) {
  const box = boundingBox(order.exactLocation, 3); // радиус по умолчанию 3 км
  return users
    .filter((u) => !u.blocked)
    .filter((u) => u.availableAsWorker)
    .filter((u) => u.id !== order.customerId) // нельзя стать исполнителем своего заказа
    .filter(
      (u) =>
        u.location.lat >= box.minLat &&
        u.location.lat <= box.maxLat &&
        u.location.lng >= box.minLng &&
        u.location.lng <= box.maxLng
    )
    .filter((u) => u.skills.some((s) => s.categoryId === order.categoryId))
    .map((u) => ({ user: u, distanceKm: distanceKm(u.location, order.exactLocation) }))
    .filter((c) => c.distanceKm <= (order.searchRadiusKm || 3))
    .sort((x, y) => {
      // релевантность: сначала верифицированный навык, затем расстояние, затем рейтинг
      const xVerified = x.user.skills.some(
        (s) => s.categoryId === order.categoryId && s.verification === 'verified'
      );
      const yVerified = y.user.skills.some(
        (s) => s.categoryId === order.categoryId && s.verification === 'verified'
      );
      if (xVerified !== yVerified) return xVerified ? -1 : 1;
      if (Math.abs(x.distanceKm - y.distanceKm) > 0.05) return x.distanceKm - y.distanceKm;
      return y.user.rating - x.user.rating;
    });
}

/**
 * Публичное представление заказа для кандидата (до назначения):
 * точный адрес и контакт заказчика скрыты.
 * @param {import('./types.js').Order} order
 */
function toPublicOrderView(order) {
  const { exactLocation, ...rest } = order;
  return {
    ...rest,
    approxDistanceKm: undefined, // считается отдельно на карточке кандидата
  };
}

/**
 * Полное представление заказа доступно только назначенному исполнителю.
 * @param {import('./types.js').Order} order
 * @param {string} requestingUserId
 */
function toWorkerOrderView(order, requestingUserId) {
  if (order.assignedWorkerId === requestingUserId) {
    return order; // включая exactLocation
  }
  return toPublicOrderView(order);
}

/**
 * Уведомления рождаются из событий заказа, а не являются статичным списком.
 * В проде channel-адаптер (см. adapters/telegramAdapter.js) отправляет
 * реальное сообщение в Telegram. В прототипе адаптер пишет в локальный
 * журнал (см. store/localStore.js).
 */

const TEMPLATES = {
  order_published: () => 'Заказ создан, ожидаем отклика мастеров рядом.',
  worker_found: (ctx) => `Мастер найден: ${ctx.workerName}. Приедет в интервал ${ctx.timeWindow}.`,
  worker_en_route: () => 'Мастер выехал к вам.',
  work_started: () => 'Мастер начал работу.',
  work_completed: () => 'Заказ выполнен. Пожалуйста, оцените качество работы.',
  issue_reported: () => 'По заказу зарегистрирована проблема, мы уже разбираемся.',
  new_matching_order: (ctx) => `Рядом появился подходящий заказ: «${ctx.orderTitle}».`,
  order_assigned_to_you: (ctx) => `Вам назначен заказ: «${ctx.orderTitle}».`,
  order_cancelled: () => 'Заказ отменён или изменён заказчиком.',
  order_confirmed_by_customer: () => 'Заказчик подтвердил выполнение заказа.',
};

/**
 * @param {string} recipientUserId
 * @param {'customer'|'worker'} recipientRole
 * @param {string} orderId
 * @param {keyof typeof TEMPLATES} eventKey
 * @param {Object} ctx
 * @returns {import('./types.js').NotificationEvent}
 */
function createNotification(recipientUserId, recipientRole, orderId, eventKey, ctx = {}) {
  const template = TEMPLATES[eventKey];
  if (!template) throw new Error(`Неизвестное событие уведомления: ${eventKey}`);
  return {
    id: `ntf-${orderId}-${eventKey}-${Math.random().toString(36).slice(2, 8)}`,
    recipientUserId,
    recipientRole,
    orderId,
    text: template(ctx),
    channel: 'telegram', // реальная отправка выполняется адаптером
    createdAt: new Date().toISOString(),
  };
}


// ---- js/adapters/supabaseAdapter.js ----
/**
 * Точка интеграции с Supabase.
 *
 * Все операции — обычные вызовы PostgREST (встроенный REST API
 * Supabase), без отдельной библиотеки supabase-js — так проще держать
 * прототип в один файл без сборки.
 *
 * Белый список операций: наружу торчат только конкретные функции ниже
 * (getRows/insertRow/updateRow), а не произвольный доступ к базе —
 * это соответствует требованию брифа "доступные операции ограничены
 * белым списком".
 *
 * Публичный (publishable/anon) ключ безопасен для клиента ТОЛЬКО
 * потому что на таблицах включены RLS-политики. Для MVP сейчас стоят
 * открытые политики (anon/authenticated: полный доступ) — сознательный
 * компромисс скорости запуска, описанный отдельно в README. Для продакшена
 * это нужно сузить (например, через Edge Functions на service_role).
 */

function getConfig() {
  const env = (typeof window !== 'undefined' && window.__ENV__) || {};
  return { url: env.SUPABASE_URL || '', key: env.SUPABASE_ANON_KEY || '' };
}

function isSupabaseConfigured() {
  const { url, key } = getConfig();
  return Boolean(url && key);
}

function getBackendMode() {
  return isSupabaseConfigured() ? 'supabase' : 'local-stub';
}

function headers(extra = {}) {
  const { key } = getConfig();
  return {
    apikey: key,
    Authorization: `Bearer ${key}`,
    'Content-Type': 'application/json',
    ...extra,
  };
}

/**
 * @param {string} table
 * @param {string} [query] — например "select=*&order=created_at.desc"
 */
async function getRows(table, query = 'select=*') {
  const { url } = getConfig();
  const res = await fetch(`${url}/rest/v1/${table}?${query}`, {
    headers: headers(),
  });
  if (!res.ok) {
    throw new Error(`Supabase GET ${table} failed: ${res.status} ${await res.text()}`);
  }
  return res.json();
}

/**
 * @param {string} table
 * @param {Object} row
 * @returns {Promise<Object>} вставленная строка (с сгенерированными полями)
 */
async function insertRow(table, row) {
  const { url } = getConfig();
  const res = await fetch(`${url}/rest/v1/${table}`, {
    method: 'POST',
    headers: headers({ Prefer: 'return=representation' }),
    body: JSON.stringify(row),
  });
  if (!res.ok) {
    throw new Error(`Supabase INSERT ${table} failed: ${res.status} ${await res.text()}`);
  }
  const data = await res.json();
  return Array.isArray(data) ? data[0] : data;
}

/**
 * @param {string} table
 * @param {string} id
 * @param {Object} patch
 */
async function updateRow(table, id, patch) {
  const { url } = getConfig();
  const res = await fetch(`${url}/rest/v1/${table}?id=eq.${encodeURIComponent(id)}`, {
    method: 'PATCH',
    headers: headers({ Prefer: 'return=representation' }),
    body: JSON.stringify(patch),
  });
  if (!res.ok) {
    throw new Error(`Supabase UPDATE ${table} failed: ${res.status} ${await res.text()}`);
  }
  const data = await res.json();
  return Array.isArray(data) ? data[0] : data;
}


// ---- js/adapters/session.js ----
/**
 * Вход по номеру телефона (см. app.js: ensureUserByPhone).
 *
 * Раньше вход был через Telegram-бота (код в диплинке); от этого отказались
 * в пользу прямого ввода телефона в форме заявки — быстрее и не требует
 * стороннего мессенджера. Телефон сразу привязывается к id пользователя;
 * поле phone_verified пока всегда false — подтверждение по SMS добавится
 * отдельным шагом позже, тогда же появится и реальная проверка личности.
 *
 * saveSession/loadSession хранят только id пользователя в localStorage,
 * чтобы не спрашивать телефон заново при каждом визите с того же устройства.
 */

const SESSION_KEY = 'muzhik_session_v1';

/** Сохранить id вошедшего пользователя, чтобы не спрашивать телефон заново при каждом визите. */
function saveSession(id) {
  if (typeof localStorage !== 'undefined' && id) {
    localStorage.setItem(SESSION_KEY, String(id));
  }
}

/** @returns {string|null} */
function loadSession() {
  if (typeof localStorage === 'undefined') return null;
  return localStorage.getItem(SESSION_KEY);
}

function clearSession() {
  if (typeof localStorage !== 'undefined') {
    localStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(SESSION_TOKEN_KEY);
  }
}

/**
 * Сессионный токен — отдельно от id пользователя (см. SESSION_KEY выше).
 * Токен выдаёт Edge Function issue-session-token и хранит в таблице
 * user_sessions (недоступной анонимному ключу — RLS без единой политики,
 * см. README/памятку по безопасности). Заказы, которые видит мастер рядом
 * (available-orders), и приём заказа (accept-order) требуют этот токен —
 * иначе просто зная/подставив чужой id пользователя в localStorage,
 * поведение мастера этого пользователя не подделать через эти два запроса.
 * ОБНОВЛЕНО: теперь этот токен выдаётся ТОЛЬКО через set-password/
 * login-with-password (после реальной проверки пароля), а не по одному
 * лишь id — см. enterPasswordStep/submitPasswordStep и boot() ниже. Раньше
 * (issueSessionToken без пароля) это было чисто защитой от подмены на
 * уровне уже открытого запроса, а не от входа по чужому телефону/id —
 * теперь это полноценная авторизация.
 */
const SESSION_TOKEN_KEY = 'muzhik_session_token_v1';

function saveSessionToken(token) {
  if (typeof localStorage !== 'undefined' && token) {
    localStorage.setItem(SESSION_TOKEN_KEY, String(token));
  }
}

/** @returns {string|null} */
function loadSessionToken() {
  if (typeof localStorage === 'undefined') return null;
  return localStorage.getItem(SESSION_TOKEN_KEY);
}

/**
 * Запрашивает новый сессионный токен для уже определённого id пользователя
 * (после ensureUserByPhone или при восстановлении сессии без токена —
 * см. bootstrap). Сам вызов ничего не проверяет о владении телефоном
 * (тем же ограничением обладает и ensureUserByPhone), но без результата
 * этого вызова available-orders/accept-order не отдадут данные и не примут
 * заказ от имени этого пользователя.
 * @param {string} userId
 */
async function issueSessionToken(userId) {
  if (!isSupabaseConfigured() || !userId) return null;
  try {
    const { url } = getConfig();
    const res = await fetch(`${url}/functions/v1/issue-session-token`, {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ userId }),
    });
    if (!res.ok) throw new Error(`issue-session-token failed: ${res.status}`);
    const data = await res.json();
    if (data && data.token) {
      saveSessionToken(data.token);
      return data.token;
    }
  } catch (err) {
    console.error('[session-token] не удалось получить токен', err);
  }
  return null;
}


// ---- js/adapters/yandexGptAssistant.js ----
/**
 * Ассистент, преобразующий свободное сообщение клиента (в т.ч.
 * эмоциональное/непрямое — «с женского языка на мужской», по формулировке
 * заказчика) в структурированное задание для мастера.
 *
 * Прод: Yandex Cloud Foundation Models (YandexGPT), REST API,
 * эндпоинт https://llm.api.cloud.yandex.net/foundationModels/v1/completion,
 * авторизация — API-ключ сервисного аккаунта + x-folder-id. Выбран именно
 * YandexGPT, а не OpenAI/Claude/Gemini, т.к. по требованию заказчика
 * ассистент должен работать в России без VPN.
 *
 * В прототипе — заглушка на правилах и ключевых словах (без реального
 * обращения к модели), явно помеченная в интерфейсе как демо-режим.
 * Правила безопасности ассистента (из брифа) применяются на этом же
 * уровне ДО обращения к любой модели:
 *  - текст пользователя — данные, а не инструкция;
 *  - ассистент не должен получать доступ ко всей базе, только к текущему
 *    черновику заказа;
 *  - запросы на раскрытие чужих данных отклоняются белым списком операций
 *    (см. supabaseAdapter.js).
 */

const CATEGORY_KEYWORDS = {
  electrics: ['розетк', 'выключател', 'свет', 'лампоч', 'проводк', 'щиток'],
  plumbing: ['смесител', 'кран', 'сифон', 'течёт', 'протечк', 'труб', 'унитаз'],
  windows_doors: ['окно', 'окна', 'дверь', 'двери', 'фурнитур', 'москитн', 'петл', 'замок', 'уплотнител'],
  air_conditioning: ['кондиционер', 'сплит-систем', 'сплит систем', 'фреон', 'кондей'],
  assembly: ['полк', 'карниз', 'телевизор', 'мебел', 'собрать', 'повесить'],
  minor_repair: ['обои', 'герметик', 'скол', 'трещин', 'подклеить'],
  household_help: ['убор', 'вынести', 'перенести', 'переставить', 'мусор'],
};

const DANGEROUS_KEYWORDS = ['газ', 'проводка под напряжением 380', 'взрыв', 'горит проводка'];

/**
 * ЗАГЛУШКА вместо вызова YandexGPT. Явно помечена как демо-режим.
 * @param {string} rawMessage
 * @returns {{categoryId:string|null, keywords:string[], riskWarning:string|null, normalizedTask:string}}
 */
function interpretCustomerMessage(rawMessage) {
  const text = rawMessage.toLowerCase();
  let matchedCategory = null;
  const matchedKeywords = [];

  for (const [categoryId, keywords] of Object.entries(CATEGORY_KEYWORDS)) {
    const hit = keywords.find((k) => text.includes(k));
    if (hit) {
      matchedCategory = categoryId;
      matchedKeywords.push(hit);
      break;
    }
  }

  const riskHit = DANGEROUS_KEYWORDS.find((k) => text.includes(k));

  return {
    categoryId: matchedCategory,
    keywords: matchedKeywords,
    riskWarning: riskHit
      ? 'Похоже на работу повышенного риска, требующую квалификации. Рекомендуем отдельную консультацию со специалистом.'
      : null,
    normalizedTask: rawMessage.trim(),
    isDemoInterpretation: true,
  };
}

function assistantDemoNotice() {
  return 'Ассистент работает в демо-режиме на ключевых словах. В проде — YandexGPT.';
}

/**
 * Оплата/предоплата заказа — заказчик ещё не выбрал финальную схему
 * (см. открытые решения в продуктовом брифе, п.20). Требование: шаг
 * оплаты должен присутствовать в пути клиента уже сейчас, даже если
 * реального эквайринга нет.
 *
 * В прототипе доступны только заглушки методов:
 *  - 'on_site'    — оплата мастеру на месте (без предоплаты);
 *  - 'online_stub'— имитация онлайн-предоплаты (без реального списания).
 *
 * Точка интеграции для продакшена: любой российский эквайринг с
 * поддержкой рекуррентных/холдовых платежей (ЮKassa, Тинькофф и т.п.),
 * подключается сюда без изменений в доменном слое и UI.
 */

/**
 * @param {'on_site'|'online_stub'} method
 * @param {number} amount
 * @returns {import('./types.js').PaymentInfo}
 */
function initiatePayment(method, amount) {
  if (method === 'online_stub') {
    return {
      status: 'prepayment_pending',
      amount,
      method,
      paidAt: null,
    };
  }
  return {
    status: 'none',
    amount,
    method: 'on_site',
    paidAt: null,
  };
}

/** ЗАГЛУШКА подтверждения оплаты — в проде вебхук от платёжного провайдера. */
function confirmMockPayment(paymentInfo) {
  if (paymentInfo.status !== 'prepayment_pending') return paymentInfo;
  return {
    ...paymentInfo,
    status: 'prepayment_paid',
    paidAt: new Date().toISOString(),
  };
}


// ---- js/store/localStore.js (изолирован в IIFE, чтобы имена не конфликтовали с dataStore.js) ----
const local = (function(){
/**
 * Локальная персистентность (замена Supabase, пока нет реального проекта).
 * Реализует тот же набор таблиц/операций, чтобы переключение на
 * supabaseAdapter.js в будущем не потребовало переписывать домен и UI.
 * Данные переживают перезагрузку страницы (localStorage).
 */

const KEY = 'muzhik_db_v1';

function readDb() {
  const raw = typeof localStorage !== 'undefined' ? localStorage.getItem(KEY) : null;
  if (!raw) return null;
  try {
    return JSON.parse(raw);
  } catch {
    return null;
  }
}

function writeDb(db) {
  if (typeof localStorage !== 'undefined') {
    localStorage.setItem(KEY, JSON.stringify(db));
  }
}

function initDb(seed) {
  const existing = readDb();
  if (existing) return existing;
  writeDb(seed);
  return seed;
}

function resetDb(seed) {
  writeDb(seed);
  return seed;
}

function getDb() {
  return readDb() || { users: [], orders: [], services: [], notifications: [] };
}

function saveUser(user) {
  const db = getDb();
  const idx = db.users.findIndex((u) => u.id === user.id);
  if (idx >= 0) db.users[idx] = user;
  else db.users.push(user);
  writeDb(db);
  return user;
}

function saveOrder(order) {
  const db = getDb();
  const idx = db.orders.findIndex((o) => o.id === order.id);
  if (idx >= 0) db.orders[idx] = order;
  else db.orders.push(order);
  writeDb(db);
  return order;
}

function saveService(service) {
  const db = getDb();
  const idx = db.services.findIndex((s) => s.id === service.id);
  if (idx >= 0) db.services[idx] = service;
  else db.services.push(service);
  writeDb(db);
  return service;
}

function pushNotification(notification) {
  const db = getDb();
  db.notifications.push(notification);
  writeDb(db);
  return notification;
}

function getUsers() {
  return getDb().users;
}

function getOrders() {
  return getDb().orders;
}

function getServices() {
  return getDb().services;
}

function getNotificationsFor(userId) {
  return getDb().notifications.filter((n) => n.recipientUserId === userId);
}

  return { initDb, resetDb, getUsers, getOrders, getServices, getNotificationsFor, saveUser, saveOrder, saveService, pushNotification };
})();

// ---- js/store/dataStore.js ----
/**
 * Единый слой данных для приложения.
 *
 * Раньше UI напрямую работал с localStore.js (localStorage-заглушка).
 * Теперь это дата-стор с тем же публичным интерфейсом (getUsers,
 * getOrders, getServices, getNotificationsFor, saveUser, saveOrder,
 * saveService, pushNotification, addSkillForUser, initDb), который
 * внутри выбирает реальный backend (Supabase) или локальную заглушку —
 * в зависимости от того, настроены ли SUPABASE_URL/KEY (см.
 * adapters/supabaseAdapter.js).
 *
 * Важно для UI: чтение (getUsers/getOrders/...) остаётся СИНХРОННЫМ —
 * оно всегда отдаёт данные из локального кэша в памяти. Кэш заполняется
 * один раз при старте (initDb) и обновляется сразу при каждой записи.
 * Сама сетевая запись в Supabase уходит в фоне; в редком случае сбоя
 * сети показывается тост с ошибкой, но интерфейс не блокируется.
 */



const cache = {
  users: [],
  orders: [],
  services: [],
  notifications: [],
  // Список заказов, подходящих текущему мастеру рядом — в отличие от
  // остальных полей кэша, наполняется НЕ из initDb(), а отдельными
  // запросами к Edge Function available-orders (см. refreshAvailableOrders):
  // тут не общий слепок таблицы orders, а уже отфильтрованный сервером
  // список без точных координат чужих заказов. См. ADR про available-orders
  // и accept-order рядом с acceptOrder().
  availableOrders: [],
  // Статус последнего запроса к available-orders — раньше сетевая/серверная
  // ошибка тихо оседала в console.error, а пользователь видел ровно тот же
  // текст «нет подходящих заказов», что и при честном нулевом результате:
  // разницу между «сервер сказал — рядом пусто» и «запрос не доехал» было
  // невозможно отличить, не залезая в консоль браузера. Теперь renderOrders
  // показывает отдельное сообщение и кнопку «Обновить», когда последняя
  // попытка завершилась ошибкой, см. refreshAvailableOrders.
  availableOrdersLoading: false,
  availableOrdersError: false,
};

let onSyncError = () => {};
function setSyncErrorHandler(fn) {
  onSyncError = fn;
}

// Флаг «не удалось загрузить данные при самом первом старте приложения» —
// отдельно от обычных фоновых сбоев синхронизации (те остаются тихим
// тостом). Если стартовая загрузка не удалась, UI покажет полноэкранный
// экран «долгое ожидание» вместо пустого/сломанного главного экрана.
let bootLoadFailed = false;
function hadBootLoadFailure() {
  return bootLoadFailed;
}

function reportError(context, err) {
  console.error(`[dataStore] ${context}:`, err);
  if (context === 'загрузка данных при старте') {
    bootLoadFailed = true;
    return;
  }
  onSyncError(`Не удалось синхронизировать данные (${context}). Изменение сохранено только локально.`);
}

// ---------------------------------------------------------------------
// Маппинг между доменной моделью (camelCase, вложенные объекты) и
// плоскими snake_case-строками таблиц Supabase.
// ---------------------------------------------------------------------

function dbUserToUser(row, skillsByUser) {
  return {
    id: row.id,
    telegramId: row.telegram_id || '',
    displayName: row.display_name || '',
    phone: row.phone || '',
    phoneVerified: Boolean(row.phone_verified),
    avatarUrl: row.avatar_url || '',
    location: { lat: row.lat ?? 0, lng: row.lng ?? 0 },
    district: row.district || '',
    searchRadiusKm: Number(row.search_radius_km ?? 3),
    skills: skillsByUser[row.id] || [],
    availableAsWorker: Boolean(row.available_as_worker),
    // Рейтинг человека как специалиста (ставит заказчик после выполнения
    // заказа, см. rateOrder()) — уже используется.
    rating: Number(row.rating ?? 0),
    ratingCount: Number(row.rating_count ?? 0),
    // Рейтинг человека как заказчика (ставил бы специалист после сдачи
    // заказа) — колонки заведены заранее, UI и логика простановки оценки
    // пока не реализованы, поля всегда пустые (0).
    customerRating: Number(row.customer_rating ?? 0),
    customerRatingCount: Number(row.customer_rating_count ?? 0),
    blocked: Boolean(row.blocked),
    createdAt: row.created_at,
    // Безопасный денормализованный флаг (см. public.user_auth в
    // README/памятке по паролям) — сам хеш пароля никогда не приходит
    // клиенту, но по этому булеву клиент понимает, какой экран показать:
    // «Придумайте пароль» или «Введите пароль» (см. enterPasswordStep).
    hasPassword: Boolean(row.has_password),
  };
}

function userToDbUser(user) {
  return {
    // Пустая строка нарушает unique-ограничение users_telegram_id_key при
    // втором и последующих пользователях без Telegram — отправляем null,
    // Postgres допускает множество NULL в уникальном индексе.
    telegram_id: user.telegramId || null,
    display_name: user.displayName,
    phone: user.phone,
    phone_verified: Boolean(user.phoneVerified),
    avatar_url: user.avatarUrl || null,
    lat: user.location?.lat ?? null,
    lng: user.location?.lng ?? null,
    district: user.district,
    search_radius_km: user.searchRadiusKm,
    available_as_worker: user.availableAsWorker,
    rating: user.rating,
    rating_count: user.ratingCount,
    customer_rating: user.customerRating ?? 0,
    customer_rating_count: user.customerRatingCount ?? 0,
    blocked: user.blocked,
  };
}

function dbSkillToSkill(row) {
  return {
    categoryId: row.category_id,
    note: row.note || '',
    verification: row.verification || 'unverified',
    addedAt: row.added_at,
    _dbId: row.id,
    _userId: row.user_id,
  };
}

function dbOrderToOrder(row) {
  return {
    id: row.id,
    customerId: row.customer_id,
    assignedWorkerId: row.assigned_worker_id,
    title: row.title,
    categoryId: row.category_id,
    description: row.description || '',
    desiredOutcome: row.desired_outcome || '',
    scope: row.scope || {},
    attachments: row.attachments || [],
    hasVoiceTranscript: Boolean(row.has_voice_transcript),
    voiceTranscript: row.voice_transcript || '',
    exactLocation: { lat: row.exact_lat, lng: row.exact_lng },
    district: row.district || '',
    houseNumberPublic: row.house_number_public || '',
    fullAddress: row.full_address || '',
    desiredDate: row.desired_date || '',
    timeWindow: row.time_window || '',
    urgency: row.urgency || 'normal',
    customerBudget: row.customer_budget,
    estimate: row.estimate || { min: 0, max: 0, factors: [] },
    finalPrice: row.final_price ?? null,
    payment: row.payment || { status: 'none', amount: null, method: 'on_site', paidAt: null },
    status: row.status,
    timeline: row.timeline || [],
    warnings: row.warnings || [],
    isPrecedent: Boolean(row.is_precedent),
    negotiation: row.negotiation || { customerOffer: null, workerOffer: null },
    createdAt: row.created_at,
    // Конкретная оценка по этому заказу (не путать с кумулятивным рейтингом
    // пользователя) — нужна для дневной статистики (см. daily_stats).
    workerRating: row.worker_rating ?? null,
    customerRating: row.customer_rating ?? null,
    customerRatedAt: row.customer_rated_at || null,
    // Структурированное ТЗ для исполнителя — сформировано ассистентом
    // (/format-brief) сразу при создании заказа, см. requestFormattedBrief().
    // Может быть null: ассистент не настроен, запрос не удался, или заказ
    // создан до появления этой функции.
    formattedBrief: row.formatted_brief || null,
    // Вопрос администратора клиенту на модерации и (когда есть) ответ —
    // { question, askedAt, answer, answeredAt } или null. См. STATUS_LABELS
    // .clarification_requested и submitClarificationAnswer().
    clarification: row.clarification || null,
  };
}

function orderToDbOrder(order) {
  return {
    customer_id: order.customerId,
    assigned_worker_id: order.assignedWorkerId,
    title: order.title,
    category_id: order.categoryId,
    description: order.description,
    desired_outcome: order.desiredOutcome,
    scope: order.scope,
    attachments: order.attachments,
    has_voice_transcript: order.hasVoiceTranscript,
    voice_transcript: order.voiceTranscript,
    // exact_lat/exact_lng — колонки NOT NULL в Supabase, null туда не
    // запишется (проверено). ?? 0 — подстраховка на случай, если
    // exactLocation вдруг не задан: 0,0 — тот же сентинел «адрес не
    // определён», что и hasValidLocation() ожидает при чтении обратно.
    exact_lat: order.exactLocation?.lat ?? 0,
    exact_lng: order.exactLocation?.lng ?? 0,
    district: order.district,
    house_number_public: order.houseNumberPublic || null,
    full_address: order.fullAddress || null,
    desired_date: order.desiredDate || null,
    time_window: order.timeWindow,
    urgency: order.urgency,
    customer_budget: order.customerBudget,
    estimate: order.estimate,
    final_price: order.finalPrice ?? null,
    payment: order.payment,
    status: order.status,
    timeline: order.timeline,
    warnings: order.warnings,
    is_precedent: order.isPrecedent,
    negotiation: order.negotiation,
    worker_rating: order.workerRating ?? null,
    customer_rating: order.customerRating ?? null,
    customer_rated_at: order.customerRatedAt || null,
    formatted_brief: order.formattedBrief || null,
    clarification: order.clarification || null,
  };
}

function dbServiceToService(row) {

function serviceToDbService(service) {

// ---------------------------------------------------------------------
// Инициализация
// ---------------------------------------------------------------------

/**
 * @param {Object} localSeed — демоданные для режима без Supabase
 */
async function initDb(localSeed) {
  if (!isSupabaseConfigured()) {
    const db = local.initDb(localSeed);
    cache.users = db.users;
    cache.orders = db.orders;
    cache.services = db.services;
    cache.notifications = db.notifications;
    return cache;
  }

  try {
    // users_public — представление без чувствительных полей (phone, lat/lng,
    // telegram_id, phone_verified, has_password), см. памятку по безопасности
    // БД. Раньше здесь был getRows('users') — каждый посетитель при обычной
    // загрузке страницы получал в кэш (а значит, и в Network-вкладку браузера)
    // телефоны, точные координаты и telegram_id ВСЕХ пользователей сервиса.
    // Полную свою строку подтягиваем отдельно чуть ниже; полные строки чужих
    // пользователей (например, для «Контакт заказчика») — через
    // ensureCustomerContact() по требованию.
    const [userRows, skillRows, orderRows, serviceRows, notificationRows] = await Promise.all([
      getRows('users_public'),
      getRows('skills'),
      getRows('orders'),
      getRows('services'),
      getRows('notifications', 'select=*&order=created_at.desc&limit=200'),
    ]);

    const skillsByUser = {};
    skillRows.forEach((row) => {
      const skill = dbSkillToSkill(row);
      if (!skillsByUser[row.user_id]) skillsByUser[row.user_id] = [];
      skillsByUser[row.user_id].push(skill);
    });

    cache.users = userRows.map((row) => dbUserToUser(row, skillsByUser));
    cache.orders = orderRows.map(dbOrderToOrder);
    cache.services = serviceRows.map(dbServiceToService);
    cache.notifications = notificationRows.map(dbNotificationToNotification);

    // Если на этом устройстве уже есть сохранённая сессия (см. SESSION_KEY/
    // loadSession), догружаем ПОЛНУЮ строку именно этого пользователя из
    // настоящей таблицы users — иначе у собственного профиля пропали бы
    // телефон, telegram_id и координаты (users_public их не содержит).
    const savedSessionUserId = loadSession();
    if (savedSessionUserId) {
      try {
        const selfRows = await getRows('users', `id=eq.${encodeURIComponent(savedSessionUserId)}&select=*`);
        if (selfRows && selfRows[0]) {
          const selfUser = dbUserToUser(selfRows[0], skillsByUser);
          const i = cache.users.findIndex((u) => u.id === selfUser.id);
          if (i >= 0) cache.users[i] = selfUser;
          else cache.users.push(selfUser);
        }
      } catch (err) {
        // Не критично для загрузки страницы — просто останется урезанная
        // (users_public) версия собственного профиля до следующей попытки.
        console.error('[dataStore] не удалось догрузить полный профиль текущего пользователя', err);
      }
    }
  } catch (err) {
    reportError('загрузка данных при старте', err);
    // не блокируем интерфейс — работаем с тем, что успели получить (может быть пусто)
  }
  return cache;
}

function resetDb() {
  if (!isSupabaseConfigured()) {
    return local.resetDb(arguments[0]);
  }
  console.warn('[dataStore] resetDb недоступен в режиме Supabase — это реальные данные.');
  return cache;
}

// ---------------------------------------------------------------------
// Чтение (всегда синхронно, из кэша)
// ---------------------------------------------------------------------

function getUsers() {
  return cache.users;
}
function getOrders() {
  return cache.orders;
}
function getServices() {
  return cache.services;
}
function getNotificationsFor(userId) {
  return cache.notifications.filter((n) => n.recipientUserId === userId);
}

// ---------------------------------------------------------------------
// Точечная подгрузка контакта конкретного пользователя (например, для
// «Контакт заказчика» на карточке заказа мастеру, см. renderOrderDetail) —
// bulk-кэш (см. initDb) теперь не содержит phone/telegram_id других людей
// (только users_public), так что для показа чужого телефона нужен
// отдельный целевой запрос к настоящей таблице users по конкретному id
// (по аналогии с уже существующим available-orders/accept-order).
// ---------------------------------------------------------------------
const contactCache = {}; // userId -> { displayName, phone } | 'loading' | 'error'

/**
 * Синхронно возвращает то, что уже известно о контакте пользователя
 * (или null, если запрос ещё не запускали) и в фоне запускает загрузку,
 * если её ещё не было — по завершении вызывает render() ещё раз.
 * @param {string} userId
 * @returns {{displayName: string, phone: string} | 'loading' | 'error' | null}
 */
function ensureCustomerContact(userId) {
  if (!userId) return null;
  const existing = contactCache[userId];
  if (existing) return existing;

  if (!isSupabaseConfigured()) {
    // Локальный режим без Supabase — контакт и так уже есть в общем кэше.
    const u = cache.users.find((x) => x.id === userId);
    contactCache[userId] = u ? { displayName: u.displayName, phone: u.phone } : 'error';
    return contactCache[userId];
  }

  contactCache[userId] = 'loading';
  getRows('users', `id=eq.${encodeURIComponent(userId)}&select=display_name,phone`)
    .then((rows) => {
      contactCache[userId] = rows && rows[0]
        ? { displayName: rows[0].display_name || '', phone: rows[0].phone || '' }
        : 'error';
      render();
    })
    .catch((err) => {
      reportError('загрузка контакта заказчика', err);
      contactCache[userId] = 'error';
      render();
    });
  return contactCache[userId];
}

// ---------------------------------------------------------------------
// Запись: обновляем кэш сразу, в Supabase — в фоне
// ---------------------------------------------------------------------

function saveUser(user) {
  const idx = cache.users.findIndex((u) => u.id === user.id);
  if (idx >= 0) cache.users[idx] = user;
  else cache.users.push(user);

  if (!isSupabaseConfigured()) {
    local.saveUser(user);
    return user;
  }

  const isNew = !user.id || user.id.startsWith('local-');
  const payload = userToDbUser(user);

  if (isNew) {
    insertRow('users', payload)
      .then((row) => {
        const created = dbUserToUser(row, {});
        created.skills = user.skills;
        const i = cache.users.findIndex((u) => u === user);
        if (i >= 0) cache.users[i] = created; if (state.currentUserId === user.id) state.currentUserId = created.id;
      })
      .catch((err) => reportError('сохранение пользователя', err));
  } else {
    updateRow('users', user.id, payload).catch((err) => reportError('сохранение пользователя', err));
  }
  return user;
}

/**
 * Точечное обновление НЕСКОЛЬКИХ полей чужого пользователя (сейчас — только
 * рейтинги, см. rateOrder/rateCustomer) — в отличие от saveUser() НЕ
 * отправляет и не подставляет в кэш весь объект пользователя целиком.
 *
 * Это важно: после перехода bulk-кэша (см. initDb) на users_public у
 * объекта чужого пользователя в cache.users нет phone/telegram_id/lat/lng —
 * saveUser({ ...worker, rating: ... }) отправил бы это в PATCH users и
 * затёр бы эти поля пустыми/нулевыми в реальной таблице. patchUserFields
 * обновляет в БД и в кэше только переданные поля, не трогая остальные.
 *
 * @param {string} userId
 * @param {Object} domainPatch — поля в доменной (camelCase) модели, те же
 *   имена, что понимает userToDbUser (см. dbFieldMap ниже)
 */
const USER_DOMAIN_TO_DB_FIELD = {
  rating: 'rating',
  ratingCount: 'rating_count',
  customerRating: 'customer_rating',
  customerRatingCount: 'customer_rating_count',
};
function patchUserFields(userId, domainPatch) {
  const user = cache.users.find((u) => u.id === userId);
  if (user) Object.assign(user, domainPatch);

  if (!isSupabaseConfigured()) {
    if (user) local.saveUser(user);
    return;
  }

  const dbPatch = {};
  Object.keys(domainPatch).forEach((key) => {
    const dbField = USER_DOMAIN_TO_DB_FIELD[key];
    if (dbField) dbPatch[dbField] = domainPatch[key];
  });
  if (Object.keys(dbPatch).length === 0) return;
  updateRow('users', userId, dbPatch).catch((err) => reportError('обновление рейтинга пользователя', err));
}

function addSkillForUser(userId, skill) {
  const user = cache.users.find((u) => u.id === userId);
  if (!user) return;
  user.skills = [...user.skills, skill];

  if (!isSupabaseConfigured()) {
    local.saveUser(user);
    return;
  }

  insertRow('skills', {
    user_id: userId,
    category_id: skill.categoryId,
    note: skill.note,
    verification: skill.verification,
  })
    .then((row) => {
      // Запоминаем настоящий id строки в БД — пригодится, если в этой же
      // сессии сразу поменяют уровень владения (см. updateSkillNoteForUser):
      // без него нечем было бы адресовать UPDATE. `skill` — та же ссылка,
      // что уже лежит в user.skills, поэтому мутация видна сразу.
      skill._dbId = row.id;
      skill._userId = userId;
    })
    .catch((err) => reportError('добавление навыка', err));
}

/** Смена уровня владения (звёзд) у уже существующего навыка — без вставки новой строки. */
function updateSkillNoteForUser(userId, skill, newNote) {
  const user = cache.users.find((u) => u.id === userId);
  if (!user) return;
  skill.note = newNote; // skill — ссылка на объект внутри user.skills, мутация видна сразу

  if (!isSupabaseConfigured()) {
    local.saveUser(user);
    return;
  }
  if (!skill._dbId) return; // строка ещё не сохранилась (см. addSkillForUser) — обновится при следующей загрузке
  updateRow('skills', skill._dbId, { note: newNote }).catch((err) => reportError('обновление навыка', err));
}

function saveOrder(order) {
  const idx = cache.orders.findIndex((o) => o.id === order.id);
  if (idx >= 0) cache.orders[idx] = order;
  else cache.orders.push(order);

  if (!isSupabaseConfigured()) {
    local.saveOrder(order);
    return order;
  }

  const isNew = idx < 0 || String(order.id).startsWith('o-');
  const payload = orderToDbOrder(order);

  if (isNew) {
    return insertRow('orders', payload)
      .then((row) => {
        const created = dbOrderToOrder(row);
        const i = cache.orders.findIndex((o) => o === order);
        if (i >= 0) cache.orders[i] = created; return created;
      })
      .catch((err) => {
        reportError('сохранение заказа', err);
        // Раньше здесь тихо возвращался локальный `order`, как будто вставка
        // прошла — вызывающий код (publishDraft) считал заказ опубликованным,
        // хотя в БД его не было (QA-отчёт от 12.09, BUG 05: заказ пропадал
        // после обновления страницы). Теперь явно сигналим о провале (null) и
        // убираем «заказ-призрак», которого добавили в кэш оптимистично выше,
        // до того как узнали результат вставки — иначе он мог бы всплыть в
        // списках («Мои заказы»), не будучи реально сохранён.
        const i = cache.orders.findIndex((o) => o === order);
        if (i >= 0) cache.orders.splice(i, 1);
        return null;
      });
  } else {
    return updateRow('orders', order.id, payload).then(() => order).catch((err) => { reportError('сохранение заказа', err); return order; });
  }
  return order;
}

function saveService(service) {
  const idx = cache.services.findIndex((s) => s.id === service.id);
  if (idx >= 0) cache.services[idx] = service;
  else cache.services.push(service);

  if (!isSupabaseConfigured()) {
    local.saveService(service);
    return service;
  }

  const payload = serviceToDbService(service);
  updateRow('services', service.id, payload).catch((err) => {
    // если строки ещё нет — пробуем вставить
    insertRow('services', payload).catch((err2) => reportError('сохранение услуги', err2));
  });
  return service;
}

function pushNotification(notification) {
  cache.notifications.push(notification);

  if (!isSupabaseConfigured()) {
    local.pushNotification(notification);
    return notification;
  }

  insertRow('notifications', notificationToDbNotification(notification)).catch((err) =>
    reportError('уведомление', err)
  );
  return notification;
}

/**
 * Уровень владения навыком (1–5 звёзд) хранится БЕЗ изменения схемы БД —
 * закодирован префиксом прямо в текстовом поле skills.note (например,
 * "LVL4::Электрик, опыт 8 лет"). Так можно выкатить фичу сразу, не дожидаясь
 * миграции таблицы skills в Supabase. Если решим завести отдельную колонку
 * `level` — здесь единственное место, которое нужно будет переключить.
 */
function parseSkillNote(rawNote) {
  const m = /^LVL([1-5])::/.exec(rawNote || '');
  if (m) return { level: Number(m[1]), text: rawNote.slice(m[0].length) };
  return { level: 0, text: rawNote || '' };
}
function encodeSkillNote(level, text) {
  return level >= 1 && level <= 5 ? `LVL${level}::${text}` : text;
}
function renderStars(level) {
  if (!level) return '';
  return '★'.repeat(level) + '☆'.repeat(5 - level);
}
