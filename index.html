<style>
/* Только мобильная раскладка. Оттенки серого (цвет не используется намеренно). */

:root {
  --gray-0: #ffffff;
  --gray-50: #f7f7f7;
  --gray-100: #eeeeee;
  --gray-200: #dddddd;
  --gray-300: #c4c4c4;
  --gray-400: #9c9c9c;
  --gray-500: #767676;
  --gray-600: #545454;
  --gray-700: #383838;
  --gray-800: #232323;
  --gray-900: #121212;
  --accent: #2563eb;
  --accent-strong: #1d4ed8;
  --accent-soft: #eff6ff;
  --radius: 20px;
  --radius-sm: 14px;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 1px rgba(15, 23, 42, 0.03);
  --shadow-md: 0 2px 6px rgba(15, 23, 42, 0.05), 0 14px 32px rgba(15, 23, 42, 0.08);
  --danger: #6b6b6b; /* без цвета — предупреждения выделяются текстурой/жирностью, не цветом */
  --max-width: 480px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden; /* страница не скроллится целиком — внутри скроллится только .screen */
  background: var(--gray-0);
  color: var(--gray-800);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  display: flex;
  justify-content: center;
  /* 100dvh, а не 100vh — на мобильных 100vh считает высоту без вычета
     адресной строки браузера, из-за чего низ страницы (поле ввода)
     оказывался за пределами видимой области и требовал прокрутки. */
  height: 100vh;
  height: 100dvh;
}

.app-shell {
  width: 100%;
  max-width: var(--max-width);
  height: 100%;
  background: var(--gray-0);
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ---------- Header ---------- */

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  /* Плавный переход вместо жёсткой границы: верх шапки почти непрозрачный
     (логотип/заголовок/иконка профиля остаются чёткими), к низу самой
     шапки уже уходит в прозрачность — контент под ней не обрезается
     резкой линией, а мягко тает. Основную часть растяжки даёт ::after
     ниже — она продолжает угасание на content под шапкой. */
  background: linear-gradient(to bottom, rgba(255, 255, 255, 0.97) 0%, rgba(255, 255, 255, 0.97) 65%, rgba(255, 255, 255, 0) 100%);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  position: sticky;
  top: 0;
  z-index: 10;
}

.topbar::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 100%;
  height: 28px;
  background: linear-gradient(to bottom, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0));
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  pointer-events: none;
}

.logo-slot {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  object-fit: cover;
  flex-shrink: 0;
}

.brand-block {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--gray-900);
}

.brand-sub {
  font-size: 11px;
  color: var(--gray-500);
  display: block;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.icon-button {
  border: none;
  background: var(--gray-100);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--gray-700);
  position: relative;
}

.icon-button .badge {
  position: absolute;
  top: -2px;
  right: -2px;
  background: var(--gray-800);
  color: var(--gray-0);
  font-size: 10px;
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 3px;
}

/* ---------- Bottom nav ---------- */

.bottom-nav {
  display: flex;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 -1px 2px rgba(15, 23, 42, 0.04), 0 -8px 24px rgba(15, 23, 42, 0.06);
  position: sticky;
  bottom: 0;
  z-index: 10;
}

.bottom-nav button {
  flex: 1;
  border: none;
  background: transparent;
  padding: 10px 4px 14px;
  font-size: 11px;
  color: var(--gray-500);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.bottom-nav button.active {
  color: var(--accent);
  font-weight: 700;
}

.bottom-nav .nav-icon {
  font-size: 18px;
}

/* ---------- Main content ---------- */

.screen {
  flex: 1;
  /* min-height:0 — иначе флекс-элемент не сжимается до отведённого места
     и «выталкивает» контент (включая composer) за пределы экрана вместо
     появления внутренней прокрутки. */
  min-height: 0;
  padding: 16px;
  padding-bottom: 24px;
  overflow-y: auto;
}

/* ---------- Home / composer (главный экран как в чате) ---------- */

.home-screen {
  display: flex;
  flex-direction: column;
  padding-bottom: 6px;
}

.home-hero-wrap {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.home-hero {
  text-align: center;
  padding: 10px 8px;
  transition: opacity 0.18s ease, transform 0.18s ease;
  opacity: 1;
}

.home-hero.is-hidden {
  opacity: 0;
  transform: translateY(-6px);
  pointer-events: none;
}

.home-hero h1 {
  font-family: "Oswald", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 0.01em;
  margin: 0;
  color: var(--gray-900);
}

.composer-card {
  background: var(--gray-0);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius);
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06), 0 16px 36px rgba(15, 23, 42, 0.1);
  padding: 14px;
}

.legal-footer {
  margin: 6px 4px 0;
  font-size: 9px;
  line-height: 1.3;
  color: var(--gray-500);
  text-align: center;
}

.composer-textarea {
  display: block;
  width: 100%;
  height: 24px;
  min-height: 24px;
  max-height: 160px;
  border: none;
  resize: none;
  font-size: 15px;
  line-height: 24px;
  font-family: inherit;
  color: var(--gray-900);
  outline: none;
  background: transparent;
  overflow-y: auto;
}

.composer-textarea::placeholder {
  color: var(--gray-400);
}

.composer-hint {
  font-size: 12px;
  color: var(--gray-400);
  margin: 2px 0 10px;
}

.composer-chip-row {
  display: flex;
  gap: var(--composer-gap);
  flex-wrap: nowrap;
  flex: 0 1 auto;
  min-width: 0;
}

.composer-chip {
  border: none;
  background: var(--gray-100);
  color: var(--gray-600);
  padding: clamp(6px, 2vw, 8px) clamp(6px, 2vw, 9px);
  border-radius: 999px;
  font-size: clamp(11px, 3vw, 12.5px);
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex: 0 1 auto;
  max-width: clamp(68px, 24vw, 100px);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.composer-chip.filled {
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-weight: 600;
}

.composer-field-inline {
  margin-top: 10px;
  background: var(--gray-50);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.composer-field-inline input[type="text"],
.composer-field-inline input[type="date"],
.composer-field-inline input[type="time"] {
  width: 100%;
  border: 1px solid var(--gray-200);
  background: var(--gray-0);
  border-radius: 10px;
  padding: 9px 10px;
  font-size: 14px;
  font-family: inherit;
  color: var(--gray-900);
}

.composer-field-inline .composer-field-row {
  display: flex;
  gap: 8px;
}

.composer-field-inline .composer-field-row input {
  flex: 1;
  min-width: 0;
}

.composer-field-done {
  align-self: flex-end;
  border: none;
  background: var(--accent);
  color: var(--gray-0);
  padding: 7px 14px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 600;
}

.composer-actions {
  --composer-gap: clamp(5px, 1.8vw, 7px);
  display: flex;
  align-items: center;
  gap: var(--composer-gap);
  padding-top: 10px;
  margin-top: 10px;
}

.composer-tools {
  display: flex;
  gap: var(--composer-gap);
  flex-shrink: 0;
}

.composer-actions > .composer-tools:last-child {
  margin-left: auto;
}

.tool-button,
.send-button {
  border: none;
  width: clamp(26px, 7.5vw, 30px);
  height: clamp(26px, 7.5vw, 30px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 0;
}

.tool-button {
  background: var(--gray-100);
  color: var(--gray-600);
}

.tool-button svg,
.send-button svg {
  width: 46%;
  height: 46%;
  display: block;
}

.send-button {
  background: var(--accent);
  color: var(--gray-0);
}

.send-button:disabled {
  background: var(--gray-300);
}

.tool-button.recording {
  background: var(--gray-900);
  color: var(--gray-0);
}

.composer-geo-button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.composer-geo-button svg {
  width: 15px;
  height: 15px;
  flex-shrink: 0;
}

.composer-assistant-hint:empty {
  display: none;
}

.attachment-preview {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.attachment-chip {
  font-size: 11px;
  background: var(--gray-100);
  color: var(--gray-600);
  padding: 4px 8px;
  border-radius: 999px;

// ---- js/domain/orderStateMachine.js ----
/**
 * Машина состояний заказа. Единственное место, где разрешаются или
 * запрещаются переходы статуса. UI и адаптеры не должны содержать
 * собственную логику допустимости перехода — только вызывать transition().
 */

/** @type {Record<string, string[]>} */
const ALLOWED_TRANSITIONS = {
  draft: ['collecting_details', 'cancelled'],
  collecting_details: ['estimate_ready', 'draft', 'cancelled'],
  estimate_ready: ['searching', 'collecting_details', 'cancelled'],
  searching: ['assigned', 'cancelled'],
  assigned: ['en_route', 'cancelled', 'issue_reported'],
  en_route: ['in_progress', 'issue_reported', 'cancelled'],
  in_progress: ['completed', 'issue_reported'],
  completed: ['confirmed', 'issue_reported'],
  confirmed: ['rated'],
  rated: [],
  cancelled: [],
  issue_reported: ['searching', 'cancelled', 'in_progress', 'assigned'],
};

class InvalidTransitionError extends Error {
  constructor(from, to) {
    super(`Недопустимый переход статуса заказа: ${from} → ${to}`);
    this.name = 'InvalidTransitionError';
    this.from = from;
    this.to = to;
  }
}

/**
 * @param {import('./types.js').Order} order
 * @param {import('./types.js').OrderStatus} nextStatus
 * @returns {import('./types.js').Order} новый объект заказа (не мутирует исходный)
 */
function transition(order, nextStatus) {
  const allowed = ALLOWED_TRANSITIONS[order.status] || [];
  if (!allowed.includes(nextStatus)) {
    throw new InvalidTransitionError(order.status, nextStatus);
  }
  return {
    ...order,
    status: nextStatus,
    timeline: [...order.timeline, { status: nextStatus, at: new Date().toISOString() }],
  };
}

function canTransition(fromStatus, toStatus) {
  return (ALLOWED_TRANSITIONS[fromStatus] || []).includes(toStatus);

// ---- js/domain/pricing.js ----
/**
 * Расчёт предварительной цены на основе каталога услуг.
 *
 * По требованию заказчика: ассистент не должен «выдумывать» цену.
 * Если задача сопоставляется с позицией каталога — используется
 * диапазон каталога с модификаторами. Если совпадения нет — заказ
 * помечается как прецедент (isPrecedent = true), и цена определяется
 * переговорами клиента и мастера (см. negotiation в types.js). После
 * закрытия такого заказа оператор может добавить согласованную цену
 * в каталог как новую позицию (см. createCatalogItemFromPrecedent).
 */

/** @type {Record<string, (basePrice:number, ctx:any)=>number>} */
const MODIFIERS = {
  urgency_urgent: (price) => price * 1.25,
  high_quantity: (price, ctx) => price * Math.max(1, ctx.quantity || 1) * 0.9,
  hard_access: (price) => price * 1.15,
  needs_materials: (price) => price * 1.1,
};

/**
 * @param {import('./types.js').ServiceCatalogItem[]} catalog
 * @param {{categoryId:string, keywords?:string[]}} taskHint
 * @returns {import('./types.js').ServiceCatalogItem|null}
 */
function matchCatalogItem(catalog, taskHint) {
  const activeInCategory = catalog.filter(
    (item) => item.active && item.categoryId === taskHint.categoryId
  );
  if (activeInCategory.length === 0) return null;

  if (taskHint.keywords && taskHint.keywords.length > 0) {
    const lowerKeywords = taskHint.keywords.map((k) => k.toLowerCase());
    const byTitle = activeInCategory.find((item) =>
      lowerKeywords.some((k) => item.title.toLowerCase().includes(k))
    );
    if (byTitle) return byTitle;
  }
  return activeInCategory[0];
}

/**
 * @param {import('./types.js').ServiceCatalogItem} item
 * @param {{quantity?:number, urgency?:string, hardAccess?:boolean, needsMaterials?:boolean}} ctx
 * @returns {{min:number, max:number, factors:string[]}}
 */
function calculateEstimate(item, ctx = {}) {
  let min = item.basePriceMin;
  let max = item.basePriceMax;
  const factors = [];

  if (ctx.urgency === 'urgent' && item.modifiers.includes('urgency_urgent')) {
    min = MODIFIERS.urgency_urgent(min, ctx);
    max = MODIFIERS.urgency_urgent(max, ctx);
    factors.push('Срочность (сегодня/в течение часов)');
  }
  if ((ctx.quantity || 1) > 1 && item.modifiers.includes('high_quantity')) {
    min = MODIFIERS.high_quantity(min, ctx);
    max = MODIFIERS.high_quantity(max, ctx);
    factors.push(`Количество: ${ctx.quantity}`);
  }
  if (ctx.hardAccess && item.modifiers.includes('hard_access')) {
    min = MODIFIERS.hard_access(min);
    max = MODIFIERS.hard_access(max);
    factors.push('Затруднённый доступ к месту работы');
  }
  if (ctx.needsMaterials && item.modifiers.includes('needs_materials')) {
    min = MODIFIERS.needs_materials(min);
    max = MODIFIERS.needs_materials(max);
    factors.push('Требуются материалы');

    min: Math.round(min),
    max: Math.round(max),

    order.negotiation.workerOffer ?? order.negotiation.customerOffer ?? 0;

    categoryId: order.categoryId,

    modifiers: [],
    riskFlag: false,
    active: false, // оператор включает вручную после проверки
    origin: 'precedent',

/**

 * широте/долготе + индекса, либо расширения earthdistance/PostGIS,
 * например:

 *     and not blocked

 *     and lng between :minLng and :maxLng

const EARTH_RADIUS_KM = 6371;

/**
 * @param {import('./types.js').GeoPoint} a
 * @param {import('./types.js').GeoPoint} b
 */
function distanceKm(a, b) {
  const dLat = ((b.lat - a.lat) * Math.PI) / 180;
  const dLng = ((b.lng - a.lng) * Math.PI) / 180;
  const lat1 = (a.lat * Math.PI) / 180;
  const lat2 = (b.lat * Math.PI) / 180;

  const h =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
  const c = 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
  return EARTH_RADIUS_KM * c;
}

/** Bounding box для быстрого предварительного отсева по индексу. */
function boundingBox(center, radiusKm) {

  const lngDelta =
    radiusKm / (111 * Math.cos((center.lat * Math.PI) / 180) || 1);
  return {
    minLat: center.lat - latDelta,
    maxLat: center.lat + latDelta,
    minLng: center.lng - lngDelta,
    maxLng: center.lng + lngDelta,
  };
}

    .filter((u) => !u.blocked)
    .filter((u) => u.availableAsWorker)
    .filter((u) => u.id !== order.customerId) // нельзя стать исполнителем своего заказа
    .filter(
      (u) =>
        u.location.lat >= box.minLat &&
        u.location.lat <= box.maxLat &&
        u.location.lng >= box.minLng &&
        u.location.lng <= box.maxLng
    )
    .filter((u) => u.skills.some((s) => s.categoryId === order.categoryId))
    .map((u) => ({ user: u, distanceKm: distanceKm(u.location, order.exactLocation) }))
    .filter((c) => c.distanceKm <= (order.searchRadiusKm || 3))
    .sort((x, y) => {
      // релевантность: сначала верифицированный навык, затем расстояние, затем рейтинг
      const xVerified = x.user.skills.some(
        (s) => s.categoryId === order.categoryId && s.verification === 'verified'
      );
      const yVerified = y.user.skills.some(
        (s) => s.categoryId === order.categoryId && s.verification === 'verified'
      );
      if (xVerified !== yVerified) return xVerified ? -1 : 1;
      if (Math.abs(x.distanceKm - y.distanceKm) > 0.05) return x.distanceKm - y.distanceKm;
      return y.user.rating - x.user.rating;
    });
}

/**
 * Публичное представление заказа для кандидата (до назначения):
 * точный адрес и контакт заказчика скрыты.
 * @param {import('./types.js').Order} order
 */
function toPublicOrderView(order) {
  const { exactLocation, ...rest } = order;
  return {
    ...rest,
    approxDistanceKm: undefined, // считается отдельно на карточке кандидата
  };
}

/**
 * Полное представление заказа доступно только назначенному исполнителю.
 * @param {import('./types.js').Order} order
 * @param {string} requestingUserId
 */
function toWorkerOrderView(order, requestingUserId) {
  if (order.assignedWorkerId === requestingUserId) {
    return order; // включая exactLocation
  }
  return toPublicOrderView(order);
}

/**

const TEMPLATES = {
  order_published: () => 'Заказ создан, ожидаем отклика мастеров рядом.',
  worker_found: (ctx) => `Мастер найден: ${ctx.workerName}. Приедет в интервал ${ctx.timeWindow}.`,

  work_started: () => 'Мастер начал работу.',

  issue_reported: () => 'По заказу зарегистрирована проблема, мы уже разбираемся.',
  new_matching_order: (ctx) => `Рядом появился подходящий заказ: «${ctx.orderTitle}».`,
  order_assigned_to_you: (ctx) => `Вам назначен заказ: «${ctx.orderTitle}».`,
  order_cancelled: () => 'Заказ отменён или изменён заказчиком.',
  order_confirmed_by_customer: () => 'Заказчик подтвердил выполнение заказа.',
};

/**
 * @param {string} recipientUserId
 * @param {'customer'|'worker'} recipientRole
 * @param {string} orderId
 * @param {keyof typeof TEMPLATES} eventKey
 * @param {Object} ctx
 * @returns {import('./types.js').NotificationEvent}
 */
function createNotification(recipientUserId, recipientRole, orderId, eventKey, ctx = {}) {
  const template = TEMPLATES[eventKey];
  if (!template) throw new Error(`Неизвестное событие уведомления: ${eventKey}`);
  return {
    id: `ntf-${orderId}-${eventKey}-${Math.random().toString(36).slice(2, 8)}`,
    recipientUserId,
    recipientRole,
    orderId,
    text: template(ctx),
    channel: 'telegram', // реальная отправка выполняется адаптером
    createdAt: new Date().toISOString(),
  };
}


// ---- js/adapters/supabaseAdapter.js ----
/**
 * Точка интеграции с Supabase.
 *
 * Все операции — обычные вызовы PostgREST (встроенный REST API
 * Supabase), без отдельной библиотеки supabase-js — так проще держать
 * прототип в один файл без сборки.
 *
 * Белый список операций: наружу торчат только конкретные функции ниже
 * (getRows/insertRow/updateRow), а не произвольный доступ к базе —
 * это соответствует требованию брифа "доступные операции ограничены
 * белым списком".
 *
 * Публичный (publishable/anon) ключ безопасен для клиента ТОЛЬКО
 * потому что на таблицах включены RLS-политики. Для MVP сейчас стоят
 * открытые политики (anon/authenticated: полный доступ) — сознательный
 * компромисс скорости запуска, описанный отдельно в README. Для продакшена
 * это нужно сузить (например, через Edge Functions на service_role).
 */

function getConfig() {
  const env = (typeof window !== 'undefined' && window.__ENV__) || {};
  return { url: env.SUPABASE_URL || '', key: env.SUPABASE_ANON_KEY || '' };
}

function isSupabaseConfigured() {
  const { url, key } = getConfig();
  return Boolean(url && key);
}

function getBackendMode() {
  return isSupabaseConfigured() ? 'supabase' : 'local-stub';
}

function headers(extra = {}) {
  const { key } = getConfig();
  return {
    apikey: key,
    Authorization: `Bearer ${key}`,
    'Content-Type': 'application/json',
    ...extra,
  };
}

/**
 * @param {string} table
 * @param {string} [query] — например "select=*&order=created_at.desc"
 */
async function getRows(table, query = 'select=*') {
  const { url } = getConfig();
  const res = await fetch(`${url}/rest/v1/${table}?${query}`, {
    headers: headers(),
  });
  if (!res.ok) {
    throw new Error(`Supabase GET ${table} failed: ${res.status} ${await res.text()}`);
  }
  return res.json();
}

/**
 * @param {string} table
 * @param {Object} row
 * @returns {Promise<Object>} вставленная строка (с сгенерированными полями)
 */
async function insertRow(table, row) {
  const { url } = getConfig();
  const res = await fetch(`${url}/rest/v1/${table}`, {
    method: 'POST',
    headers: headers({ Prefer: 'return=representation' }),
    body: JSON.stringify(row),
  });
  if (!res.ok) {
    throw new Error(`Supabase INSERT ${table} failed: ${res.status} ${await res.text()}`);
  }
  const data = await res.json();
  return Array.isArray(data) ? data[0] : data;
}

/**
 * @param {string} table
 * @param {string} id
 * @param {Object} patch
 */
async function updateRow(table, id, patch) {
  const { url } = getConfig();
  const res = await fetch(`${url}/rest/v1/${table}?id=eq.${encodeURIComponent(id)}`, {
    method: 'PATCH',
    headers: headers({ Prefer: 'return=representation' }),
    body: JSON.stringify(patch),
  });
  if (!res.ok) {
    throw new Error(`Supabase UPDATE ${table} failed: ${res.status} ${await res.text()}`);
  }
  const data = await res.json();
  return Array.isArray(data) ? data[0] : data;
}

/**
 * Вход по номеру телефона (см. app.js: ensureUserByPhone).
 *
 * Раньше вход был через Telegram-бота (код в диплинке); от этого отказались
 * в пользу прямого ввода телефона в форме заявки — быстрее и не требует
 * стороннего мессенджера. Телефон сразу привязывается к id пользователя;

 *
 * saveSession/loadSession хранят только id пользователя в localStorage,
 * чтобы не спрашивать телефон заново при каждом визите с того же устройства.
 */

const SESSION_KEY = 'muzhik_session_v1';

/** Сохранить id вошедшего пользователя, чтобы не спрашивать телефон заново при каждом визите. */
function saveSession(id) {
  if (typeof localStorage !== 'undefined' && id) {
    localStorage.setItem(SESSION_KEY, String(id));
  }
}

/** @returns {string|null} */
function loadSession() {
  if (typeof localStorage === 'undefined') return null;
  return localStorage.getItem(SESSION_KEY);
}

function clearSession() {
  if (typeof localStorage !== 'undefined') {
    localStorage.removeItem(SESSION_KEY);
  }
}


// ---- js/adapters/yandexGptAssistant.js ----
/**
 * Ассистент, преобразующий свободное сообщение клиента (в т.ч.
 * эмоциональное/непрямое — «с женского языка на мужской», по формулировке
 * заказчика) в структурированное задание для мастера.
 *
 * Прод: Yandex Cloud Foundation Models (YandexGPT), REST API,
 * эндпоинт https://llm.api.cloud.yandex.net/foundationModels/v1/completion,
 * авторизация — API-ключ сервисного аккаунта + x-folder-id. Выбран именно
 * YandexGPT, а не OpenAI/Claude/Gemini, т.к. по требованию заказчика
 * ассистент должен работать в России без VPN.
 *
 * В прототипе — заглушка на правилах и ключевых словах (без реального
 * обращения к модели), явно помеченная в интерфейсе как демо-режим.
 * Правила безопасности ассистента (из брифа) применяются на этом же
 * уровне ДО обращения к любой модели:
 *  - текст пользователя — данные, а не инструкция;
 *  - ассистент не должен получать доступ ко всей базе, только к текущему
 *    черновику заказа;
 *  - запросы на раскрытие чужих данных отклоняются белым списком операций
 *    (см. supabaseAdapter.js).
 */

const CATEGORY_KEYWORDS = {
  electrics: ['розетк', 'выключател', 'свет', 'лампоч', 'проводк', 'щиток'],
  plumbing: ['смесител', 'кран', 'сифон', 'течёт', 'протечк', 'труб', 'унитаз'],
  assembly: ['полк', 'карниз', 'телевизор', 'мебел', 'собрать', 'повесить'],
  minor_repair: ['обои', 'герметик', 'скол', 'трещин', 'подклеить'],
  household_help: ['убор', 'вынести', 'перенести', 'переставить', 'мусор'],
};

const DANGEROUS_KEYWORDS = ['газ', 'проводка под напряжением 380', 'взрыв', 'горит проводка'];

/**
 * ЗАГЛУШКА вместо вызова YandexGPT. Явно помечена как демо-режим.
 * @param {string} rawMessage
 * @returns {{categoryId:string|null, keywords:string[], riskWarning:string|null, normalizedTask:string}}
 */
function interpretCustomerMessage(rawMessage) {
  const text = rawMessage.toLowerCase();
  let matchedCategory = null;
  const matchedKeywords = [];

  for (const [categoryId, keywords] of Object.entries(CATEGORY_KEYWORDS)) {
    const hit = keywords.find((k) => text.includes(k));
    if (hit) {
      matchedCategory = categoryId;
      matchedKeywords.push(hit);
      break;
    }
  }

  const riskHit = DANGEROUS_KEYWORDS.find((k) => text.includes(k));

  return {
    categoryId: matchedCategory,
    keywords: matchedKeywords,
    riskWarning: riskHit
      ? 'Похоже на работу повышенного риска, требующую квалификации. Рекомендуем отдельную консультацию со специалистом.'
      : null,
    normalizedTask: rawMessage.trim(),
    isDemoInterpretation: true,
  };
}

function assistantDemoNotice() {
  return 'Ассистент работает в демо-режиме на ключевых словах. В проде — YandexGPT.';
}

/**
 * Оплата/предоплата заказа — заказчик ещё не выбрал финальную схему
 * (см. открытые решения в продуктовом брифе, п.20). Требование: шаг
 * оплаты должен присутствовать в пути клиента уже сейчас, даже если
 * реального эквайринга нет.
 *
 * В прототипе доступны только заглушки методов:
 *  - 'on_site'    — оплата мастеру на месте (без предоплаты);
 *  - 'online_stub'— имитация онлайн-предоплаты (без реального списания).
 *
 * Точка интеграции для продакшена: любой российский эквайринг с
 * поддержкой рекуррентных/холдовых платежей (ЮKassa, Тинькофф и т.п.),
 * подключается сюда без изменений в доменном слое и UI.
 */

/**
 * @param {'on_site'|'online_stub'} method
 * @param {number} amount
 * @returns {import('./types.js').PaymentInfo}
 */
function initiatePayment(method, amount) {
  if (method === 'online_stub') {
    return {
      status: 'prepayment_pending',
      amount,
      method,
      paidAt: null,
    };
  }
  return {
    status: 'none',
    amount,
    method: 'on_site',
    paidAt: null,
  };
}

/** ЗАГЛУШКА подтверждения оплаты — в проде вебхук от платёжного провайдера. */
function confirmMockPayment(paymentInfo) {
  if (paymentInfo.status !== 'prepayment_pending') return paymentInfo;
  return {
    ...paymentInfo,
    status: 'prepayment_paid',
    paidAt: new Date().toISOString(),
  };
}


// ---- js/store/localStore.js (изолирован в IIFE, чтобы имена не конфликтовали с dataStore.js) ----
const local = (function(){
/**
 * Локальная персистентность (замена Supabase, пока нет реального проекта).
 * Реализует тот же набор таблиц/операций, чтобы переключение на
 * supabaseAdapter.js в будущем не потребовало переписывать домен и UI.
 * Данные переживают перезагрузку страницы (localStorage).
 */

const KEY = 'muzhik_db_v1';

function readDb() {
  const raw = typeof localStorage !== 'undefined' ? localStorage.getItem(KEY) : null;
  if (!raw) return null;
  try {
    return JSON.parse(raw);
  } catch {
    return null;
  }
}

function writeDb(db) {
  if (typeof localStorage !== 'undefined') {
    localStorage.setItem(KEY, JSON.stringify(db));
  }
}

function initDb(seed) {
  const existing = readDb();
  if (existing) return existing;
  writeDb(seed);
  return seed;
}

function resetDb(seed) {
  writeDb(seed);
  return seed;
}

function getDb() {
  return readDb() || { users: [], orders: [], services: [], notifications: [] };
}

function saveUser(user) {
  const db = getDb();
  const idx = db.users.findIndex((u) => u.id === user.id);
  if (idx >= 0) db.users[idx] = user;
  else db.users.push(user);
  writeDb(db);
  return user;
}

function saveOrder(order) {
  const db = getDb();
  const idx = db.orders.findIndex((o) => o.id === order.id);
  if (idx >= 0) db.orders[idx] = order;
  else db.orders.push(order);
  writeDb(db);
  return order;
}

function saveService(service) {
  const db = getDb();
  const idx = db.services.findIndex((s) => s.id === service.id);
  if (idx >= 0) db.services[idx] = service;
  else db.services.push(service);
  writeDb(db);
  return service;
}

function pushNotification(notification) {
  const db = getDb();
  db.notifications.push(notification);
  writeDb(db);
  return notification;
}

function getUsers() {
  return getDb().users;
}

function getOrders() {
  return getDb().orders;
}

function getServices() {
  return getDb().services;
}

function getNotificationsFor(userId) {
  return getDb().notifications.filter((n) => n.recipientUserId === userId);
}

  return { initDb, resetDb, getUsers, getOrders, getServices, getNotificationsFor, saveUser, saveOrder, saveService, pushNotification };
})();

// ---- js/store/dataStore.js ----
/**
 * Единый слой данных для приложения.
 *
 * Раньше UI напрямую работал с localStore.js (localStorage-заглушка).
 * Теперь это дата-стор с тем же публичным интерфейсом (getUsers,
 * getOrders, getServices, getNotificationsFor, saveUser, saveOrder,
 * saveService, pushNotification, addSkillForUser, initDb), который
 * внутри выбирает реальный backend (Supabase) или локальную заглушку —
 * в зависимости от того, настроены ли SUPABASE_URL/KEY (см.
 * adapters/supabaseAdapter.js).
 *
 * Важно для UI: чтение (getUsers/getOrders/...) остаётся СИНХРОННЫМ —
 * оно всегда отдаёт данные из локального кэша в памяти. Кэш заполняется
 * один раз при старте (initDb) и обновляется сразу при каждой записи.
 * Сама сетевая запись в Supabase уходит в фоне; в редком случае сбоя
 * сети показывается тост с ошибкой, но интерфейс не блокируется.
 */



const cache = {
  users: [],
  orders: [],
  services: [],
  notifications: [],
};

let onSyncError = () => {};
function setSyncErrorHandler(fn) {
  onSyncError = fn;
}

// Флаг «не удалось загрузить данные при самом первом старте приложения» —
// отдельно от обычных фоновых сбоев синхронизации (те остаются тихим
// тостом). Если стартовая загрузка не удалась, UI покажет полноэкранный
// экран «долгое ожидание» вместо пустого/сломанного главного экрана.
let bootLoadFailed = false;
function hadBootLoadFailure() {
  return bootLoadFailed;
}

function reportError(context, err) {
  console.error(`[dataStore] ${context}:`, err);
  if (context === 'загрузка данных при старте') {
    bootLoadFailed = true;
    return;
  }
  onSyncError(`Не удалось синхронизировать данные (${context}). Изменение сохранено только локально.`);
}

    customer_budget: order.customerBudget,
    estimate: order.estimate,
    payment: order.payment,
    status: order.status,
    timeline: order.timeline,
    warnings: order.warnings,
    is_precedent: order.isPrecedent,
    negotiation: order.negotiation,
  };
}

function dbServiceToService(row) {
  return {
    id: row.id,
    categoryId: row.category_id,
    title: row.title,
    basePriceMin: Number(row.base_price_min),
    basePriceMax: Number(row.base_price_max),
    unit: row.unit,
    modifiers: row.modifiers || [],
    riskFlag: Boolean(row.risk_flag),
    active: Boolean(row.active),
    origin: row.origin || 'catalog',
  };
}

function serviceToDbService(service) {
  return {
    id: service.id,
    category_id: service.categoryId,
    title: service.title,
    base_price_min: service.basePriceMin,
    base_price_max: service.basePriceMax,
    unit: service.unit,
    modifiers: service.modifiers,
    risk_flag: service.riskFlag,
    active: service.active,
    origin: service.origin,
  };
}

function dbNotificationToNotification(row) {
  return {
    id: row.id,
    recipientUserId: row.recipient_user_id,
    recipientRole: row.recipient_role,
    orderId: row.order_id,
    text: row.text,
    channel: row.channel,
    createdAt: row.created_at,
  };
}

function notificationToDbNotification(n) {
  return {
    recipient_user_id: n.recipientUserId,
    recipient_role: n.recipientRole,
    order_id: n.orderId,
    text: n.text,
    channel: n.channel,
  };
}

// ---------------------------------------------------------------------
// Инициализация
// ---------------------------------------------------------------------

/**
 * @param {Object} localSeed — демоданные для режима без Supabase
 */
async function initDb(localSeed) {
  if (!isSupabaseConfigured()) {
    const db = local.initDb(localSeed);
    cache.users = db.users;
    cache.orders = db.orders;
    cache.services = db.services;
    cache.notifications = db.notifications;
    return cache;
  }

  try {
    const [userRows, skillRows, orderRows, serviceRows, notificationRows] = await Promise.all([
      getRows('users'),
      getRows('skills'),
      getRows('orders'),
      getRows('services'),
      getRows('notifications', 'select=*&order=created_at.desc&limit=200'),
    ]);

    const skillsByUser = {};
    skillRows.forEach((row) => {
      const skill = dbSkillToSkill(row);
      if (!skillsByUser[row.user_id]) skillsByUser[row.user_id] = [];
      skillsByUser[row.user_id].push(skill);
    });

    cache.users = userRows.map((row) => dbUserToUser(row, skillsByUser));
    cache.orders = orderRows.map(dbOrderToOrder);
    cache.services = serviceRows.map(dbServiceToService);
    cache.notifications = notificationRows.map(dbNotificationToNotification);
  } catch (err) {
    reportError('загрузка данных при старте', err);
    // не блокируем интерфейс — работаем с тем, что успели получить (может быть пусто)
  }
  return cache;
}

function resetDb() {
  if (!isSupabaseConfigured()) {
    return local.resetDb(arguments[0]);
  }
  console.warn('[dataStore] resetDb недоступен в режиме Supabase — это реальные данные.');
  return cache;
}

// ---------------------------------------------------------------------
// Чтение (всегда синхронно, из кэша)
// ---------------------------------------------------------------------

function getUsers() {
  return cache.users;
}
function getOrders() {
  return cache.orders;
}
function getServices() {
  return cache.services;
}
function getNotificationsFor(userId) {
  return cache.notifications.filter((n) => n.recipientUserId === userId);
}

// ---------------------------------------------------------------------
// Запись: обновляем кэш сразу, в Supabase — в фоне
// ---------------------------------------------------------------------

function saveUser(user) {
  const idx = cache.users.findIndex((u) => u.id === user.id);
  if (idx >= 0) cache.users[idx] = user;
  else cache.users.push(user);

  if (!isSupabaseConfigured()) {
    local.saveUser(user);
    return user;
  }

  const isNew = !user.id || user.id.startsWith('local-');
  const payload = userToDbUser(user);

  if (isNew) {
    insertRow('users', payload)
      .then((row) => {
        const created = dbUserToUser(row, {});
        created.skills = user.skills;
        const i = cache.users.findIndex((u) => u === user);
        if (i >= 0) cache.users[i] = created; if (state.currentUserId === user.id) state.currentUserId = created.id;
      })
      .catch((err) => reportError('сохранение пользователя', err));
  } else {
    updateRow('users', user.id, payload).catch((err) => reportError('сохранение пользователя', err));
  }
  return user;
}

function addSkillForUser(userId, skill) {
  const user = cache.users.find((u) => u.id === userId);
  if (!user) return;
  user.skills = [...user.skills, skill];

  if (!isSupabaseConfigured()) {
    local.saveUser(user);
    return;
  }

  insertRow('skills', {
    user_id: userId,
    category_id: skill.categoryId,
    note: skill.note,
    verification: skill.verification,
  }).catch((err) => reportError('добавление навыка', err));
}

function saveOrder(order) {
  const idx = cache.orders.findIndex((o) => o.id === order.id);
  if (idx >= 0) cache.orders[idx] = order;
  else cache.orders.push(order);

  if (!isSupabaseConfigured()) {
    local.saveOrder(order);
    return order;
  }

  const isNew = idx < 0 || String(order.id).startsWith('o-');
  const payload = orderToDbOrder(order);

  if (isNew) {
    return insertRow('orders', payload)
      .then((row) => {
        const created = dbOrderToOrder(row);
        const i = cache.orders.findIndex((o) => o === order);
        if (i >= 0) cache.orders[i] = created; return created;
      })
      .catch((err) => { reportError('сохранение заказа', err); return order; });
  } else {
    return updateRow('orders', order.id, payload).then(() => order).catch((err) => { reportError('сохранение заказа', err); return order; });
  }
  return order;
}

function saveService(service) {
  const idx = cache.services.findIndex((s) => s.id === service.id);
  if (idx >= 0) cache.services[idx] = service;
  else cache.services.push(service);

  if (!isSupabaseConfigured()) {
    local.saveService(service);
    return service;
  }

  const payload = serviceToDbService(service);
  updateRow('services', service.id, payload).catch((err) => {
    // если строки ещё нет — пробуем вставить
    insertRow('services', payload).catch((err2) => reportError('сохранение услуги', err2));
  });
  return service;
}

function pushNotification(notification) {
  cache.notifications.push(notification);

  if (!isSupabaseConfigured()) {
    local.pushNotification(notification);
    return notification;
  }

  insertRow('notifications', notificationToDbNotification(notification)).catch((err) =>
    reportError('уведомление', err)
  );
  return notification;
}

// ---------------------------------------------------------------------
// Вход по номеру телефона (без проверки — верификация по SMS появится
// позже; факт подтверждения будет отмечаться полем phone_verified).
// ---------------------------------------------------------------------

/**
 * Нормализует произвольный ввод телефона до 10 цифр локального номера.
 * Понимает: вставленный номер целиком (+7/8 и 11 цифр), дефисы/пробелы,
 * либо уже голые 10 цифр. Возвращает null, если цифр больше/меньше, чем
 * ожидается — тогда UI должен показать ошибку и заблокировать отправку.
 * @param {string} raw
 * @returns {string|null}
 */
function parsePhoneToLocal10(raw) {
  let d = String(raw || '').replace(/\D/g, '');
  if (d.length === 11 && (d[0] === '8' || d[0] === '7')) {
    d = d.slice(1);
  }
  if (d.length !== 10) return null;
  return d;
}

/** @param {string} local10 — ровно 10 цифр */
function formatPhoneRu(local10) {
  const p = local10;
  let out = '+7';
  if (p.length > 0) out += ' ' + p.slice(0, 3);
  if (p.length > 3) out += ' ' + p.slice(3, 6);
  if (p.length > 6) out += ' ' + p.slice(6, 8);
  if (p.length > 8) out += ' ' + p.slice(8, 10);
  return out;
}

/**
 * Красивый вид номера для экрана («+7 916 533 95 88») из того, что лежит
 * в базе — а там он хранится «голыми» цифрами (см. ensureUserByPhone).
 * На случай уже отформатированных старых записей просто возвращает
 * значение как есть, если разобрать до 10 цифр не удалось.
 * @param {string} phone
 */
function displayPhone(phone) {
  if (!phone) return '';
  const local10 = parsePhoneToLocal10(phone);
  return local10 ? formatPhoneRu(local10) : phone;
}

/**
 * Убирает ведущий признак кода страны («+7», «7» или «8» в самом начале строки),
 * чтобы сама «+7», уже стоящая в поле по умолчанию, не считалась введённой
 * пользователем цифрой. Остаток очищается от всех нецифровых символов.
 * @param {string} raw
 * @returns {string}
 */
function stripCountryPrefixDigits(raw) {
  let s = String(raw || '');
  if (s.startsWith('+7')) {
    s = s.slice(2);
  } else if (s.startsWith('7') || s.startsWith('8')) {
    s = s.slice(1);
  }
  return s.replace(/\D/g, '');
}

/**
 * Живое форматирование поля телефона по мере ввода/вставки.
 * @param {HTMLInputElement} input
 * @param {HTMLElement} errorEl
 * @param {() => void} onChange — вызывается после каждого пересчёта (обновить кнопку отправки и т.п.)
 */
function wirePhoneField(input, errorEl, onChange) {
  const recalc = () => {
    const raw = input.value;
    let d = stripCountryPrefixDigits(raw);
    if (d.length > 10 && (d[0] === '7' || d[0] === '8')) {
      d = d.slice(1);
    }
    if (d.length > 10) {
      input.dataset.valid = 'false';
      if (errorEl) {
        errorEl.textContent = 'Проверьте номер — похоже, в нём лишние цифры';
        errorEl.style.display = 'block';
      }
      onChange();
      return;
    }
    if (errorEl) errorEl.style.display = 'none';
    input.value = formatPhoneRu(d);
    input.dataset.valid = parsePhoneToLocal10(d) ? 'true' : 'false';
    onChange();
  };
  input.addEventListener('input', recalc);
  input.addEventListener('paste', () => setTimeout(recalc, 0));
  recalc();
}

/**
 * Находит пользователя по телефону (сначала в кэше, затем в Supabase),
 * а если такого ещё нет — создаёт нового и ЖДЁТ реальный id из базы
 * (важно: без этого id, полученный сразу после saveOrder, ещё был бы
 * временным local-... и заказ не сохранился бы — та же причина, по
 * которой раньше не проходила публикация заказа).
 * @param {string} phone — уже отформатированный «+7 XXX XXX XX XX»
 * @param {{location?: {lat:number,lng:number}, district?: string}} [extra]
 */
async function ensureUserByPhone(phone, extra = {}) {
  // Канонический формат ХРАНЕНИЯ телефона в базе — 11 цифр с кодом
  // страны, без «+» и пробелов («79165339588»), см. CANONICAL_PHONE_RE
  // рядом. В интерфейсе номер всё равно вводится/показывается красиво
  // («+7 916 533 95 88», см. formatPhoneRu) — это только про то, что
  // лежит в столбце users.phone, чтобы один и тот же человек не заводил
  // по случайности второй аккаунт из-за разного начертания номера.
  const local10 = stripCountryPrefixDigits(phone);
  const canonicalPhone = '7' + local10;
  let user = cache.users.find((u) => stripCountryPrefixDigits(u.phone || '') === local10);
  if (user) return user;

  if (isSupabaseConfigured()) {
    try {
      // На случай записей ещё в старом «человеческом» начертании (до
      // этого исправления телефон в базу писался как в поле ввода) —
      // ищем и по каноническому виду, и по нему. Если вдруг найдутся
      // записи в обоих (исторический дубль), отдаём предпочтение той, где
      // уже привязан Telegram, а при прочих равных — более старой.
      const humanPhone = formatPhoneRu(local10);
      const query = `or=(phone.eq.${encodeURIComponent(canonicalPhone)},phone.eq.${encodeURIComponent(humanPhone)})&order=telegram_id.nullslast,created_at.asc&limit=1&select=*`;
      const rows = await getRows('users', query);
      if (rows[0]) {
        const skillRows = await getRows('skills', `user_id=eq.${rows[0].id}`);
        const skillsByUser = {};
        skillRows.forEach((row) => {
          const skill = dbSkillToSkill(row);
          if (!skillsByUser[row.user_id]) skillsByUser[row.user_id] = [];
          skillsByUser[row.user_id].push(skill);
        });
        user = dbUserToUser(rows[0], skillsByUser);
        cache.users.push(user);
        return user;
      }
    } catch (err) {
      reportError('поиск пользователя по телефону', err);
    }
  }

  const draft = {
    id: `local-${Date.now()}`,
    telegramId: '',
    displayName: 'Гость',
    phone: canonicalPhone,
    phoneVerified: false,
    location: extra.location || CENTER,
    district: extra.district || '',
    searchRadiusKm: 3,
    skills: [],
    availableAsWorker: false,
    rating: 0,
    ratingCount: 0,
    customerRating: 0,
    customerRatingCount: 0,
    blocked: false,
    createdAt: new Date().toISOString(),
  };
  cache.users.push(draft);

  if (!isSupabaseConfigured()) {
    local.saveUser(draft);
    return draft;
  }

  try {
    const row = await insertRow('users', userToDbUser(draft));
    const created = dbUserToUser(row, {});
    created.skills = [];
    const i = cache.users.findIndex((u) => u === draft);
    if (i >= 0) cache.users[i] = created;
    return created;
  } catch (err) {
    reportError('создание пользователя по телефону', err);
    return draft;
  }
}

// ---------------------------------------------------------------------
// Привязка Telegram для уведомлений (не авторизация — она уже произошла
// по номеру телефона выше). Путь человека: нажимает "Открыть бота и
// получить код" → открывается бот в Telegram → бот сам генерирует
// 4-значный код и пишет его в чат ("введите этот код на сайте «Мужик
// рядом» для авторизации через Telegram") → человек вводит код на сайте
// и жмёт "Подтвердить".
// Бот должен сам вставлять строку в public.login_codes (code, telegram_id)
// при выдаче кода — сайт эту строку только читает по code, введённому
// человеком, ничего не создаёт заранее.
// Если telegram_id уже привязан к другому пользователю, UPDATE упадёт на
// unique-ограничении users_telegram_id_key — reportError покажет ошибку.
//
// Лимиты на повторный запрос кода (не раньше чем через 1 мин, третий и
// далее — не раньше чем через 2 мин; максимум 5 запросов в час и 10 в
// сутки) — ЭТО ТОЛЬКО клиентская подсказка в интерфейсе (localStorage,
// per-device), не настоящая защита: обойти легко, очистив localStorage
// или открыв бота напрямую в Telegram в обход сайта. Настоящий лимит
// должен стоять в самом боте (BotHelp) — сайт технически не может
// запретить боту отправить сообщение.
// ---------------------------------------------------------------------

/**
 * @param {string} code
 * @returns {Promise<{telegram_id: string|null}|null>}
 */
async function getLoginCodeStatus(code) {
  if (!isSupabaseConfigured()) return null;
  // expires_at=gt.now — просроченный код (бот выдаёт их на 10 минут) не
  // должен больше проходить как действительный.
  const rows = await getRows(
    'login_codes',
    `code=eq.${encodeURIComponent(code)}&expires_at=gt.${encodeURIComponent(new Date().toISOString())}&select=telegram_id`
  );
  return rows[0] || null;
}

const TELEGRAM_LINK_ATTEMPTS_KEY = 'muzhik_tg_link_attempts_v1';

function getTelegramLinkAttempts() {
  try {
    const raw = localStorage.getItem(TELEGRAM_LINK_ATTEMPTS_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    const now = Date.now();
    return Array.isArray(arr) ? arr.filter((t) => typeof t === 'number' && now - t < 24 * 60 * 60 * 1000) : [];
  } catch {
    return [];
  }
}

function recordTelegramLinkAttempt() {
  const attempts = getTelegramLinkAttempts();
  attempts.push(Date.now());
  try {
    localStorage.setItem(TELEGRAM_LINK_ATTEMPTS_KEY, JSON.stringify(attempts));
  } catch {
    // localStorage недоступен (приватный режим и т.п.) — просто не считаем лимит
  }
}

/**
 * @returns {{canRequest: boolean, waitSeconds: number, overHour: boolean, overDay: boolean}}
 */
function getTelegramLinkLimitState() {
  const now = Date.now();
  const attempts = getTelegramLinkAttempts();
  const hourCount = attempts.filter((t) => now - t < 60 * 60 * 1000).length;
  const dayCount = attempts.length;
  const last = attempts[attempts.length - 1];
  // 1-й запрос — сразу; 2-й — не раньше чем через 1 мин после 1-го;
  // 3-й и далее — не раньше чем через 2 мин после предыдущего.
  const cooldownMs = attempts.length === 0 ? 0 : attempts.length === 1 ? 60_000 : 120_000;
  const waitMs = last ? Math.max(0, last + cooldownMs - now) : 0;
  const overHour = hourCount >= 5;
  const overDay = dayCount >= 10;
  return {
    canRequest: waitMs <= 0 && !overHour && !overDay,
    waitSeconds: Math.ceil(waitMs / 1000),
    overHour,
    overDay,
    // Поле ввода кода показываем только после того, как человек хотя бы раз
    // нажал «Открыть бота» — до этого вводить туда просто нечего (бот ещё
    // ничего не присылал), и поле не должно быть открыто для произвольного
    // подбора кода.
    hasRequested: attempts.length > 0,
  };
}

/**
 * @param {string} rawCode — код, который человек ввёл на сайте (получил от бота)
 *
 * Если человек ещё не авторизован (экран «нужен номер телефона»), код от
 * Telegram-бота используется как альтернативный вход: аккаунт создаётся/
 * находится по номеру из поля #gate-phone, сразу привязывается к нему
 * telegram_id, и человек считается вошедшим — отдельно подтверждать телефон
 * по SMS в этом случае не нужно.
 */
async function submitTelegramLinkCode(rawCode) {
  const code = String(rawCode || '').trim();
  if (!/^\d{3,8}$/.test(code)) {
    showToast('Введите код из чата с ботом (только цифры)');
    return;
  }

  let user = currentUser();
  const wasLoggedIn = !!user;
  let gatePhone = null;
  if (!wasLoggedIn) {
    gatePhone = document.getElementById('gate-phone');
    if (!gatePhone || gatePhone.dataset.valid !== 'true') {
      showToast('Сначала укажите корректный номер телефона');
      return;
    }
  }

  let row;
  try {
    row = await getLoginCodeStatus(code);
  } catch (err) {
    reportError('проверка кода Telegram', err);
    return;
  }
  if (!row || !row.telegram_id) {
    showToast('Код не найден — проверьте, что скопировали его из бота правильно');
    return;
  }

  try {
    if (!wasLoggedIn) {
      user = await ensureUserByPhone(gatePhone.value, {});
    }
    const updated = await updateRow('users', user.id, { telegram_id: row.telegram_id });
    const idx = cache.users.findIndex((u) => u.id === user.id);
    if (idx >= 0) cache.users[idx] = { ...cache.users[idx], telegramId: updated.telegram_id || row.telegram_id };
    if (!wasLoggedIn) {
      state.currentUserId = user.id;
      saveSession(user.id);
    }
    showToast('Telegram подключён — будем присылать уведомления');
    render();
  } catch (err) {
    reportError(wasLoggedIn ? 'привязка Telegram к аккаунту' : 'вход через Telegram', err);
  }
}

/**
 * Карточка привязки Telegram: статус "подключён" либо форма ввода кода,
 * который прислал бот.
 * @param {string} purposeText — например, "получать уведомления о заказе"
 */
function renderTelegramLinkCard(purposeText) {
  const user = currentUser();
  if (!user) return '';
  if (user.telegramId) {
    return `<p class="order-meta"><span>✓ Telegram подключён — уведомления приходят туда</span></p>`;
  }
  const limit = getTelegramLinkLimitState();
  let hint = '';
  if (limit.overDay) {
    hint = 'Дневной лимит запросов кода исчерпан — попробуйте завтра.';
  } else if (limit.overHour) {
    hint = 'Часовой лимит запросов кода исчерпан — попробуйте позже.';
  } else if (limit.waitSeconds > 0) {
    hint = `Повторный код можно запросить через ${limit.waitSeconds} сек.`;
  }
  return `
    <div class="field-card">
      <p class="order-meta">Нажмите кнопку — откроется бот и пришлёт код в чат. Введите этот код здесь, чтобы подключить Telegram и ${escapeHtml(purposeText)}.</p>
      <button class="secondary-button" type="button" style="box-sizing:border-box;" data-action="request-telegram-code" ${limit.canRequest ? '' : 'disabled'}>Открыть бота @${escapeHtml(TELEGRAM_BOT_USERNAME)}</button>
      ${hint ? `<p class="order-meta" style="margin-top:6px;">${escapeHtml(hint)}</p>` : ''}
      ${
        limit.hasRequested
          ? `
      <label style="margin-top:10px;">Код из бота</label>
      <input type="text" id="telegram-link-code" inputmode="numeric" placeholder="0000" />
      <button class="primary-button" data-action="submit-telegram-code">Подтвердить</button>`
          : ''
      }
    </div>
  `;
}

/**
 * Заявка в одно сообщение: описание + адрес (+телефон, если не был
 * авторизован) уже собраны на главном экране — сразу показываем
 * короткую карточку проверки (категория/цена/фото) без пошагового
 * мастера. Категория и время — по тексту сообщения; всё остальное —
 * разумные значения по умолчанию, которые при желании можно будет
 * уточнить в диалоге с мастером.
 */
function startQuickDraft(rawMessage, attachments, address, desiredDate, desiredTimeFrom, desiredTimeTo, exactLocation) {
  const interpretation = interpretCustomerMessage(rawMessage);
  const user = currentUser();
  state.draft = {
    step: 'quickReview',
    rawMessage,
    attachments,
    categoryId: interpretation.categoryId,
    riskWarning: interpretation.riskWarning,
    quantity: 1,
    accessDifficulty: 'easy',
    needsMaterials: false,
    district: address || user?.district || '',
    houseNumberPublic: '',
    fullAddress: address || '',
    useMyLocation: true,
    // Точный адрес из композера (геолокация + Яндекс.Геокодер) в приоритете
    // над местоположением профиля — так подбор мастеров считает расстояние
    // от реального адреса заявки, а не от прежнего/дефолтного местоположения.
    exactLocation: exactLocation || user?.location || CENTER,
    // Храним «сырую» ISO-дату (yyyy-mm-dd), а не отформатированную метку —
    // именно она пойдёт в реальную колонку orders.desired_date (тип date).
    // Человекочитаемое форматирование делается только на отображении.
    desiredDate: desiredDate || '',
    timeWindow: desiredTimeFrom && desiredTimeTo ? `${desiredTimeFrom}–${desiredTimeTo}` : '',
    urgency: 'normal',
    budget: '',
    paymentMethod: 'on_site',
    negotiationOffer: '',
  };
  go('compose');
}

function computeEstimateForDraft() {
  const services = getServices();
  const item = matchCatalogItem(services, {
    categoryId: state.draft.categoryId,
    keywords: state.draft.rawMessage.split(/\s+/),
  });
  if (!item) {
    state.draft.isPrecedent = true;
    state.draft.matchedItem = null;
    state.draft.estimate = { min: 0, max: 0, factors: [] };
    return;
  }
  state.draft.isPrecedent = false;
  state.draft.matchedItem = item;
  state.draft.estimate = calculateEstimate(item, {
    quantity: state.draft.quantity,
    urgency: state.draft.urgency,
    hardAccess: state.draft.accessDifficulty === 'hard',
    needsMaterials: state.draft.needsMaterials,
  });
}

async function publishDraft() {
  const d = state.draft;
  const budgetWarning = d.isPrecedent
    ? null
    : compareBudgetToEstimate(d.budget ? Number(d.budget) : null, d.estimate).warning;

  const orderId = `o-${Date.now()}`;
  let order = {
    id: orderId,
    customerId: state.currentUserId,
    assignedWorkerId: null,
    title: d.rawMessage.slice(0, 60),
    categoryId: d.categoryId,
    description: d.rawMessage,
    desiredOutcome: '',
    scope: {
      quantity: d.quantity,
      demolitionNeeded: false,
      accessDifficulty: d.accessDifficulty,
    },
    attachments: d.attachments,
    hasVoiceTranscript: false,
    voiceTranscript: '',
    exactLocation: d.exactLocation,
    district: d.district,
    houseNumberPublic: d.houseNumberPublic || '',
    fullAddress: d.fullAddress || '',
    desiredDate: d.desiredDate,
    timeWindow: d.timeWindow,
    urgency: d.urgency,
    customerBudget: d.budget ? Number(d.budget) : null,
    estimate: d.isPrecedent ? { min: 0, max: 0, factors: [] } : d.estimate,
    payment: initiatePayment(d.paymentMethod, d.isPrecedent ? Number(d.negotiationOffer || 0) : d.estimate.min),
    status: 'draft',
    timeline: [{ status: 'draft', at: new Date().toISOString() }],
    warnings: [
      ...(d.riskWarning ? [d.riskWarning] : []),
      ...(budgetWarning ? [budgetWarning] : []),
      ...(d.isPrecedent ? ['Точная цена не найдена в каталоге — предложите свою цену.'] : []),
    ],
    isPrecedent: Boolean(d.isPrecedent),
    negotiation: {
      customerOffer: d.isPrecedent ? Number(d.negotiationOffer || 0) : null,
      workerOffer: null,
    },
    createdAt: new Date().toISOString(),
  };

  order = transition(order, 'collecting_details');
  order = transition(order, 'estimate_ready');
  order = transition(order, 'searching');
  order = await saveOrder(order);

  pushNotification(
    createNotification(order.customerId, 'customer', order.id, 'order_published')
  );

  // уведомляем подходящих мастеров рядом (событие "новый заказ")
  const candidates = findCandidateWorkers(getUsers(), order);
  candidates.forEach((c) => {
    pushNotification(
      createNotification(c.user.id, 'worker', order.id, 'new_matching_order', {
        orderTitle: order.title,
      })
    );
  });

  // Сначала переключаем экран (иначе showToast() вызовет render() для ещё
  // активного экрана 'compose' с уже обнулённым state.draft — исключение).
  state.draft = null;
  go('orderDetail', { openOrderId: order.id });
  showToast('Заказ опубликован и виден мастерам рядом');
}

function acceptOrder(orderId) {
  let order = getOrders().find((o) => o.id === orderId);
  order = { ...order, assignedWorkerId: state.currentUserId };
  order = transition(order, 'assigned');
  saveOrder(order);
  pushNotification(
    createNotification(order.customerId, 'customer', order.id, 'worker_found', {
      workerName: currentUser()?.displayName || 'Мастер',
      timeWindow: order.timeWindow,
    })
  );
  pushNotification(
    createNotification(state.currentUserId, 'worker', order.id, 'order_assigned_to_you', {
      orderTitle: order.title,
    })
  );
  showToast('Заказ принят, вы назначены исполнителем');
  render();
}

function advanceWorkerStatus(orderId, nextStatus) {
  let order = getOrders().find((o) => o.id === orderId);
  order = transition(order, nextStatus);
  saveOrder(order);
  const eventMap = { en_route: 'worker_en_route', in_progress: 'work_started', completed: 'work_completed' };

function reportIssue(orderId) {
  let order = getOrders().find((o) => o.id === orderId);
  order = transition(order, 'issue_reported');
  order.warnings = [...order.warnings, 'Зарегистрирована проблема, ожидает разбора.'];
  saveOrder(order);
  pushNotification(createNotification(order.customerId, 'customer', order.id, 'issue_reported'));
  showToast('Проблема зарегистрирована');
  render();

function confirmCompletion(orderId) {
  let order = getOrders().find((o) => o.id === orderId);
  order = transition(order, 'confirmed');
  if (order.payment.status === 'prepayment_pending') {
    order.payment = confirmMockPayment(order.payment);
  }
  saveOrder(order);
  if (order.assignedWorkerId) {
    pushNotification(
      createNotification(order.assignedWorkerId, 'worker', order.id, 'order_confirmed_by_customer')
    );
  }
  render();
}

function rateOrder(orderId, rating) {
  let order = getOrders().find((o) => o.id === orderId);
  order = transition(order, 'rated');
  saveOrder(order);
  if (order.assignedWorkerId) {
    const worker = getUsers().find((u) => u.id === order.assignedWorkerId);
    if (worker) {
      const newCount = worker.ratingCount + 1;
      const newRating = (worker.rating * worker.ratingCount + rating) / newCount;
      saveUser({ ...worker, rating: Math.round(newRating * 10) / 10, ratingCount: newCount });
    }
  }
  showToast('Спасибо за оценку!');
  render();
}

// ---------------------------------------------------------------------
// Автоопределение адреса в композере через геолокацию браузера +
// обратное геокодирование Яндекс.Карт. Это бонус: если ключ геокодера не
// подключён (YANDEX_GEOCODER_API_KEY пуст) или запрос не удался, поле
// адреса всё равно можно заполнить руками — форма ничего не теряет.
// ---------------------------------------------------------------------

/** @returns {Promise<string|null>} человекочитаемый адрес либо null, если ключ не подключён */
async function reverseGeocodeYandex(lat, lng) {
  const env = (typeof window !== 'undefined' && window.__ENV__) || {};
  const apiKey = env.YANDEX_GEOCODER_API_KEY;
  if (!apiKey) return null;
  const url = `https://geocode-maps.yandex.ru/1.x/?apikey=${encodeURIComponent(apiKey)}&geocode=${lng},${lat}&format=json&kind=house&results=1`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Yandex geocoder ${res.status}`);
  const data = await res.json();
  const found = data?.response?.GeoObjectCollection?.featureMember?.[0]?.GeoObject;
  return found?.metaDataProperty?.GeocoderMetaData?.text || found?.name || null;
}

function captureComposerAddressGeo() {
  if (!navigator.geolocation) {
    showToast('Геолокация недоступна в этом браузере — введите адрес вручную');

  const btn = document.getElementById('composer-geo-btn');
  if (btn) {
    btn.disabled = true;

  navigator.geolocation.getCurrentPosition(
    async (pos) => {

        const address = await reverseGeocodeYandex(latitude, longitude);
        if (address) composerAddressValue = address;

// ---------------------------------------------------------------------
// ИИ-ассистент (YandexGPT + SpeechKit через Supabase Edge Function).
// Полностью необязателен: если ASSISTANT_FUNCTION_URL не задан (или
// запрос не удался), функции ниже просто ничего не делают — сайт и так
// собирает нужные данные вручную (текст/адрес/дата/фото). См. также
// interpretCustomerMessage() выше — офлайн-заглушка на ключевых словах,
// которая продолжает работать независимо от этого блока.
// ---------------------------------------------------------------------

function isAssistantConfigured() {
  const env = (typeof window !== 'undefined' && window.__ENV__) || {};
  return Boolean(env.ASSISTANT_FUNCTION_URL);
}

let mediaRecorderInstance = null;
let mediaRecorderChunks = [];
let isRecordingVoice = false;

function updateVoiceButtonUi() {
  const btn = document.querySelector('[data-action="voice-toggle"]');
  if (!btn) return;
  btn.classList.toggle('recording', isRecordingVoice);
  btn.title = isRecordingVoice ? 'Остановить запись' : 'Голосовое сообщение';
}

async function toggleVoiceRecording() {
  if (!isAssistantConfigured()) {
    return showToast('Демо: голосовое сообщение имитируется текстовой расшифровкой');
  }
  if (isRecordingVoice) {
    mediaRecorderInstance?.stop();
    return;
  }
  if (!navigator.mediaDevices?.getUserMedia) {
    showToast('Запись голоса не поддерживается этим браузером — введите текст вручную');
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorderChunks = [];
    mediaRecorderInstance = new MediaRecorder(stream);
    mediaRecorderInstance.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) mediaRecorderChunks.push(e.data);
    };
    mediaRecorderInstance.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      isRecordingVoice = false;
      updateVoiceButtonUi();
      const blob = new Blob(mediaRecorderChunks, { type: mediaRecorderInstance.mimeType || 'audio/webm' });
      await sendVoiceForTranscription(blob);
    };
    mediaRecorderInstance.start();
    isRecordingVoice = true;
    updateVoiceButtonUi();
    showToast('Идёт запись — нажмите ещё раз, чтобы остановить');
  } catch (err) {
    console.error('[voice] доступ к микрофону не получен', err);
    showToast('Не удалось получить доступ к микрофону — введите текст вручную');
  }
}

async function sendVoiceForTranscription(blob) {
  const env = (typeof window !== 'undefined' && window.__ENV__) || {};
  showToast('Расшифровываем голосовое сообщение…');
  try {
    const res = await fetch(`${env.ASSISTANT_FUNCTION_URL}/transcribe`, {
      method: 'POST',
      headers: {
        'Content-Type': blob.type || 'audio/webm',
        // Supabase Edge Functions по умолчанию проверяют JWT — публичный
        // anon-ключ сайта (он и так открыт в window.__ENV__) этой проверке
        // удовлетворяет и не даёт дёргать функцию мимо сайта напрямую.
        Authorization: `Bearer ${env.SUPABASE_ANON_KEY}`,
        apikey: env.SUPABASE_ANON_KEY,
      },
      body: blob,
    });
    if (!res.ok) throw new Error(`transcribe ${res.status}`);
    const data = await res.json();
    const text = (data && data.text) || '';
    if (!text.trim()) {
      showToast('Не удалось распознать речь — попробуйте ещё раз или введите текст вручную');
      return;
    }
    const input = document.getElementById('composer-input');
    if (input) {
      input.value = input.value.trim() ? `${input.value.trim()} ${text.trim()}` : text.trim();
      updateComposerSendState();
      autosizeComposerTextarea(input);
      updateHomeHeroVisibility(input);
      scheduleComposerAssistantCheck(input.value);
    }
    showToast('Голосовое расшифровано — проверьте текст');
  } catch (err) {
    console.error('[voice] расшифровка не удалась', err);
    showToast('Не получилось расшифровать — попробуйте ещё раз или напишите текст вручную');
  }
}

let composerAssistantTimer = null;
let composerAssistantRequestId = 0;

/** Вызывается при каждом вводе текста в композере — с задержкой спрашивает ассистента, не нужно ли уточнение. */
function scheduleComposerAssistantCheck(text) {
  if (!isAssistantConfigured()) return;
  if (composerAssistantTimer) clearTimeout(composerAssistantTimer);
  const trimmed = text.trim();
  if (trimmed.length < 8) {
    const hintEl = document.getElementById('composer-assistant-hint');
    if (hintEl) hintEl.innerHTML = '';
    return;
  }
  composerAssistantTimer = setTimeout(() => runComposerAssistantCheck(trimmed), 1500);
}

async function runComposerAssistantCheck(text) {
  const env = (typeof window !== 'undefined' && window.__ENV__) || {};
  const requestId = ++composerAssistantRequestId;
  try {
    const res = await fetch(`${env.ASSISTANT_FUNCTION_URL}/interpret`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${env.SUPABASE_ANON_KEY}`,
        apikey: env.SUPABASE_ANON_KEY,
      },
      body: JSON.stringify({ text }),
    });
    if (!res.ok) throw new Error(`interpret ${res.status}`);
    const data = await res.json();
    if (requestId !== composerAssistantRequestId) return; // текст уже изменился — ответ устарел
    const hintEl = document.getElementById('composer-assistant-hint');
    if (!hintEl) return;
    hintEl.innerHTML =
      data && data.clarifyingQuestion
        ? `<div class="msg assistant">${escapeHtml(data.clarifyingQuestion)}</div>`
        : '';
  } catch (err) {
    console.warn('[assistant] уточнение не удалось получить', err);
    // Тихо игнорируем — ассистент необязателен, форма и так собирает нужные данные.
  }
}

function render() {
  const app = document.getElementById('app');

  if (state.screen === 'boot' || state.booting) {
    app.innerHTML = renderBooting();
    return;
  }

  if (state.screen === 'bootError') {
    app.innerHTML = renderBootError();
    return;
  }

  const screensRequiringUser = ['orders', 'profile', 'notifications', 'operator', 'orderDetail'];
  if (isSupabaseConfigured() && screensRequiringUser.includes(state.screen) && !currentUser()) {
    app.innerHTML = `
      ${renderTopbarNoUser()}
      <div class="screen">
        <div class="section-title">Нужен номер телефона</div>
        <div class="chat-thread">${renderPhoneGate()}</div>
      </div>
      ${renderBottomNav()}
      ${state.infoOverlay === 'short' ? renderOnboardingOverlay() : state.infoOverlay === 'long' ? renderHelpOverlay() : ''}
    `;
    wireEvents();
    return;
  }

  if (!currentUser() && !isSupabaseConfigured()) {
    app.innerHTML = `
      ${renderTopbarNoUser()}
      ${renderNoUsers()}
    `;
    return;
  }

  let content = '';
  if (state.screen === 'home') content = renderHome();
  else if (state.screen === 'orders') content = renderOrders();
  else if (state.screen === 'compose') content = renderCompose();
  else if (state.screen === 'orderDetail') content = renderOrderDetail();
  else if (state.screen === 'notifications') content = renderNotifications();
  else if (state.screen === 'profile') content = renderProfile();
  else if (state.screen === 'operator') content = renderOperator();

  app.innerHTML = `
    ${renderTopbar()}
    ${content}
    ${renderBottomNav()}
    ${state.toast ? `<div class="toast">${escapeHtml(state.toast)}</div>` : ''}
    ${state.infoOverlay === 'short' ? renderOnboardingOverlay() : state.infoOverlay === 'long' ? renderHelpOverlay() : ''}
  `;

  wireEvents();
}

// ---------------------------------------------------------------------
// Composer: поля адрес/дата свёрнуты в чипы (раскрываются по клику,
// живут в одном ряду с +/микрофоном/отправкой). Телефон сюда не входит —
// он запрашивается позже, на экране подтверждения заказа (см. renderCompose).
// Значения живут вне state, т.к. это черновой ввод конкретной формы, а
// не данные заказа/пользователя.
// ---------------------------------------------------------------------
let composerExpandedField = null; // 'address' | 'date' | null
let composerAddressValue = '';
let composerDesiredDate = ''; // yyyy-mm-dd из <input type="date">
let composerTimeFrom = ''; // HH:MM из <input type="time">
let composerTimeTo = ''; // HH:MM из <input type="time">
// Точные координаты, захваченные кнопкой «Определить автоматически» —
// если заданы, используются как exactLocation заказа вместо CENTER/
// местоположения профиля (см. startQuickDraft). Сбрасываются при ручном
// редактировании адреса — текст и координаты не должны разъезжаться.
let composerExactLocation = null;

const RU_MONTHS_SHORT = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

/**
 * Разрешённое окно для выбора даты заказа: от сегодня и не дальше чем на
 * месяц вперёд — то же ограничение продублировано в CHECK-constraint
 * orders_desired_date_range на таблице orders (защита от подмены даты в
 * обход интерфейса — client-side min/max тут только для UX).
 */
function composerDateBounds() {
  const pad = (n) => String(n).padStart(2, '0');
  const toIso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const now = new Date();
  const max = new Date(now);
  max.setMonth(max.getMonth() + 1);
  return { min: toIso(now), max: toIso(max) };
}

/** Человекочитаемая дата для отображения в карточке/деталях заказа (без «Сегодня/Завтра» — там нужна именно дата). @param {string} dateStr — yyyy-mm-dd */
function formatOrderDateLabel(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (Number.isNaN(d.getTime())) return '';
  return `${d.getDate()} ${RU_MONTHS_SHORT[d.getMonth()]}`;
}

/** @param {string} dateStr — yyyy-mm-dd, @param {string} timeFrom — HH:MM, @param {string} timeTo — HH:MM */
function formatComposerDateLabel(dateStr, timeFrom, timeTo) {
  if (!dateStr) return 'Дата';
  const d = new Date(dateStr + 'T00:00:00');
  if (Number.isNaN(d.getTime())) return 'Дата';
  const today = new Date();
  const tomorrow = new Date(today);
  tomorrow.setDate(today.getDate() + 1);
  let label;
  if (d.toDateString() === today.toDateString()) label = 'Сегодня';
  else if (d.toDateString() === tomorrow.toDateString()) label = 'Завтра';
  else label = `${d.getDate()} ${RU_MONTHS_SHORT[d.getMonth()]}`;
  const time = timeFrom && timeTo ? `${timeFrom}–${timeTo}` : timeFrom || '';
  return time ? `${label}, ${time}` : label;
}

// Краткая карточка-подсказка: всплывает сама при старте сайта, пока
