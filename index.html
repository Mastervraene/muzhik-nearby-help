  // карточки на старте её больше не показываем)
  infoOverlay: null,
  // Навыки на экране профиля — теперь просто кнопки-переключатели (см.
  // renderProfile → «Мои навыки»): клик по навыку открывает звёздный
  // рейтинг прямо под ним, клик по звезде сразу сохраняет уровень и
  // закрывает рейтинг. openSkillPicker — id категории, чей рейтинг сейчас
  // развёрнут (только один одновременно), или null, если ни один не открыт.
  openSkillPicker: null,
};

function currentUser() {
  return getUsers().find((u) => u.id === state.currentUserId) || null;
}

function showToast(text) {
  state.toast = text;
  render();
  setTimeout(() => {
    state.toast = null;
    render();
  }, 2200);
}

// Ключ localStorage, которым запоминаем, что человек уже закрыл краткую
// карточку-подсказку «Локация — самое важное» (см. renderOnboardingOverlay,
// infoOverlay: 'short') — иначе она всплывала заново при каждой перезагрузке
// страницы, даже если её только что закрыли (QA-отчёт от 12.09).
const ONBOARDING_DISMISSED_KEY = 'muzhik_onboarding_dismissed';
function wasOnboardingDismissed() {
  try {
    return localStorage.getItem(ONBOARDING_DISMISSED_KEY) === '1';
  } catch (err) {
    return false; // приватный режим браузера и т.п. — просто показываем карточку как раньше
  }
}
function markOnboardingDismissed() {
  try {
    localStorage.setItem(ONBOARDING_DISMISSED_KEY, '1');
  } catch (err) { /* не критично — просто не запомнится между визитами */ }
}

function go(screen, extra = {}) {
  state.screen = screen;
  Object.assign(state, extra);
  if (screen === 'profile') {
    // Свежий заход на экран профиля всегда начинается со свёрнутого
    // (подтверждённого) вида адреса, если он уже есть — а не с середины
    // редактирования, оставшейся с прошлого визита.
    profileAddressEditing = false;
  }
  if (screen === 'notifications') {
    // Заход на список уведомлений сразу гасит бейдж в шапке — см.
    // markNotificationsSeen/getUnreadNotificationsCount у renderTopbar.
    markNotificationsSeen(state.currentUserId);
  }
  render();
  if (screen === 'orders') {
    // Не блокируем сам переход на экран — список кандидатов дорисуется
    // повторным render() внутри refreshAvailableOrders(), когда придёт ответ.
    refreshAvailableOrders();
    startAvailableOrdersPolling();
  } else {
    stopAvailableOrdersPolling();
  }
}

// ---------------------------------------------------------------------
// Вход по номеру телефона (без проверки — верификация по SMS появится
// позже; факт подтверждения будет отмечаться полем phone_verified).
// ---------------------------------------------------------------------

/**
 * Нормализует произвольный ввод телефона до 10 цифр локального номера.
 * Понимает: вставленный номер целиком (+7/8 и 11 цифр), дефисы/пробелы,
 * либо уже голые 10 цифр. Возвращает null, если цифр больше/меньше, чем
 * ожидается — тогда UI должен показать ошибку и заблокировать отправку.
 * @param {string} raw
 * @returns {string|null}
 */
function parsePhoneToLocal10(raw) {
  let d = String(raw || '').replace(/\D/g, '');
  if (d.length === 11 && (d[0] === '8' || d[0] === '7')) {
    d = d.slice(1);
  }
  if (d.length !== 10) return null;
  return d;
}

/** @param {string} local10 — ровно 10 цифр */
function formatPhoneRu(local10) {
  const p = local10;
  let out = '+7';
  if (p.length > 0) out += ' ' + p.slice(0, 3);
  if (p.length > 3) out += ' ' + p.slice(3, 6);
  if (p.length > 6) out += ' ' + p.slice(6, 8);
  if (p.length > 8) out += ' ' + p.slice(8, 10);
  return out;
}

/**
 * Красивый вид номера для экрана («+7 916 533 95 88») из того, что лежит
 * в базе — а там он хранится «голыми» цифрами (см. ensureUserByPhone).
 * На случай уже отформатированных старых записей просто возвращает
 * значение как есть, если разобрать до 10 цифр не удалось.
 * @param {string} phone
 */
function displayPhone(phone) {
  if (!phone) return '';
  const local10 = parsePhoneToLocal10(phone);
  return local10 ? formatPhoneRu(local10) : phone;
}

/**
 * Убирает ведущий признак кода страны («+7», «7» или «8» в самом начале строки),
 * чтобы сама «+7», уже стоящая в поле по умолчанию, не считалась введённой
 * пользователем цифрой. Остаток очищается от всех нецифровых символов.
 * @param {string} raw
 * @returns {string}
 */
function stripCountryPrefixDigits(raw) {
  let s = String(raw || '');
  if (s.startsWith('+7')) {
    s = s.slice(2);
  } else if (s.startsWith('7') || s.startsWith('8')) {
    s = s.slice(1);
  }
  return s.replace(/\D/g, '');
}

/**
 * Живое форматирование поля телефона по мере ввода/вставки.
 * @param {HTMLInputElement} input
 * @param {HTMLElement} errorEl
 * @param {() => void} onChange — вызывается после каждого пересчёта (обновить кнопку отправки и т.п.)
 */
function wirePhoneField(input, errorEl, onChange) {
  const recalc = () => {
    const raw = input.value;
    let d = stripCountryPrefixDigits(raw);
    if (d.length > 10 && (d[0] === '7' || d[0] === '8')) {
      d = d.slice(1);
    }
    if (d.length > 10) {
      input.dataset.valid = 'false';
      if (errorEl) {
        errorEl.textContent = 'Проверьте номер — похоже, в нём лишние цифры';
        errorEl.style.display = 'block';
      }
      onChange();
      return;
    }
    if (errorEl) errorEl.style.display = 'none';
    input.value = formatPhoneRu(d);
    input.dataset.valid = parsePhoneToLocal10(d) ? 'true' : 'false';
    onChange();
  };
  input.addEventListener('input', recalc);
  input.addEventListener('paste', () => setTimeout(recalc, 0));
  recalc();
}

/**
 * Находит пользователя по телефону (сначала в кэше, затем в Supabase),
 * а если такого ещё нет — создаёт нового и ЖДЁТ реальный id из базы
 * (важно: без этого id, полученный сразу после saveOrder, ещё был бы
 * временным local-... и заказ не сохранился бы — та же причина, по
 * которой раньше не проходила публикация заказа).
 * @param {string} phone — уже отформатированный «+7 XXX XXX XX XX»
 * @param {{location?: {lat:number,lng:number}, district?: string}} [extra]
 */
async function ensureUserByPhone(phone, extra = {}) {
  // Канонический формат ХРАНЕНИЯ телефона в базе — 11 цифр с кодом
  // страны, без «+» и пробелов («79165339588»), см. CANONICAL_PHONE_RE
  // рядом. В интерфейсе номер всё равно вводится/показывается красиво
  // («+7 916 533 95 88», см. formatPhoneRu) — это только про то, что
  // лежит в столбце users.phone, чтобы один и тот же человек не заводил
  // по случайности второй аккаунт из-за разного начертания номера.
  const local10 = stripCountryPrefixDigits(phone);
  const canonicalPhone = '7' + local10;
  let user = cache.users.find((u) => stripCountryPrefixDigits(u.phone || '') === local10);
  if (user) return user;

  if (isSupabaseConfigured()) {
    try {
      // На случай записей ещё в старом «человеческом» начертании (до
      // этого исправления телефон в базу писался как в поле ввода) —
      // ищем и по каноническому виду, и по нему. Если вдруг найдутся
      // записи в обоих (исторический дубль), отдаём предпочтение той, где
      // уже привязан Telegram, а при прочих равных — более старой.
      const humanPhone = formatPhoneRu(local10);
      const query = `or=(phone.eq.${encodeURIComponent(canonicalPhone)},phone.eq.${encodeURIComponent(humanPhone)})&order=telegram_id.nullslast,created_at.asc&limit=1&select=*`;
      const rows = await getRows('users', query);
      if (rows[0]) {
        const skillRows = await getRows('skills', `user_id=eq.${rows[0].id}`);
        const skillsByUser = {};
        skillRows.forEach((row) => {
          const skill = dbSkillToSkill(row);
          if (!skillsByUser[row.user_id]) skillsByUser[row.user_id] = [];
          skillsByUser[row.user_id].push(skill);
        });
        user = dbUserToUser(rows[0], skillsByUser);
        cache.users.push(user);
        return user;
      }
    } catch (err) {
      reportError('поиск пользователя по телефону', err);
    }
  }

  const draft = {
    id: `local-${Date.now()}`,
    telegramId: '',
    displayName: 'Гость',
    phone: canonicalPhone,
    phoneVerified: false,
    avatarUrl: '',
    // CENTER раньше маскировал «адреса ещё нет» под настоящую точку в
    // центре города — теперь честный сентинел {0,0} (см. hasValidLocation):
    // и в профиле, и на карте админки будет видно, что место не определено.
    location: hasValidLocation(extra.location) ? extra.location : { lat: 0, lng: 0 },
    district: extra.district || '',
    searchRadiusKm: 3,
    skills: [],
    availableAsWorker: false,
    rating: 0,
    ratingCount: 0,
    customerRating: 0,
    customerRatingCount: 0,
    blocked: false,
    createdAt: new Date().toISOString(),
  };
  cache.users.push(draft);

  if (!isSupabaseConfigured()) {
    local.saveUser(draft);
    return draft;
  }

  try {
    const row = await insertRow('users', userToDbUser(draft));
    const created = dbUserToUser(row, {});
    created.skills = [];
    const i = cache.users.findIndex((u) => u === draft);
    if (i >= 0) cache.users[i] = created;
    return created;
  } catch (err) {
    reportError('создание пользователя по телефону', err);
    return draft;
  }
}

// ---------------------------------------------------------------------
// Подтверждение номера звонком (Звонок.ком, тип кампании «Звонок на
// проверочный номер»). Человек сам звонит на показанный номер и сразу
// сбрасывает — Звонок.ком узнаёт его по CallerID. Работает через две
// Edge Function-прокси — zvonok-start (регистрирует ожидание звонка и
// возвращает номер для показа) и zvonok-check (сайт опрашивает её, пока
// не придёт подтверждение). Если секреты ZVONOK_* не настроены на
// сервере — обе функции отвечают { configured: false }, и вход проходит
// как раньше, без этого шага (см. README, раздел про Звонок.ком).
// ---------------------------------------------------------------------

/** Живёт вне state, как и другие черновые поля экранов — см. комментарий выше про composerExpandedField. */
let phoneVerifyState = null; // null | { userId, phone, numberToCall, since, status: 'waiting'|'confirmed'|'timeout', attemptsLeft }

async function startPhoneCallVerification(phoneE164) {
  if (!isSupabaseConfigured()) return { configured: false };
  const { url } = getConfig();
  try {
    const res = await fetch(`${url}/functions/v1/zvonok-start`, {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ phone: phoneE164 }),
    });
    if (!res.ok) throw new Error(`zvonok-start failed: ${res.status}`);
    return await res.json();
  } catch (err) {
    console.error('[zvonok] не удалось начать подтверждение звонком', err);
    return { configured: true, error: true };
  }
}

async function checkPhoneCallVerification(phoneE164, since) {
  if (!isSupabaseConfigured()) return { configured: false, confirmed: false };
  const { url } = getConfig();
  try {
    const res = await fetch(`${url}/functions/v1/zvonok-check`, {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ phone: phoneE164, since }),
    });
    if (!res.ok) throw new Error(`zvonok-check failed: ${res.status}`);
    return await res.json();
  } catch (err) {
    console.error('[zvonok] не удалось проверить результат звонка', err);
    return null;
  }
}

// ---------------------------------------------------------------------
// Обязательный пароль (см. README/памятку про уязвимость входа по одному
// лишь номеру телефона). Раньше finishPhoneGateLogin сразу же выдавал
// сессию (issueSessionToken) — теперь он лишь открывает экран пароля
// (renderPasswordStepOverlay), а сессия/токен появляются только после
// успешного запроса к Edge Function set-password (для аккаунта без
// пароля — «Придумайте пароль») или login-with-password (пароль уже
// есть — «Введите пароль»). Токен, который эти функции выдают, кладётся
// в тот же localStorage (SESSION_TOKEN_KEY), что и раньше — это и есть
// «запомнить это устройство», см. boot(): пока токен есть, пароль на
// этом устройстве заново не спрашивается.
// ---------------------------------------------------------------------

/** null | { userId, phone, mode: 'create'|'login', error: string, submitting: boolean, onComplete: (()=>void)|null } */
let passwordStepState = null;

/**
 * Открывает экран пароля вместо немедленного завершения входа. Общая
 * точка для всех мест, где раньше вход завершался сразу по телефону
 * (phone-gate, Telegram-код, гостевой чекаут в композере).
 * @param {{id:string, phone:string, hasPassword?: boolean}} user
 * @param {(() => void)|null} [onComplete] — что доделать сразу после
 * успешного пароля/входа (например, доотправить заявку — см. 'publish-draft').
 */
function enterPasswordStep(user, onComplete = null) {
  phoneVerifyState = null;
  passwordStepState = {
    userId: user.id,
    phone: user.phone,
    mode: user.hasPassword ? 'login' : 'create',
    error: '',
    submitting: false,
    onComplete: onComplete || null,
  };
  render();
}

/** Завершает вход независимо от того, было подтверждение звонком или нет — теперь ведёт на экран пароля, а не сразу внутрь. */
async function finishPhoneGateLogin(user) {
  enterPasswordStep(user);
}

/** Вызывается после успешного set-password/login-with-password. */
function completePasswordLogin(userId, token) {
  const onComplete = passwordStepState && passwordStepState.onComplete;
  passwordStepState = null;
  state.currentUserId = userId;
  saveSession(userId);
  saveSessionToken(token);
  const idx = cache.users.findIndex((u) => u.id === userId);
  if (idx >= 0) cache.users[idx] = { ...cache.users[idx], hasPassword: true };
  render();
  if (typeof onComplete === 'function') onComplete();
}

/** Закрывает экран пароля без входа — как «Ввести другой номер» у phone-verify. */
function cancelPasswordStep() {
  passwordStepState = null;
  render();
}

/**
 * Отправляет пароль на set-password (аккаунт без пароля) или
 * login-with-password (пароль уже есть) — см. Edge Functions.
 * @param {string} passwordValue
 * @param {string} [confirmValue] — только для mode==='create'
 */
async function submitPasswordStep(passwordValue, confirmValue) {
  if (!passwordStepState || passwordStepState.submitting) return;
  const { phone, mode } = passwordStepState;
  if (mode === 'create') {
    if (!passwordValue || passwordValue.length < 6) {
      passwordStepState.error = 'Пароль должен быть не короче 6 символов';
      return render();
    }
    if (passwordValue !== confirmValue) {
      passwordStepState.error = 'Пароли не совпадают';
      return render();
    }
  } else if (!passwordValue) {
    passwordStepState.error = 'Введите пароль';
    return render();
  }
  passwordStepState.submitting = true;
  passwordStepState.error = '';
  render();
  const endpoint = mode === 'create' ? 'set-password' : 'login-with-password';
  const body = mode === 'create' ? { phone, newPassword: passwordValue } : { phone, password: passwordValue };
  try {
    const { url } = getConfig();
    const res = await fetch(`${url}/functions/v1/${endpoint}`, {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data || !data.ok) {
      const messages = {
        password_too_short: 'Пароль должен быть не короче 6 символов',
        password_already_set: 'Для этого номера пароль уже задан — введите его, а не придумывайте новый',
        user_not_found: 'Не нашли аккаунт с этим номером — начните заново',
        invalid_credentials: 'Неверный номер или пароль',
        no_password_set: 'Для этого номера ещё не задан пароль — обратитесь в поддержку',
      };
      if (!passwordStepState) return;
      passwordStepState.submitting = false;
      passwordStepState.error = (data && messages[data.error]) || 'Не получилось — попробуйте ещё раз';
      // Локальная догадка «пароль уже есть?» устарела (например, его
      // задали с другого устройства) — переключаем ту же форму на вход,
      // а не оставляем тупик на экране «Придумайте пароль».
      if (data && data.error === 'password_already_set') passwordStepState.mode = 'login';
      return render();
    }
    completePasswordLogin(passwordStepState.userId, data.token);
  } catch (err) {
    if (!passwordStepState) return;
    passwordStepState.submitting = false;
    passwordStepState.error = 'Не получилось соединиться — попробуйте ещё раз';
    reportError('вход по паролю', err);
    render();
  }
}

// ---------------------------------------------------------------------
// Изменение имени в профиле — по клику на карандаш рядом с именем или
// на самой аватарке (см. renderProfile). Тот же паттерн всплывающего
// окна, что и renderPasswordStepOverlay выше — общий .map-picker-overlay
// (затемнение фона + карточка по центру), но не обязательный — клик по
// фону или «Отмена» просто закрывает без сохранения.
// ---------------------------------------------------------------------
let editNameState = null;

function openEditName() {
  const user = currentUser();
  if (!user) return;
  editNameState = { value: user.displayName || '', error: '' };
  render();
}

function cancelEditName() {
  editNameState = null;
  render();
}

function submitEditName(value) {
  if (!editNameState) return;
  const trimmed = (value || '').trim();
  if (!trimmed) {
    editNameState.error = 'Введите имя';
    render();
    document.getElementById('edit-name-input')?.focus();
    return;
  }
  const user = currentUser();
  if (user && user.displayName !== trimmed) {
    saveUser({ ...user, displayName: trimmed });
  }
  editNameState = null;
  render();
}

/**
 * Запускает подтверждение номера звонком для уже найденного/созданного
 * пользователя. Если функция на сервере не настроена, номер уже
 * подтверждён раньше, или сам запрос не удался — просто пускает дальше,
 * как и раньше (см. комментарий к блоку выше — ничего не блокируем).
 */
async function beginPhoneCallVerification(user) {
  if (user.phoneVerified) {
    await finishPhoneGateLogin(user);
    return;
  }
  const phoneE164 = '+7' + stripCountryPrefixDigits(user.phone);
  const start = await startPhoneCallVerification(phoneE164);
  if (!start || !start.configured || start.error || !start.numberToCall) {
    await finishPhoneGateLogin(user);
    return;
  }
  phoneVerifyState = {
    userId: user.id,
    phone: phoneE164,
    numberToCall: start.numberToCall,
    since: start.createdAt || new Date().toISOString(),
    status: 'waiting',
    attemptsLeft: 40, // ~40 попыток по 3 сек — около двух минут ожидания
  };
  render();
  pollPhoneCallVerification(phoneVerifyState);
}

async function pollPhoneCallVerification(forState) {
  if (phoneVerifyState !== forState || forState.status !== 'waiting') return;
  if (forState.attemptsLeft <= 0) {
    forState.status = 'timeout';
    render();
    return;
  }
  forState.attemptsLeft -= 1;
  const result = await checkPhoneCallVerification(forState.phone, forState.since);
  if (phoneVerifyState !== forState || forState.status !== 'waiting') return; // отменили/сменили номер, пока ждали ответ

  if (result && result.configured === false) {
    // Подтверждение выключили на сервере, пока человек ждал, — не блокируем.
    const user = cache.users.find((u) => u.id === forState.userId) || { id: forState.userId };
    await finishPhoneGateLogin(user);
    return;
  }
  if (result && result.confirmed) {
    forState.status = 'confirmed';
    render();
    try {
      await updateRow('users', forState.userId, { phone_verified: true });
      const idx = cache.users.findIndex((u) => u.id === forState.userId);
      if (idx >= 0) cache.users[idx] = { ...cache.users[idx], phoneVerified: true };
    } catch (err) {
      reportError('сохранение подтверждения телефона', err);
    }
    const user = cache.users.find((u) => u.id === forState.userId) || { id: forState.userId };
    await finishPhoneGateLogin(user);
    return;
  }
  setTimeout(() => pollPhoneCallVerification(forState), 3000);
}

/** Отменяет ожидание звонка и возвращает к полю ввода телефона. */
function cancelPhoneCallVerification() {
  phoneVerifyState = null;
  render();
}

/** «Продолжить без подтверждения» после таймаута — телефон остаётся непроверенным. */

// ---------------------------------------------------------------------
// Привязка Telegram для уведомлений (не авторизация — она уже произошла
// по номеру телефона выше). Путь человека: нажимает "Открыть бота и
// получить код" → открывается бот в Telegram → бот сам генерирует
// 4-значный код и пишет его в чат ("введите этот код на сайте «Мужик
// рядом» для авторизации через Telegram") → человек вводит код на сайте
// и жмёт "Подтвердить".
// Бот должен сам вставлять строку в public.login_codes (code, telegram_id)
// при выдаче кода — сайт эту строку только читает по code, введённому
// человеком, ничего не создаёт заранее.
// Если telegram_id уже привязан к другому пользователю, UPDATE упадёт на
// unique-ограничении users_telegram_id_key — reportError покажет ошибку.
//
// Лимиты на повторный запрос кода (не раньше чем через 1 мин, третий и
// далее — не раньше чем через 2 мин; максимум 5 запросов в час и 10 в
// сутки) — ЭТО ТОЛЬКО клиентская подсказка в интерфейсе (localStorage,
// per-device), не настоящая защита: обойти легко, очистив localStorage
// или открыв бота напрямую в Telegram в обход сайта. Настоящий лимит
// должен стоять в самом боте (BotHelp) — сайт технически не может
// запретить боту отправить сообщение.
// ---------------------------------------------------------------------

/**
 * @param {string} code
 * @returns {Promise<{telegram_id: string|null}|null>}
 */
async function getLoginCodeStatus(code) {
  if (!isSupabaseConfigured()) return null;
  // expires_at=gt.now — просроченный код (бот выдаёт их на 10 минут) не
  // должен больше проходить как действительный.
  const rows = await getRows(
    'login_codes',
    `code=eq.${encodeURIComponent(code)}&expires_at=gt.${encodeURIComponent(new Date().toISOString())}&select=telegram_id`
  );
  return rows[0] || null;
}

const TELEGRAM_LINK_ATTEMPTS_KEY = 'muzhik_tg_link_attempts_v1';

function getTelegramLinkAttempts() {
  try {
    const raw = localStorage.getItem(TELEGRAM_LINK_ATTEMPTS_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    const now = Date.now();
    return Array.isArray(arr) ? arr.filter((t) => typeof t === 'number' && now - t < 24 * 60 * 60 * 1000) : [];
  } catch {
    return [];
  }
}

function recordTelegramLinkAttempt() {
  const attempts = getTelegramLinkAttempts();
  attempts.push(Date.now());
  try {
    localStorage.setItem(TELEGRAM_LINK_ATTEMPTS_KEY, JSON.stringify(attempts));
  } catch {
    // localStorage недоступен (приватный режим и т.п.) — просто не считаем лимит
  }
}

/**
 * @returns {{canRequest: boolean, waitSeconds: number, overHour: boolean, overDay: boolean}}
 */
function getTelegramLinkLimitState() {
  const now = Date.now();
  const attempts = getTelegramLinkAttempts();
  const hourCount = attempts.filter((t) => now - t < 60 * 60 * 1000).length;
  const dayCount = attempts.length;
  const last = attempts[attempts.length - 1];
  // 1-й запрос — сразу; 2-й — не раньше чем через 1 мин после 1-го;
  // 3-й и далее — не раньше чем через 2 мин после предыдущего.
  const cooldownMs = attempts.length === 0 ? 0 : attempts.length === 1 ? 60_000 : 120_000;
  const waitMs = last ? Math.max(0, last + cooldownMs - now) : 0;
  const overHour = hourCount >= 5;
  const overDay = dayCount >= 10;
  return {
    canRequest: waitMs <= 0 && !overHour && !overDay,
    waitSeconds: Math.ceil(waitMs / 1000),
    overHour,
    overDay,
    // Поле ввода кода показываем только после того, как человек хотя бы раз
    // нажал «Открыть бота» — до этого вводить туда просто нечего (бот ещё
    // ничего не присылал), и поле не должно быть открыто для произвольного
    // подбора кода.
    hasRequested: attempts.length > 0,
  };
}

/**
 * @param {string} rawCode — код, который человек ввёл на сайте (получил от бота)
 *
 * Если человек ещё не авторизован (экран «нужен номер телефона»), код от
 * Telegram-бота используется как альтернативный вход: аккаунт создаётся/
 * находится по номеру из поля #gate-phone, сразу привязывается к нему
 * telegram_id, и человек считается вошедшим — отдельно подтверждать телефон
 * по SMS в этом случае не нужно.
 */
async function submitTelegramLinkCode(rawCode) {
  const code = String(rawCode || '').trim();
  if (!/^\d{3,8}$/.test(code)) {
    showToast('Введите код из чата с ботом (только цифры)');
    return;
  }

  let user = currentUser();
  const wasLoggedIn = !!user;
  let gatePhone = null;
  if (!wasLoggedIn) {
    gatePhone = document.getElementById('gate-phone');
    if (!gatePhone || gatePhone.dataset.valid !== 'true') {
      showToast('Сначала укажите корректный номер телефона');
      return;
    }
  }

  let row;
  try {
    row = await getLoginCodeStatus(code);
  } catch (err) {
    reportError('проверка кода Telegram', err);
    return;
  }
  if (!row || !row.telegram_id) {
    // Одна и та же ошибка и для опечатки, и для просроченного кода (бот
    // выдаёт код на 10 минут) — отличить их на сайте нечем (см.
    // getLoginCodeStatus: истёкшая строка просто не попадает в выборку),
    // поэтому подсказываем оба варианта явно, а не только «неверный код».
    showToast('Код не найден — проверьте, что ввели его без ошибок, либо запросите новый (старый мог истечь через 10 минут)');
    return;
  }

  try {
    if (!wasLoggedIn) {
      user = await ensureUserByPhone(gatePhone.value, {});
    }
    const updated = await updateRow('users', user.id, { telegram_id: row.telegram_id });
    const idx = cache.users.findIndex((u) => u.id === user.id);
    if (idx >= 0) cache.users[idx] = { ...cache.users[idx], telegramId: updated.telegram_id || row.telegram_id };
    if (!wasLoggedIn) {
      // Как и у phone-gate — вход по Telegram-коду тоже теперь ведёт на
      // обязательный экран пароля, а не сразу выдаёт сессию.
      enterPasswordStep(cache.users[idx] || user, () => {
        showToast('Telegram подключён — будем присылать уведомления');
      });
      return;
    }
    showToast('Telegram подключён — будем присылать уведомления');
    render();
  } catch (err) {
    reportError(wasLoggedIn ? 'привязка Telegram к аккаунту' : 'вход через Telegram', err);
  }
}

/**
 * Карточка привязки Telegram: статус "подключён" либо форма ввода кода,
 * который прислал бот.
 * @param {string} purposeText — например, "получать уведомления о заказе"
 */
function renderTelegramLinkCard(purposeText) {
  const user = currentUser();
  if (!user) return '';
  if (user.telegramId) {
    return `<p class="order-meta"><span>✓ Telegram подключён — уведомления приходят туда</span></p>`;
  }
  const limit = getTelegramLinkLimitState();
  let hint = '';
  if (limit.overDay) {
    hint = 'Дневной лимит запросов кода исчерпан — попробуйте завтра.';
  } else if (limit.overHour) {
    hint = 'Часовой лимит запросов кода исчерпан — попробуйте позже.';
  } else if (limit.waitSeconds > 0) {
    hint = `Повторный код можно запросить через ${limit.waitSeconds} сек.`;
  }
  return `
    <div class="field-card">
      <p class="order-meta">Нажмите кнопку — откроется бот и пришлёт код в чат. Введите этот код здесь, чтобы подключить Telegram и ${escapeHtml(purposeText)}.</p>
      <button class="secondary-button" type="button" style="box-sizing:border-box;" data-action="request-telegram-code" ${limit.canRequest ? '' : 'disabled'}>Открыть бота @${escapeHtml(TELEGRAM_BOT_USERNAME)}</button>
      ${hint ? `<p class="order-meta" style="margin-top:6px;">${escapeHtml(hint)}</p>` : ''}
      ${
        limit.hasRequested
          ? `
      <label style="margin-top:10px;">Код из бота</label>
      <input type="text" id="telegram-link-code" inputmode="numeric" placeholder="0000" />
      <button class="primary-button" data-action="submit-telegram-code">Подтвердить</button>`
          : ''
      }
    </div>
  `;
}

// Composer / диалог создания заказа
// ---------------------------------------------------------------------

/**
 * Заявка в одно сообщение: описание + адрес (+телефон, если не был
 * авторизован) уже собраны на главном экране — сразу показываем
 * короткую карточку проверки (категория/цена/фото) без пошагового
 * мастера. Категория и время — по тексту сообщения; всё остальное —
 * разумные значения по умолчанию, которые при желании можно будет
 * уточнить в диалоге с мастером.
 *
 * Категория: если настоящий ИИ-ассистент подключён (ASSISTANT_FUNCTION_URL)
 * и уже успел классифицировать именно этот текст (см.
 * lastAssistantInterpretation в runComposerAssistantCheck) — используем его
 * ответ, он точнее офлайн-заглушки. Если ассистент не настроен, не успел
 * ответить или классифицировал другой (уже изменённый) текст — как и
 * раньше, падаем обратно на офлайн-классификацию по ключевым словам, чтобы
 * заявка в любом случае получила категорию.
 */
function startQuickDraft(rawMessage, attachments, address, desiredDate, desiredTimeFrom, desiredTimeTo, exactLocation) {
  const interpretation = interpretCustomerMessage(rawMessage);
  const trimmedMessage = rawMessage.trim();
  const freshAssistantMatch =
    isAssistantConfigured() &&
    lastAssistantInterpretation &&
    lastAssistantInterpretation.text === trimmedMessage &&
    lastAssistantInterpretation.categoryId
      ? lastAssistantInterpretation
      : null;
  const user = currentUser();
  state.draft = {
    step: 'quickReview',
    rawMessage,
    attachments,
    // 'other' — если ни ассистент, ни офлайн-классификатор не определили
    // категорию: категория обязательна в БД (см. комментарий у CATEGORIES),
    // а «угадывать» неверную категорию хуже, чем явное «Другое».
    categoryId: (freshAssistantMatch ? freshAssistantMatch.categoryId : interpretation.categoryId) || 'other',
    // riskWarning — по-прежнему офлайн-проверка на опасные ключевые слова:
    // это не зависит от того, ответил ли ассистент, и работает даже без него.
    riskWarning: interpretation.riskWarning,
    quantity: 1,
    accessDifficulty: 'easy',
    needsMaterials: false,
    district: address || user?.district || '',
    houseNumberPublic: '',
    fullAddress: address || '',
    useMyLocation: true,
    // Точный адрес из композера (геолокация + Яндекс.Геокодер). Раньше при
    // неудаче тут тихо подставлялись user.location или CENTER — заказ
    // выглядел сохранённым, но точка на карте могла быть где угодно, вплоть
    // до чужого района. Теперь при неудаче — явный «пустой» сентинел
    // (hasValidLocation), а не угаданная координата: предупреждение
    // покажется в отзыве заявки и в карточке заказа, а метка на карте в
    // админке для такого заказа просто не появится (см. hasValidLocation).
    exactLocation: hasValidLocation(exactLocation) ? exactLocation : { lat: 0, lng: 0 },
    // Храним «сырую» ISO-дату (yyyy-mm-dd), а не отформатированную метку —
    // именно она пойдёт в реальную колонку orders.desired_date (тип date).
    // Человекочитаемое форматирование делается только на отображении.
    desiredDate: desiredDate || '',
    timeWindow: desiredTimeFrom && desiredTimeTo ? `${desiredTimeFrom}–${desiredTimeTo}` : '',
    urgency: 'normal',
    budget: '',
    paymentMethod: 'on_site',
    negotiationOffer: '',
  };
  go('compose');
}

function computeEstimateForDraft() {
  const services = getServices();
  const item = matchCatalogItem(services, {
    categoryId: state.draft.categoryId,
    keywords: state.draft.rawMessage.split(/\s+/),
  });
  if (!item) {
    state.draft.isPrecedent = true;
    state.draft.matchedItem = null;
    state.draft.estimate = { min: 0, max: 0, factors: [] };
    return;
  }
  state.draft.isPrecedent = false;
  state.draft.matchedItem = item;
  state.draft.estimate = calculateEstimate(item, {
    quantity: state.draft.quantity,
    urgency: state.draft.urgency,
    hardAccess: state.draft.accessDifficulty === 'hard',
    needsMaterials: state.draft.needsMaterials,
  });
}

async function publishDraft() {
  const d = state.draft;
  const budgetWarning = d.isPrecedent
    ? null
    : compareBudgetToEstimate(d.budget ? Number(d.budget) : null, d.estimate).warning;

  const orderId = `o-${Date.now()}`;
  let order = {
    id: orderId,
    customerId: state.currentUserId,
    assignedWorkerId: null,
    title: d.rawMessage.slice(0, 60),
    categoryId: d.categoryId,
    description: d.rawMessage,
    desiredOutcome: '',
    scope: {
      quantity: d.quantity,
      demolitionNeeded: false,
      accessDifficulty: d.accessDifficulty,
    },
    attachments: d.attachments,
    hasVoiceTranscript: false,
    voiceTranscript: '',
    exactLocation: d.exactLocation,
    district: d.district,
    houseNumberPublic: d.houseNumberPublic || '',
    fullAddress: d.fullAddress || '',
    desiredDate: d.desiredDate,
    timeWindow: d.timeWindow,
    urgency: d.urgency,
    customerBudget: d.budget ? Number(d.budget) : null,
    estimate: d.isPrecedent ? { min: 0, max: 0, factors: [] } : d.estimate,
    payment: initiatePayment(d.paymentMethod, d.isPrecedent ? Number(d.negotiationOffer || 0) : d.estimate.min),
    status: 'draft',
    timeline: [{ status: 'draft', at: new Date().toISOString() }],
    warnings: [
      ...(d.riskWarning ? [d.riskWarning] : []),
      ...(budgetWarning ? [budgetWarning] : []),
      ...(d.isPrecedent ? ['Точная цена не найдена в каталоге — предложите свою цену.'] : []),
    ],
    isPrecedent: Boolean(d.isPrecedent),
    negotiation: {
      customerOffer: d.isPrecedent ? Number(d.negotiationOffer || 0) : null,
      workerOffer: null,
    },
    createdAt: new Date().toISOString(),
  };

  // Заказ останавливается на «На проверке» (collecting_details) и НЕ
  // переводится дальше здесь. Путь заказа теперь: На проверке (модерация
  // администратором, см. admin.html approveOrder) → Ожидает оплаты
  // (estimate_ready, администратор выставил финальную цену) → заказчик
  // жмёт «Оплатить»/«Отказаться» на экране заказа (см. payOrder/
  // declineOrder ниже) → Оплачено (paid) → Ищем мастера (searching), и
  // только тогда подбор/уведомление мастеров рядом происходит на сервере
  // (см. supabase/functions/notify-nearby-workers). Здесь, на публикации,
  // кандидатов не ищем и не уведомляем — ни модерация, ни оплата ещё не
  // пройдены, а лишнее уведомление означало бы ложное срабатывание.
  order = transition(order, 'collecting_details');

  // Структурированное ТЗ для исполнителя — генерируется сразу при создании
  // заказа (а не по запросу позже), чтобы мастер сразу видел разбор задачи,
  // а не только сырой текст клиента. Необязательно: при сбое ассистента
  // order.formattedBrief остаётся null, и сайт ведёт себя как раньше.
  order.formattedBrief = await requestFormattedBrief(order, d);

  const saved = await saveOrder(order);

  // saveOrder() вернёт null, если вставка в БД реально не удалась (см. её
  // комментарий) — раньше в этом случае код всё равно шёл дальше с локальным
  // объектом заказа, показывал «Заявка отправлена» и открывал карточку
  // заказа, которого на сервере не существовало (QA-отчёт от 12.09, BUG 05:
  // после обновления страницы заказ пропадал). Теперь при провале остаёмся
  // на экране проверки — черновик не теряется, кнопка «Отправить» снова
  // доступна для повторной попытки.
  if (!saved) {
    showToast('Не получилось отправить заявку — попробуйте ещё раз через минуту.');
    render();
    return;
  }
  order = saved;

  pushNotification(
    createNotification(order.customerId, 'customer', order.id, 'order_published')
  );

  // Сначала переключаем экран (иначе showToast() вызовет render() для ещё
  // активного экрана 'compose' с уже обнулённым state.draft — исключение).
  state.draft = null;
  go('orderDetail', { openOrderId: order.id });
  showToast('Заявка отправлена и проверяется — обычно это быстро. Мастера увидят её сразу после одобрения.');
}

/**
 * В режиме Supabase приём заказа идёт ЧЕРЕЗ Edge Function accept-order
 * (сервисный ключ, атомарное условное обновление status='searching' →
 * 'assigned') — а не прямым PATCH из браузера, как раньше. Так исключается
 * гонка (двое мастеров жмут «Принять» одновременно — выигрывает только
 * первый, кто реально попал в условие в базе) и подделка «я мастер X»
 * без токена сессии этого X (см. issueSessionToken). В демо-режиме без
 * Supabase поведение прежнее — прямая работа с локальным кэшем.
 */
async function acceptOrder(orderId) {
  const order = getOrders().find((o) => o.id === orderId);
  if (!order) return;

  if (!isSupabaseConfigured()) {
    let localOrder = { ...order, assignedWorkerId: state.currentUserId };
    localOrder = transition(localOrder, 'assigned');
    saveOrder(localOrder);
    pushNotification(
      createNotification(localOrder.customerId, 'customer', localOrder.id, 'worker_found', {
        workerName: currentUser()?.displayName || 'Мастер',
        timeWindow: localOrder.timeWindow,
      })
    );
    pushNotification(
      createNotification(state.currentUserId, 'worker', localOrder.id, 'order_assigned_to_you', {
        orderTitle: localOrder.title,
      })
    );
    showToast('Заказ принят, вы назначены исполнителем');
    return render();
  }

  const token = loadSessionToken();
  if (!token) {
    showToast('Не получилось подтвердить вход — зайдите заново по номеру телефона');
    return;
  }

  let data;
  try {
    const { url } = getConfig();
    const res = await fetch(`${url}/functions/v1/accept-order`, {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ orderId, workerId: state.currentUserId, sessionToken: token }),
    });
    data = await res.json().catch(() => ({}));
    if (!res.ok || !data || !data.ok) {
      const messages = {
        already_taken: 'Заказ уже взял другой мастер',
        too_far: 'Этот заказ уже вне вашего радиуса',
        not_eligible: 'Этот заказ вам больше не подходит',
        unauthorized: 'Сессия истекла — зайдите заново',
      };
      showToast(messages[data && data.error] || 'Не получилось принять заказ — попробуйте ещё раз');
      cache.availableOrders = cache.availableOrders.filter((o) => o.id !== orderId);
      refreshAvailableOrders();
      return render();
    }
  } catch (err) {
    reportError('приём заказа', err);
    return;
  }

  const updated = dbOrderToOrder(data.order);
  const idx = cache.orders.findIndex((o) => o.id === updated.id);
  if (idx >= 0) cache.orders[idx] = updated;
  else cache.orders.push(updated);
  cache.availableOrders = cache.availableOrders.filter((o) => o.id !== updated.id);

  pushNotification(
    createNotification(updated.customerId, 'customer', updated.id, 'worker_found', {
      workerName: currentUser()?.displayName || 'Мастер',
      timeWindow: updated.timeWindow,
    })
  );
  pushNotification(
    createNotification(state.currentUserId, 'worker', updated.id, 'order_assigned_to_you', {
      orderTitle: updated.title,
    })
  );
  showToast('Заказ принят, вы назначены исполнителем');
  render();
}

/**
 * Обновляет cache.availableOrders через Edge Function available-orders —
 * список заказов, подходящих текущему мастеру рядом, теперь считает и
 * фильтрует сервер (сервисным ключом), а не браузер по уже скачанному
 * cache.orders. Вызывается при входе на экран «Заказы» и после
 * приёма/публикации заказа. Тихо ничего не делает вне режима Supabase
 * или если пользователь ещё не мастер.
 *
 * Токен сессии (см. issueSessionToken) на боте выдаётся в фоне и не
 * дожидается своего завершения (boot() его не await-ит) — если мастер
 * успевает открыть «Заказы» раньше, чем токен долетел до localStorage,
 * раньше эта функция тихо выходила с пустым списком и НИКОГДА не
 * пересматривала это позже: список оставался пустым до следующего явного
 * захода на экран, хотя все условия (радиус, специализации, статус
 * заказов) были в порядке — баг, из-за которого мастер с полностью
 * корректно настроенным профилем не видел ни одного заказа. Ниже — та же
 * подстраховка на случай, если токен в localStorage разошёлся с тем, что
 * сервер считает актуальным (см. комментарий про 401 внутри функции).
 *
 * @param {boolean} [isRetry] — внутренний флаг, чтобы не зациклиться, если
 * даже свежевыданный токен почему-то не подходит.
 */
// ---------------------------------------------------------------------
// Автообновление списка «Подходит вам рядом». Раньше refreshAvailableOrders()
// вызывалась только один раз — при заходе на экран «Заказы» — поэтому если
// мастер оставался на этом экране (или сворачивал вкладку/браузер и
// возвращался обратно), новые заказы, появившиеся тем временем у других
// пользователей, не появлялись без повторного ухода с экрана и возврата на
// него. Настоящего realtime-пуша с сервера нет (Supabase Realtime не
// подключен) — вместо этого лёгкий поллинг той же Edge Function, пока
// активен экран «Заказы», плюс досрочный разовый refresh, когда вкладка
// снова становится видимой (см. visibilitychange ниже, в самом низу файла).
// ---------------------------------------------------------------------
const AVAILABLE_ORDERS_POLL_MS = 20000;
let availableOrdersPollTimer = null;

function startAvailableOrdersPolling() {
  if (availableOrdersPollTimer) return;
  availableOrdersPollTimer = setInterval(() => {
    if (state.screen === 'orders' && !document.hidden) refreshAvailableOrders();
  }, AVAILABLE_ORDERS_POLL_MS);
}

function stopAvailableOrdersPolling() {
  if (!availableOrdersPollTimer) return;
  clearInterval(availableOrdersPollTimer);
  availableOrdersPollTimer = null;
}

async function refreshAvailableOrders(isRetry) {
  const user = currentUser();
  if (!isSupabaseConfigured() || !user || !user.availableAsWorker || !user.skills.length) {
    cache.availableOrders = [];
    cache.availableOrdersError = false;
    cache.availableOrdersLoading = false;
    return;
  }
  if (!isRetry) {
    cache.availableOrdersLoading = true;
    if (state.screen === 'orders') render();
  }
  let token = loadSessionToken();
  if (!token) {
    token = await issueSessionToken(user.id);
  }
  if (!token) {
    // Пустой список тут не значит «заказов рядом нет» — значит не удалось
    // даже получить токен сессии, поэтому не трогаем cache.availableOrders
    // (пусть останется прошлый успешный результат) и явно помечаем ошибку,
    // см. комментарий у объявления availableOrdersError.
    cache.availableOrdersError = true;
    cache.availableOrdersLoading = false;
    if (state.screen === 'orders') render();
    return;
  }
  try {
    const { url } = getConfig();
    const res = await fetch(`${url}/functions/v1/available-orders`, {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ workerId: user.id, sessionToken: token }),
    });
    // 401 здесь означает, что сохранённый токен разошёлся с тем, что
    // сейчас в user_sessions (например, вход был на другом устройстве и
    // выдал новый токен) — старый токен в localStorage тихо переживал
    // сам себя. Выпускаем новый и пробуем один раз ещё, вместо того чтобы
    // просто молча остаться с пустым списком.
    if (res.status === 401 && !isRetry) {
      const freshToken = await issueSessionToken(user.id);
      if (freshToken) return refreshAvailableOrders(true);
    }
    if (!res.ok) throw new Error(`available-orders failed: ${res.status}`);
    const data = await res.json();
    cache.availableOrders = (data.orders || []).map((o) => ({
      id: o.id,
      title: o.title,
      categoryId: o.categoryId,
      description: o.description || '',
      desiredOutcome: o.desiredOutcome || '',
      scope: o.scope || {},
      hasVoiceTranscript: Boolean(o.hasVoiceTranscript),
      exactLocation: null,
      district: o.district || '',
      houseNumberPublic: o.houseNumberPublic || '',
      desiredDate: o.desiredDate || '',
      timeWindow: o.timeWindow || '',
      urgency: o.urgency || 'normal',
      estimate: o.estimate || { min: 0, max: 0, factors: [] },
      status: o.status,
      warnings: o.warnings || [],
      isPrecedent: Boolean(o.isPrecedent),
      createdAt: o.createdAt,
      distanceKm: o.distanceKm,
    }));
    cache.availableOrdersError = false;
  } catch (err) {
    console.error('[available-orders] не удалось обновить список', err);
    // Раньше на этом и заканчивалось — cache.availableOrders оставался
    // пустым (или прошлым значением), а «Подходит вам рядом» показывал
    // ТОЧНО ТУ ЖЕ пустую заглушку, что и при честном «заказов рядом нет».
    // Из интерфейса нельзя было отличить сбой сети/сервера от настоящего
    // нуля — человек решал, что заказов действительно нет, и жаловался,
    // что «заказы рядом есть, а он их не видит» (см. историю переписки).
    // Явный флаг ошибки ниже подменяет текст на «не удалось загрузить» и
    // показывает кнопку «Обновить» вместо молчаливой заглушки.
    cache.availableOrdersError = true;
  }
  cache.availableOrdersLoading = false;
  if (state.screen === 'orders') render();
}

function advanceWorkerStatus(orderId, nextStatus) {
  let order = getOrders().find((o) => o.id === orderId);
  order = transition(order, nextStatus);
  saveOrder(order);
  const eventMap = { en_route: 'worker_en_route', in_progress: 'work_started', completed: 'work_completed' };
  if (eventMap[nextStatus]) {
    pushNotification(createNotification(order.customerId, 'customer', order.id, eventMap[nextStatus]));
  }
  render();
}

// Оплата — имитация (см. paymentAdapter вверху файла): реального
// эквайринга нет, ввода карты нет, только «Оплатить»/«Отказаться».
// Доступна заказчику, когда администратор уже одобрил заказ и выставил
// цену (status === 'estimate_ready', см. admin.html approveOrder).
// «Оплатить» сразу проводит обе следующие ступени — paid и searching —
// одним saveOrder (как раньше делал publishDraft для нескольких статусов
// подряд): «оплачено» остаётся видно шагом в истории заказа, а поиск
// мастеров стартует тем же кликом, без дополнительного ожидания.
async function payOrder(orderId) {
  let order = getOrders().find((o) => o.id === orderId);
  if (!order || order.status !== 'estimate_ready') return;
  const amount = typeof order.finalPrice === 'number' ? order.finalPrice : order.estimate.min;
  order.payment = confirmMockPayment(initiatePayment('online_stub', amount));
  order = transition(order, 'paid');
  order = transition(order, 'searching');
  order = await saveOrder(order);
  notifyNearbyWorkers(order.id); // best-effort, см. approveOrder в admin.html — та же функция
  showToast('Оплата прошла (демо) — мастера рядом уже видят заказ');
  render();
}

function declineOrder(orderId) {
  let order = getOrders().find((o) => o.id === orderId);
  if (!order || order.status !== 'estimate_ready') return;
  order = transition(order, 'cancelled');
  saveOrder(order);
  showToast('Заказ отменён');
  render();
}

// Best-effort вызов той же безопасной Edge Function, что и admin.html
// (см. её комментарий) — сбой здесь не должен мешать заказчику увидеть,
// что оплата прошла: заказ уже в searching и виден мастерам в приложении
// даже без пуша.
async function notifyNearbyWorkers(orderId) {
  if (!isSupabaseConfigured()) return;
  try {
    const { url } = getConfig();
    const res = await fetch(`${url}/functions/v1/notify-nearby-workers`, {
      method: 'POST',
      headers: headers(),
      body: JSON.stringify({ orderId }),
    });
    if (!res.ok) console.warn('[payOrder] notify-nearby-workers ответила ошибкой', res.status);
  } catch (err) {
    console.warn('[payOrder] не удалось уведомить мастеров рядом:', err);
  }
}

// Ответ на уточнение администратора (см. admin.html requestClarification) —
// возвращает заказ на модерацию (collecting_details), где админ уже видит
// вопрос и этот ответ рядом и может одобрить заказ с ценой.
function submitClarificationAnswer(orderId) {
  const textarea = document.getElementById(`clarification-answer-${orderId}`);
  const answer = textarea ? textarea.value.trim() : '';
  if (!answer) {
    showToast('Введите ответ перед отправкой');
    return;
  }
  let order = getOrders().find((o) => o.id === orderId);
  if (!order || order.status !== 'clarification_requested') return;
  order.clarification = { ...(order.clarification || {}), answer, answeredAt: new Date().toISOString() };
  order = transition(order, 'collecting_details');
  saveOrder(order);
  showToast('Ответ отправлен — заказ снова на проверке у администратора');
  render();
}

function reportIssue(orderId) {
  let order = getOrders().find((o) => o.id === orderId);
  order = transition(order, 'issue_reported');
  order.warnings = [...order.warnings, 'Зарегистрирована проблема, ожидает разбора.'];
  saveOrder(order);
  pushNotification(createNotification(order.customerId, 'customer', order.id, 'issue_reported'));
  showToast('Проблема зарегистрирована');
  render();
}

function confirmCompletion(orderId) {
  let order = getOrders().find((o) => o.id === orderId);
  order = transition(order, 'confirmed');
  if (order.payment.status === 'prepayment_pending') {
    order.payment = confirmMockPayment(order.payment);
  }
  saveOrder(order);
  if (order.assignedWorkerId) {
    pushNotification(
      createNotification(order.assignedWorkerId, 'worker', order.id, 'order_confirmed_by_customer')
    );
  }
  render();
}

function rateOrder(orderId, rating) {
  let order = getOrders().find((o) => o.id === orderId);
  order = transition(order, 'rated');
  // Сохраняем именно оценку по этому заказу (не только кумулятивный
  // рейтинг мастера) — нужно для дневной статистики (метрика «средний
  // рейтинг исполнителей за день»).
  order.workerRating = rating;
  saveOrder(order);
  if (order.assignedWorkerId) {
    const worker = getUsers().find((u) => u.id === order.assignedWorkerId);
    if (worker) {
      const newCount = worker.ratingCount + 1;
      const newRating = (worker.rating * worker.ratingCount + rating) / newCount;
      // Точечно (см. patchUserFields) — worker в кэше теперь может быть
      // урезанной users_public-версией чужого пользователя, и полный
      // saveUser() затёр бы его phone/telegram_id/координаты.
      patchUserFields(worker.id, { rating: Math.round(newRating * 10) / 10, ratingCount: newCount });
    }
  }
  showToast('Спасибо за оценку!');
  render();
}

function rateCustomer(orderId, rating) {
  let order = getOrders().find((o) => o.id === orderId);
  if (!order || order.customerRating) return;
  // Оценка заказчика мастером не является частью машины состояний заказа
  // (order.status ей не затрагивается) — это отдельная, необязательная
  // оценка, которая нужна для дневной статистики (метрика «средний
  // рейтинг заказчиков за день»).
  order = { ...order, customerRating: rating, customerRatedAt: new Date().toISOString() };
  saveOrder(order);
  const customer = getUsers().find((u) => u.id === order.customerId);
  if (customer) {
    const newCount = (customer.customerRatingCount || 0) + 1;
    const newRating = ((customer.customerRating || 0) * (customer.customerRatingCount || 0) + rating) / newCount;
    // Точечно (см. patchUserFields) — customer в кэше теперь может быть
    // урезанной users_public-версией чужого пользователя, и полный
    // saveUser() затёр бы его phone/telegram_id/координаты.
    patchUserFields(customer.id, { customerRating: Math.round(newRating * 10) / 10, customerRatingCount: newCount });
  }
  showToast('Спасибо за оценку заказчика!');
  render();
}

/**
 * Клик по звезде в развёрнутом рейтинге навыка (см. renderProfile → «Мои
 * навыки»): либо заводит навык впервые (если его ещё нет), либо меняет
 * уровень уже существующего — без отдельной кнопки «Добавить» и без
 * текстового описания (убрано по просьбе: только категория + рейтинг).
 */
function setUserSkillLevel(categoryId, level) {
  const user = currentUser();
  const existing = user.skills.find((s) => s.categoryId === categoryId);
  if (existing) {
    updateSkillNoteForUser(user.id, existing, encodeSkillNote(level, ''));
  } else {
    if (!user.availableAsWorker) {
      saveUser({ ...user, availableAsWorker: true });
    }
    addSkillForUser(user.id, {
      categoryId,
      note: encodeSkillNote(level, ''),
      verification: 'unverified',
      addedAt: new Date().toISOString(),
    });
  }
  state.openSkillPicker = null;
  showToast('Навык обновлён — теперь вам будут показываться подходящие заказы рядом');
  render();
}

/**
 * «Обновить геопозицию» в профиле мастера. Раньше эта кнопка обновляла
 * только координаты (user.location) и никак не трогала текстовое поле
 * «Район» — то есть на экране визуально ничего не менялось, и казалось,
 * что кнопка не работает. Теперь, как и в композере (см.
 * captureComposerAddressGeo), пробуем сразу получить читаемый адрес через
 * обратное геокодирование Яндекс.Карт и подставить его в поле района —
 * человек может тут же его подправить и сохранить, а не гадать, сработало
 * ли вообще нажатие.
 */
function captureGeolocation() {
  if (!navigator.geolocation) {
    showToast('Геолокация недоступна в этом браузере — укажите район вручную ниже');
    return;
  }
  const btn = document.getElementById('profile-geo-btn');
  if (btn) {
    btn.disabled = true;
    const label = btn.querySelector('span');
    if (label) label.textContent = 'Определяем…';
  }
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const { latitude, longitude } = pos.coords;
      const user = currentUser();
      let district = user?.district || '';
      try {
        const address = await reverseGeocodeYandex(latitude, longitude);
        if (address) district = address;
      } catch (err) {
        console.warn('[geo] обратное геокодирование не удалось', err);
      }
      saveUser({ ...user, location: { lat: latitude, lng: longitude }, district });
      profileDistrictValue = district;
      showToast('Геопозиция обновлена');
      render();
    },
    () => {
      showToast('Доступ к геолокации отклонён — можно указать район вручную ниже');
      if (btn) {
        btn.disabled = false;
        const label = btn.querySelector('span');
        if (label) label.textContent = 'Обновить геопозицию';
      }
    },
    { timeout: 8000, enableHighAccuracy: true }
  );
}

/**
 * Заказчик/мастер вписал район руками (без геолокации) и нажал «Сохранить».
 *
 * Раньше это сохраняло только текст района, а координаты (user.location)
 * не трогало — из-за этого метка мастера на карте в админке не двигалась,
 * даже если человек честно обновил адрес в профиле: карта строится по
 * координатам, а не по тексту. Теперь при сохранении пробуем ещё и
 * прямое геокодирование введённого адреса через Яндекс.Карты, чтобы
 * координаты обновились вместе с текстом — так же, как их обновляет
 * кнопка «Обновить геопозицию», только без запроса геолокации браузера.
 * Если геокодер не настроен (ключа нет вовсе) — текст района сохраняется,
 * координаты остаются прежними, как и раньше (бонус просто не активен).
 * Но если геокодер НАСТРОЕН, а введённый адрес распознать не вышло —
 * сохранение теперь блокируется целиком (а не молча падает в сентинел
 * {0,0}, как было раньше): нет отдельного ключа Геосаджеста с честным
 * автодополнением по базе реальных адресов, поэтому единственная
 * доступная проверка «адрес вообще существует» — это как раз попытка его
 * геокодировать. Человеку показывается тост с просьбой уточнить адрес
 * или выбрать вариант из подсказок (wireAddressSuggestions), а старые
 * координаты профиля не трогаются, пока адрес не переуточнят.
 */
async function saveProfileDistrict() {
  const input = document.getElementById('field-profile-district');
  if (!input) return;
  const district = input.value.trim();
  if (!district) return showToast('Введите район или адрес');

  const btn = document.getElementById('profile-district-save-btn');
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Сохраняем…';
  }

  const user = currentUser();
  let location = user.location;
  if (profileDistrictSelectedLocation) {
    // Адрес выбран из подсказки (wireAddressSuggestions) — координаты уже
    // точные, повторно геокодировать текст не нужно.
    location = profileDistrictSelectedLocation;
  } else if (isGeocoderConfigured()) {
    let coords = null;
    try {
      // allowCoarse: район/город — это по своей природе крупный масштаб,
      // Яндекс закономерно вернёт precision:"other" даже для правильного
      // совпадения (см. комментарий в geocodeAddressYandex) — обычный
      // строгий фильтр, рассчитанный на полный адрес с домом, здесь бы
      // отбрасывал верные результаты.
      coords = await geocodeAddressYandex(district, { allowCoarse: true });
    } catch (err) {
      console.warn('[geo] прямое геокодирование адреса не удалось', err);
    }
    if (!coords) {
      // Не блокируем сохранение — просто предупреждаем и сохраняем адрес
      // с нераспознанной точкой (0,0). Уточнить точку можно будет на карте
      // при следующей заявке (см. renderCompose → quickReview).
      showToast('Не удалось распознать адрес на карте — точку можно будет уточнить позже');
      location = { lat: 0, lng: 0 };
    } else {
      location = coords;
    }
  }
  // Если геокодер вовсе не настроен (нет ключа) — строгую проверку включить
  // не можем, координаты остаются прежними, как и раньше.

  saveUser({ ...user, district, location });
  profileDistrictValue = district;
  profileDistrictSelectedLocation = null;
  // Успешное сохранение сворачивает поле обратно в подтверждённый вид
  // (галочка + кнопка «Изменить») — см. renderProfile.
  profileAddressEditing = false;
  showToast('Район сохранён');
  render();
}

/**
 * Загрузка/замена аватарки в профиле — своя кнопка над именем (см.
 * renderProfile). Пока это просто фото для профиля, без проверки на
 * сервере и без блокировки чего-либо — приём заказов без фото не
 * ограничиваем, это будет отдельным шагом позже.
 * @param {File} file
 */
async function changeProfileAvatar(file) {
  const user = currentUser();
  if (!user) return;
  // Кнопки с текстом больше нет (см. renderProfile — теперь клик по самой
  // аватарке), поэтому индикация загрузки — прямо на ней: гасим и
  // блокируем клик, пока идёт загрузка.
  const avatarEl = document.querySelector('.profile-avatar');
  if (avatarEl) {
    avatarEl.style.opacity = '0.5';
    avatarEl.style.pointerEvents = 'none';
  }
  try {
    const compact = await compressImageFile(file, { maxBytes: 400_000, maxDim: 800 });
    const { url } = await uploadAvatar(compact, user.id);
    saveUser({ ...user, avatarUrl: url });
    render();
  } catch (err) {
    reportError('загрузка фото профиля', err);
    if (avatarEl) {
      avatarEl.style.opacity = '';
      avatarEl.style.pointerEvents = '';
    }
  }
}

// ---------------------------------------------------------------------
// Автоопределение адреса в композере через геолокацию браузера +
// обратное геокодирование Яндекс.Карт. Это бонус: если ключ геокодера не
// подключён (YANDEX_GEOCODER_API_KEY пуст) или запрос не удался, поле
// адреса всё равно можно заполнить руками — форма ничего не теряет.
// ---------------------------------------------------------------------

function isGeocoderConfigured() {
  const env = (typeof window !== 'undefined' && window.__ENV__) || {};
  return Boolean(env.YANDEX_GEOCODER_API_KEY);
}

/** Подсказки адреса (см. searchAddressSuggestionsYandex/wireAddressSuggestions
 * ниже) идут через Supabase-прокси /suggest, а не напрямую к Яндексу (у
 * Геосаджеста нет CORS для браузера, см. комментарий у ASSISTANT_FUNCTION_URL
 * в window.__ENV__) — поэтому доступность подсказок определяется тем же
 * ASSISTANT_FUNCTION_URL, что и у голоса/категорий, а не отдельным ключом. */
function isGeosuggestConfigured() {
  return isAssistantConfigured();
}

/** @returns {Promise<string|null>} человекочитаемый адрес либо null, если ключ не подключён */
async function reverseGeocodeYandex(lat, lng) {
  const env = (typeof window !== 'undefined' && window.__ENV__) || {};
  const apiKey = env.YANDEX_GEOCODER_API_KEY;
  if (!apiKey) return null;
  const url = `https://geocode-maps.yandex.ru/1.x/?apikey=${encodeURIComponent(apiKey)}&geocode=${lng},${lat}&format=json&kind=house&results=1`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Yandex geocoder ${res.status}`);
  const data = await res.json();
  const found = data?.response?.GeoObjectCollection?.featureMember?.[0]?.GeoObject;
  return found?.metaDataProperty?.GeocoderMetaData?.text || found?.name || null;
}

// Сервис не ограничен одной Москвой — заказчики могут быть и в регионах
// (в том числе уже на альфа-тесте), поэтому отсекать совпадения по
// расстоянию от Москвы нельзя. Геокодер Яндекса при этом НЕ отказывает на
// бессмысленный текст — он нечётко ищет ближайшее по буквам совпадение по
// всей базе (проверено вживую: «Тыртыртыр несуществующая улица дом 999»
// подобрал посёлок Тыр в Хабаровском крае с precision: "other" — это самый
// низкий уровень уверенности геокодера). Такие мусорные совпадения
// по-прежнему отсекаем по precision — это единственный надёжный,
// не привязанный к региону сигнал. Дальше сохранённая точка в любом случае
// уточняется человеком на интерактивной карте (см. renderCompose →
// quickReview), поэтому жёсткая блокировка на этом шаге не нужна.
/** Совпадения с такой precision — самый низкий уровень уверенности геокодера, фактически «не нашли, но что-то вернуть надо». */
const GEOCODER_JUNK_PRECISION = new Set(['other']);

/**
 * Прямое геокодирование: текстовый адрес → координаты. Используется, когда
 * человек вписывает адрес руками (без геолокации браузера) — например, в
 * профиле мастера (см. saveProfileDistrict), чтобы координаты для карты в
 * админке обновлялись вместе с текстом, а не только текст. Отбрасывает
 * явно мусорные совпадения (см. GEOCODER_JUNK_PRECISION выше); итоговая
 * точка в любом случае перепроверяется человеком на карте на шаге
 * подтверждения заявки.
 * Фильтр по precision («other» — мусор) по умолчанию включён — это нужно
 * для полного адреса заявки (там ожидается точность до дома/улицы, а
 * дальше человек всё равно поправит точку на карте — см. quickReview).
 * Но для РАЙОНА (см. saveProfileDistrict) это ломает даже нормальные
 * ответы: Яндекс отдаёт precision:"other" для ЛЮБОГО совпадения уровня
 * района/города — это не «не нашли», а корректный ответ для такого
 * масштаба запроса (у precision просто нет отдельной ступени «район»,
 * см. пример в комментарии у GEOCODER_JUNK_PRECISION). Профиль при этом
 * не проходит через карту-подтверждение, поэтому отбрасывать такой
 * результат нельзя — вызывающий код передаёт allowCoarse:true, чтобы
 * пропустить этот фильтр.
 * @param {string} addressText
 * @param {{allowCoarse?: boolean}} [opts]
 * @returns {Promise<{lat:number,lng:number}|null>} координаты либо null, если ключ не подключён, адрес не распознан или (без allowCoarse) совпадение похоже на мусорное
 */
async function geocodeAddressYandex(addressText, opts = {}) {
  const env = (typeof window !== 'undefined' && window.__ENV__) || {};
  const apiKey = env.YANDEX_GEOCODER_API_KEY;
  if (!apiKey) return null;
  const url = `https://geocode-maps.yandex.ru/1.x/?apikey=${encodeURIComponent(apiKey)}&geocode=${encodeURIComponent(addressText)}&format=json&results=1`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Yandex geocoder ${res.status}`);
  const data = await res.json();
  const found = data?.response?.GeoObjectCollection?.featureMember?.[0]?.GeoObject;
  const pos = found?.Point?.pos; // формат "долгота широта"
  if (!pos) return null;
  const [lng, lat] = pos.split(' ').map(Number);
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;

  const precision = found?.metaDataProperty?.GeocoderMetaData?.precision;
  if (!opts.allowCoarse && precision && GEOCODER_JUNK_PRECISION.has(precision)) return null;

  return { lat, lng };
}

/**
 * Подсказки реального адреса по мере ввода — честное автодополнение по базе
 * Яндекса (а не «подбор ближайшего похожего» через Геокодер, как было
 * раньше, до получения отдельного ключа Геосаджеста). Идёт не напрямую к
 * suggest-maps.yandex.ru, а через Supabase Edge Function /suggest — у
 * Геосаджеста нет CORS для запросов из браузера (см. комментарий у
 * ASSISTANT_FUNCTION_URL в window.__ENV__), напрямую с сайта это падает с
 * "Failed to fetch", хотя ключ рабочий. Сам ответ Геосаджеста координат не
 * содержит — только текст и uri объекта; чтобы получить координаты, uri
 * нужно передать отдельным запросом в Геокодер вместо текста (см.
 * resolveGeosuggestUri ниже, он ходит к Геокодеру напрямую — тот CORS
 * отдаёт) — это делается уже при выборе конкретной подсказки, а не на
 * каждый символ ввода.
 * @returns {Promise<Array<{text:string, uri:string}>>}
 */
async function searchAddressSuggestionsYandex(query) {
  const env = (typeof window !== 'undefined' && window.__ENV__) || {};
  if (!isAssistantConfigured()) return [];
  const res = await fetch(`${env.ASSISTANT_FUNCTION_URL}/suggest`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      // Supabase Edge Functions по умолчанию проверяют JWT — публичный
      // anon-ключ сайта (тот же паттерн, что у /transcribe и /interpret).
      Authorization: `Bearer ${env.SUPABASE_ANON_KEY}`,
      apikey: env.SUPABASE_ANON_KEY,
    },
    body: JSON.stringify({ text: query }),
  });
  if (!res.ok) throw new Error(`suggest proxy ${res.status}`);
  const data = await res.json();
  const results = Array.isArray(data?.results) ? data.results : [];
  const out = [];
  for (const item of results) {
    // Прокси уже отфильтровал/дедуплицировал варианты без uri или текста
    // (см. supabase/functions/suggest) — здесь просто на всякий случай
    // проверяем форму ответа.
    if (item && typeof item.text === 'string' && typeof item.uri === 'string') {
      out.push({ text: item.text, uri: item.uri });
    }
  }
  return out;
}

/**
 * Координаты конкретного варианта из подсказок Геосаджеста — по его uri
 * (см. searchAddressSuggestionsYandex выше). Тот же HTTP-Геокодер, что и в
 * geocodeAddressYandex, только вместо текста адреса в параметр geocode
 * передаётся uri — так документация Яндекса рекомендует получать точку по
 * результату Геосаджеста.
 * @returns {Promise<{lat:number,lng:number}|null>}
 */
async function resolveGeosuggestUri(uri) {
  const env = (typeof window !== 'undefined' && window.__ENV__) || {};
  const apiKey = env.YANDEX_GEOCODER_API_KEY;
  if (!apiKey || !uri) return null;
  const url = `https://geocode-maps.yandex.ru/1.x/?apikey=${encodeURIComponent(apiKey)}&geocode=${encodeURIComponent(uri)}&format=json&results=1`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Yandex geocoder ${res.status}`);
  const data = await res.json();
  const found = data?.response?.GeoObjectCollection?.featureMember?.[0]?.GeoObject;
  const pos = found?.Point?.pos; // формат "долгота широта"
  if (!pos) return null;
  const [lng, lat] = pos.split(' ').map(Number);
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
  // Тот же фильтр мусорных совпадений, что и в geocodeAddressYandex — для
  // подсказки, выбранной человеком из реального списка, срабатывать почти
  // не должен, но на всякий случай оставляем ту же защиту.
  const precision = found?.metaDataProperty?.GeocoderMetaData?.precision;
  if (precision && GEOCODER_JUNK_PRECISION.has(precision)) return null;
  return { lat, lng };
}

// ---------------------------------------------------------------------
// Интерактивная карта подтверждения точки на экране «Проверьте заявку»
// (renderCompose → quickReview). Адрес больше не блокирует отправку заявки
// сам по себе (см. composerSend/saveProfileDistrict выше) — вместо этого
// человек своими глазами видит метку на карте и может перетащить её на
// нужное место, если геокодер ошибся или адрес не распознался вовсе.
// Карта — тот же JS API Яндекс.Карт 2.1, что и в admin.html, только со
// своим ключом (YANDEX_MAPS_JS_API_KEY) и с одной перетаскиваемой меткой
// вместо множества.
// ---------------------------------------------------------------------

function isMapsJsConfigured() {
  const env = (typeof window !== 'undefined' && window.__ENV__) || {};
  return Boolean(env.YANDEX_MAPS_JS_API_KEY);
}

let quickReviewMapInstance = null;
let quickReviewMapLoadPromise = null;
// Счётчик вызовов initQuickReviewMap(). wireEvents() может вызвать функцию
// несколько раз подряд (например, если render() случится дважды, пока
// первый вызов ещё ждёт загрузки скрипта карт/ymaps.ready) — без этой
// защиты оба вызова создавали свою карту в один и тот же контейнер,
// оставляя две наложенные друг на друга ymaps.Map (проверено вживую: у
// контейнера оказывалось два дочерних <ymaps> узла, и клики по видимой
// сверху карте не долетали до «активного» экземпляра). Каждый вызов
// получает свой токен и после каждого await сверяется, что он всё ещё
// самый последний — иначе тихо прекращает работу.
let quickReviewMapInitToken = 0;

function loadYmapsScriptForCompose() {
  if (window.ymaps) return Promise.resolve();
  if (quickReviewMapLoadPromise) return quickReviewMapLoadPromise;
  const env = (typeof window !== 'undefined' && window.__ENV__) || {};
  const apiKey = env.YANDEX_MAPS_JS_API_KEY;
  quickReviewMapLoadPromise = new Promise((resolve, reject) => {
    if (!apiKey) return reject(new Error('YANDEX_MAPS_JS_API_KEY не задан'));
    const script = document.createElement('script');
    script.src = `https://api-maps.yandex.ru/2.1/?apikey=${encodeURIComponent(apiKey)}&lang=ru_RU`;
    script.onload = resolve;
    script.onerror = () => reject(new Error('Не удалось загрузить Яндекс.Карты'));
    document.head.appendChild(script);
  });
  return quickReviewMapLoadPromise;
}

/**
 * Инициализирует (или переинициализирует после re-render) интерактивную
 * карту с перетаскиваемой меткой на экране подтверждения заявки. Вызывается
 * из wireEvents() — из-за паттерна «render() каждый раз заменяет всё #app
 * целиком» старый экземпляр ymaps.Map живёт в уже удалённом из DOM
 * контейнере, поэтому его сперва аккуратно уничтожаем (.destroy()), чтобы
 * не плодить утечки и невидимые обработчики событий.
 */
async function initQuickReviewMap() {
  const container = document.getElementById('quick-review-map');
  if (!container) return; // не на этом шаге композера — ничего делать не нужно

  const myToken = ++quickReviewMapInitToken;

  const destroyExisting = () => {
    if (quickReviewMapInstance) {
      try { quickReviewMapInstance.destroy(); } catch (err) { /* контейнер уже мог исчезнуть — не критично */ }
      quickReviewMapInstance = null;
    }
    // Подчищаем контейнер и вручную — .destroy() полагается на то, что
    // именно ЭТОТ вызов создал единственную карту внутри него; если карт
    // всё же оказалось больше (см. комментарий у quickReviewMapInitToken),
    // это подчистит осиротевшие узлы, которые destroy() не знает.
    const c = document.getElementById('quick-review-map');
    if (c) c.innerHTML = '';
  };

  destroyExisting();

  if (!isMapsJsConfigured()) {
    return;
  }

  try {
    await loadYmapsScriptForCompose();
  } catch (err) {
    console.warn('[geo] карта подтверждения адреса не загрузилась', err);
    return;
  }
  if (myToken !== quickReviewMapInitToken) return; // нас уже обогнал более новый вызов

  window.ymaps.ready(() => {
    if (myToken !== quickReviewMapInitToken) return; // нас уже обогнал более новый вызов
    const containerNow = document.getElementById('quick-review-map');
    if (!containerNow) return; // экран сменился, пока карта грузилась
    // На всякий случай ещё раз чистим контейнер прямо перед созданием —
    // между проверкой токена выше и этим моментом синхронного кода нет,
    // но так надёжнее, если что-то успело дорисоваться асинхронно.
    containerNow.innerHTML = '';

    const d = state.draft;
    const startCoords = hasValidLocation(d.exactLocation)
      ? [d.exactLocation.lat, d.exactLocation.lng]
      : [CENTER.lat, CENTER.lng];

    const map = new window.ymaps.Map('quick-review-map', {
      center: startCoords,
      zoom: hasValidLocation(d.exactLocation) ? 16 : 10,
      controls: ['zoomControl'],
    });
    quickReviewMapInstance = map;

    const placemark = new window.ymaps.Placemark(
      startCoords,
      {},
      {
        iconLayout: 'default#image',
        iconImageHref: 'red-dot.png',
        iconImageSize: [22, 22],
        iconImageOffset: [-11, -11], // кружок симметричный — центрируем прямо на координате
        draggable: true,
      }
    );
    map.geoObjects.add(placemark);

    const applyPoint = async (lat, lng) => {
      state.draft.exactLocation = { lat, lng };
      const hint = document.getElementById('quick-review-map-address');
      if (hint) hint.textContent = 'Определяем адрес…';
      try {
        const text = await reverseGeocodeYandex(lat, lng);
        if (text) {
          state.draft.fullAddress = text;
          state.draft.district = text;
        }
      } catch (err) {
        console.warn('[geo] обратное геокодирование точки на карте не удалось', err);
      }
      if (hint) {
        hint.textContent = state.draft.fullAddress
          ? `📍 ${state.draft.fullAddress}`
          : 'Адрес не определён — можно уточнить его текстом выше';
      }
      // Предупреждение «точка не определена» относится к старому состоянию —
      // раз человек только что подтвердил метку на карте, лишний банер уже
      // не нужен, а полный render() сейчас сбил бы фокус/позицию карты.
      const warn = document.getElementById('quick-review-location-warning');
      if (warn) warn.remove();
    };

    placemark.events.add('dragend', () => {
      const coords = placemark.geometry.getCoordinates();
      applyPoint(coords[0], coords[1]);
    });
    map.events.add('click', (e) => {
      const coords = e.get('coords');
      placemark.geometry.setCoordinates(coords);
      applyPoint(coords[0], coords[1]);
    });
  });
}

// ---------------------------------------------------------------------
// Всплывающий выбор точки на карте (кнопка «Указать на карте») — общий
// попап для профиля (адрес мастера/заказчика) и для адреса заявки при
// оформлении. В отличие от инлайн-карты на шаге «Проверьте заявку» выше
// (initQuickReviewMap) — это модальное окно со своими кнопками
// «Сохранить»/«Закрыть», результат применяется к полю-получателю только
// по явному «Сохранить». Логика самой карты намеренно повторяет
// initQuickReviewMap, а не переиспользует её один в один — разные
// контейнеры и разный «получатель» результата.
//
// Управление зумом/геолокацией отдано контролам самой карты
// (zoomControl + geolocationControl «найти меня»), чтобы на маленьком
// экране телефона не приходилось долго и неточно двигать карту пальцем в
// поисках нужного места — можно сразу приблизиться к своей геопозиции.
// ---------------------------------------------------------------------

function openMapPicker(target) {
  let initial = null;
  let addressText = '';
  if (target === 'profile') {
    const user = currentUser();
    if (hasValidLocation(user?.location)) initial = user.location;
    addressText = profileDistrictValue || user?.district || '';
  } else if (target === 'composer') {
    if (hasValidLocation(composerExactLocation)) initial = composerExactLocation;
    addressText = composerAddressValue || '';
  } else {
    return;
  }
  mapPickerOpenFor = target;
  mapPickerLocation = initial || { ...CENTER };
  mapPickerHasRealLocation = Boolean(initial);
  mapPickerAddressText = addressText;
  render();
}

function destroyMapPickerMap() {
  if (mapPickerInstance) {
    try { mapPickerInstance.destroy(); } catch (err) { /* контейнер уже мог исчезнуть — не критично */ }
    mapPickerInstance = null;
  }
}

function closeMapPicker() {
  destroyMapPickerMap();
  mapPickerOpenFor = null;
  mapPickerLocation = null;
  render();
}

/** Применяет выбранную в попапе точку к полю-получателю и закрывает попап. */
function saveMapPicker() {
  const target = mapPickerOpenFor;
  const location = mapPickerLocation;
  const addressText = mapPickerAddressText;
  destroyMapPickerMap();
  mapPickerOpenFor = null;
  mapPickerLocation = null;
  if (!location) { render(); return; }

  if (target === 'profile') {
    profileDistrictValue = addressText || profileDistrictValue;
    profileDistrictSelectedLocation = location;
    render();
    // Сохраняем сразу тем же путём, что и кнопка «Сохранить» в профиле —
    // человек уже подтвердил точку в попапе, лишний клик не нужен.
    saveProfileDistrict();
  } else if (target === 'composer') {
    composerAddressValue = addressText || composerAddressValue;
    composerExactLocation = location;
    render();
  } else {
    render();
  }
}

async function initMapPickerMap() {
  const container = document.getElementById('map-picker-map');
  if (!container) return; // попап сейчас закрыт — ничего делать не нужно

  const myToken = ++mapPickerInitToken;
  destroyMapPickerMap();
  container.innerHTML = '';

  if (!isMapsJsConfigured()) return;

  try {
    await loadYmapsScriptForCompose();
  } catch (err) {
    console.warn('[geo] карта выбора точки не загрузилась', err);
    return;
  }
  if (myToken !== mapPickerInitToken) return;

  window.ymaps.ready(() => {
    if (myToken !== mapPickerInitToken) return;
    const containerNow = document.getElementById('map-picker-map');
    if (!containerNow || !mapPickerLocation) return;
    containerNow.innerHTML = '';

    const startCoords = [mapPickerLocation.lat, mapPickerLocation.lng];
    const map = new window.ymaps.Map('map-picker-map', {
      center: startCoords,
      zoom: mapPickerHasRealLocation ? 16 : 11,
      controls: ['zoomControl', 'geolocationControl'],
    });
    mapPickerInstance = map;

    const placemark = new window.ymaps.Placemark(
      startCoords,
      {},
      {
        iconLayout: 'default#image',
        iconImageHref: 'red-dot.png',
        iconImageSize: [22, 22],
        iconImageOffset: [-11, -11],
        draggable: true,
      }
    );
    map.geoObjects.add(placemark);

    const applyPickerPoint = async (lat, lng) => {
      mapPickerLocation = { lat, lng };
      const hint = document.getElementById('map-picker-address');
      if (hint) hint.textContent = 'Определяем адрес…';
      try {
        const text = await reverseGeocodeYandex(lat, lng);
        if (text) mapPickerAddressText = text;
      } catch (err) {
        console.warn('[geo] обратное геокодирование точки на карте не удалось', err);
      }
      if (hint) {
        hint.textContent = mapPickerAddressText
          ? `📍 ${mapPickerAddressText}`
          : 'Адрес не определён — можно уточнить его текстом';
      }
    };

    placemark.events.add('dragend', () => {
      const coords = placemark.geometry.getCoordinates();
      applyPickerPoint(coords[0], coords[1]);
    });
    map.events.add('click', (e) => {
      const coords = e.get('coords');
      placemark.geometry.setCoordinates(coords);
      applyPickerPoint(coords[0], coords[1]);
    });
  });
}
