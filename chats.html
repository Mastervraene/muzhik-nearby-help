<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--g0);color:var(--g9);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;justify-content:center}
#app{width:100%;max-width:560px;height:100dvh;display:flex;flex-direction:column;background:#fff;position:relative;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--g2);background:#fff}
header h1{font-size:17px;margin:0;flex:1}
header .sub{font-size:12px;color:var(--g5);font-weight:400;display:block}
.btn{border:0;border-radius:12px;padding:10px 14px;font-size:15px;font-weight:600;background:var(--ac);color:#fff;cursor:pointer}
.btn.sec{background:var(--g1);color:var(--g9)}.btn.warn{background:#fee2e2;color:#b91c1c}.btn:disabled{opacity:.45}
.ib{border:0;background:var(--g1);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.list{flex:1;overflow-y:auto}
.row{padding:12px 14px;border-bottom:1px solid var(--g1);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.row:active{background:var(--g1)}
.dot{width:10px;height:10px;border-radius:50%;background:#ef4444;margin-top:6px;flex:none}.dot.mine{background:var(--ok)}.dot.other{background:#94a3b8}
.row b{font-size:15px}.row small{color:var(--g5);font-size:12px;margin-left:6px}
.row p{margin:2px 0 0;color:var(--g5);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:440px}

.empty{padding:40px 20px;text-align:center;color:var(--g5)}
.log{flex:1;min-height:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--g0)}
.b{max-width:84%;padding:8px 12px;border-radius:16px;font-size:15px;line-height:1.35;white-space:pre-wrap;word-wrap:break-word}

.b.assistant{align-self:flex-end;background:var(--g1)}

.b.sys{align-self:center;background:none;color:var(--g5);font-size:12.5px;text-align:center}
.who{font-size:11px;color:var(--g5);margin:6px 4px 0}

.bar .tools{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.info{padding:10px 14px;font-size:14px;background:#fffbeb;color:var(--warn);border-top:1px solid var(--g2)}
.price{display:none;border-top:1px solid var(--g2);padding:10px 12px;background:var(--g0)}
.price.on{display:block}.price label{font-size:12px;color:var(--g5);display:block;margin-bottom:4px}
.price .r{display:flex;gap:8px;margin-bottom:8px}

.login input{border:1px solid var(--g2);border-radius:12px;padding:13px;font-size:17px}
.err{color:#b91c1c;font-size:14px;min-height:18px}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:9px 14px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}

.mc-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.mc-ib,.mc-send{border:0;border-radius:50%;width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.mc-ib{background:#f1f5f9;color:#64748b}.mc-ib.on{background:#2563eb;color:#fff}
.mc-send{background:#cbd5e1;color:#fff}.mc-send.on{background:#2563eb}
.mc-ib svg,.mc-send svg{width:18px;height:18px}
.mc-corr{flex:1;border:0;border-radius:999px;padding:9px 12px;background:#2563eb;color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.mc-ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.mc-sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;box-sizing:border-box}
.mc-sheet h3{margin:0 0 10px;font-size:17px}.mc-sheet label{display:block;font-size:12px;color:#64748b;margin:10px 0 4px}
.mc-sheet select,.mc-sheet input,.mc-sheet textarea{width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;background:#fff}
.mc-sheet .r{display:flex;gap:8px;margin-top:8px}.mc-sheet .r button{flex:1;border:0;border-radius:12px;padding:12px;font:inherit;font-size:15px;font-weight:600;background:#2563eb;color:#fff;cursor:pointer}
.mc-sheet .r button.sec{background:#f1f5f9;color:#0f172a}.mc-sheet button:disabled{opacity:.5}

.bar .mc-ta{border:0;padding:0;border-radius:0;max-height:160px}

<script>
(function(){
/* Просмотр фото: на весь экран, листание влево-вправо, закрытие свайпом вверх/вниз */
(function () {
  if (window.mcLightbox) return;
  var st = document.createElement('style');
  st.textContent = '.lb-ov{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.94);touch-action:none;transition:background .15s}.lb-tr{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;touch-action:pan-x;-webkit-overflow-scrolling:touch;scrollbar-width:none}.lb-tr::-webkit-scrollbar{display:none}.lb-sl{flex:0 0 100%;height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center}.lb-sl img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}.lb-x{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:22px;line-height:1;z-index:2}.lb-n{position:absolute;top:calc(18px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fff;font:14px sans-serif;z-index:1;pointer-events:none}img[data-lb]{cursor:zoom-in}';
  document.head.appendChild(st);
  window.mcLightbox = function (urls, idx) {
    var ov = document.createElement('div'); ov.className = 'lb-ov';
    var tr = document.createElement('div'); tr.className = 'lb-tr';
    urls.forEach(function (u) { var s = document.createElement('div'); s.className = 'lb-sl'; var im = document.createElement('img'); im.src = u; im.draggable = false; s.appendChild(im); tr.appendChild(s); });
    var x = document.createElement('button'); x.type = 'button'; x.className = 'lb-x'; x.textContent = '×';
    var n = document.createElement('div'); n.className = 'lb-n';
    ov.appendChild(tr); ov.appendChild(x); ov.appendChild(n); document.body.appendChild(ov);
    function cnt() { var i = Math.round(tr.scrollLeft / (tr.clientWidth || 1)); n.textContent = urls.length > 1 ? (i + 1) + ' / ' + urls.length : ''; }
    function close() { ov.remove(); document.removeEventListener('keydown', key); }
    function key(e) { if (e.key === 'Escape') close(); }
    document.addEventListener('keydown', key);
    x.onclick = close;
    tr.addEventListener('scroll', cnt);
    tr.scrollLeft = idx * tr.clientWidth; cnt();
    var sx = 0, sy = 0, dy = 0, drag = false, lock = '';
    ov.addEventListener('touchstart', function (e) { if (e.touches.length !== 1) { drag = false; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; dy = 0; drag = true; lock = ''; }, { passive: true });
    ov.addEventListener('touchmove', function (e) {
      if (!drag) return;
      var mx = e.touches[0].clientX - sx, my = e.touches[0].clientY - sy;
      if (!lock && (Math.abs(mx) > 8 || Math.abs(my) > 8)) lock = Math.abs(my) > Math.abs(mx) ? 'y' : 'x';
      if (lock === 'y') { dy = my; tr.style.transform = 'translateY(' + dy + 'px)'; ov.style.background = 'rgba(0,0,0,' + Math.max(0.2, 0.94 - Math.abs(dy) / 500) + ')'; }
    }, { passive: true });
    ov.addEventListener('touchend', function () {
      if (!drag) return; drag = false;
      if (lock === 'y' && Math.abs(dy) > 90) { close(); return; }
      tr.style.transform = ''; ov.style.background = '';
    });
    ov.addEventListener('click', function (e) { if (e.target === ov || e.target.className === 'lb-sl') close(); });
  };
  document.addEventListener('click', function (e) {
    var t = e.target && e.target.closest && e.target.closest('img[data-lb]'); if (!t) return;
    e.preventDefault();
    var g = t.getAttribute('data-lb'), all = Array.prototype.slice.call(document.querySelectorAll('img[data-lb]')).filter(function (i) { return i.getAttribute('data-lb') === g; });
    window.mcLightbox(all.map(function (i) { return i.getAttribute('data-full') || i.src; }), Math.max(0, all.indexOf(t)));
  });
})();

/* Окно ввода модератора: фото, «Коррекция», отправка. opts: base, key, send(text,urls), price(amount,orderId,note), back(note,amount,orderId) */
function mcMount(host, opts) {
  var photos = [], drafts = [];
  var IC_CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V6a2 2 0 0 1 2-2h3M15 4h3a2 2 0 0 1 2 2v3M20 15v3a2 2 0 0 1-2 2h-3M9 20H6a2 2 0 0 1-2-2v-3"/><circle cx="12" cy="12" r="3"/></svg>';
  var IC_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>';
  host.innerHTML = '<div class="mc-card"><textarea class="mc-ta" rows="1" maxlength="2000" placeholder="Ответ клиенту"></textarea><div class="mc-ph"></div><input type="file" accept="image/*" multiple style="display:none"><div class="mc-row"><button type="button" class="mc-ib" aria-label="Фото">' + IC_CAM + '</button><button type="button" class="mc-corr">Коррекция</button><button type="button" class="mc-send" aria-label="Отправить">' + IC_UP + '</button></div></div>';
  var ta = host.querySelector('.mc-ta'), ph = host.querySelector('.mc-ph'), fi = host.querySelector('input[type=file]');
  var cam = host.querySelector('.mc-ib'), corr = host.querySelector('.mc-corr'), snd = host.querySelector('.mc-send');
  function esc(x) { return String(x == null ? '' : x).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function grade() { snd.classList.toggle('on', Boolean(ta.value.trim()) || photos.some(function (p) { return p.url; })); cam.classList.toggle('on', photos.length > 0); }
  function grow() { ta.style.height = '24px'; ta.style.height = Math.min(ta.scrollHeight, 160) + 'px'; }
  function renderPh() {
    ph.innerHTML = '';
    photos.forEach(function (p, i) { var d = document.createElement('div'); if (p.up) d.className = 'up'; d.innerHTML = '<img src="' + esc(p.preview) + '">'; var x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.onclick = function () { photos.splice(i, 1); renderPh(); grade(); }; d.appendChild(x); ph.appendChild(d); });
    grade();
  }
  function shrink(file) {
    return new Promise(function (res) {
      var u = URL.createObjectURL(file), im = new Image();
      im.onload = function () { var k = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(function (b) { res(b || file); }, 'image/jpeg', 0.82); };
      im.onerror = function () { URL.revokeObjectURL(u); res(file); };
      im.src = u;
    });
  }
  cam.onclick = function () { fi.click(); };
  fi.onchange = function () {
    Array.prototype.slice.call(fi.files).filter(function (f) { return f.type && f.type.indexOf('image/') === 0; }).slice(0, 5 - photos.length).forEach(async function (f) {
      var p = { up: true, preview: URL.createObjectURL(f) }; photos.push(p); renderPh();
      try {
        var blob = await shrink(f), path = 'mod-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
        var r = await fetch(opts.base + '/storage/v1/object/order-attachments/' + path, { method: 'POST', headers: { apikey: opts.key, Authorization: 'Bearer ' + opts.key, 'Content-Type': 'image/jpeg' }, body: blob });
        if (!r.ok) throw new Error('upload');
        p.url = opts.base + '/storage/v1/object/public/order-attachments/' + path; p.up = false;
      } catch (e) { photos.splice(photos.indexOf(p), 1); alert('Не удалось загрузить фото'); }
      renderPh();
    });
    fi.value = '';
  };
  ta.oninput = function () { grow(); grade(); };
  ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) doSend(); });
  async function doSend() {
    var t = ta.value.trim();
    if (photos.some(function (p) { return p.up; })) { alert('Фото ещё загружается'); return; }
    var urls = photos.filter(function (p) { return p.url; }).map(function (p) { return p.url; });
    if (!t && !urls.length) return;
    snd.disabled = true;
    try { await opts.send(t, urls); ta.value = ''; photos = []; renderPh(); grow(); } catch (e) { alert('Не отправилось: ' + e.message); }
    snd.disabled = false; grade();
  }
  snd.onclick = doSend;
  corr.onclick = function () {
    var ov = document.createElement('div'); ov.className = 'mc-ov';
    ov.innerHTML = '<div class="mc-sheet"><h3>Коррекция</h3><label>Новая цена</label><select class="o"></select><input class="a" type="number" inputmode="numeric" min="1" placeholder="Сумма, ₽" style="margin-top:8px"><label>Указание ассистенту (клиент не видит)</label><textarea class="n" rows="3" placeholder="Что уточнить у клиента или что делать дальше"></textarea><div class="r"><button type="button" class="ap sec"><span class="ai">📷</span> Фото к заказу</button></div><input class="af" type="file" accept="image/*" multiple style="display:none"><div class="as" style="font-size:12px;color:#64748b;margin-top:4px;min-height:14px"></div><div class="r"><button type="button" class="p">Зафиксировать цену</button></div><div class="r"><button type="button" class="b sec">Вернуть ассистенту</button><button type="button" class="x sec">Закрыть</button></div></div>';
    document.body.appendChild(ov);
    var sel = ov.querySelector('.o');
    sel.innerHTML = drafts.map(function (o) { return '<option value="' + esc(o.id) + '">' + esc(o.label) + '</option>'; }).join('') + '<option value="">Без заказа — цена для ассистента</option>';
    function vals() { return { amt: Math.round(Number(ov.querySelector('.a').value)), oid: sel.value || undefined, note: ov.querySelector('.n').value.trim() }; }
    var af = ov.querySelector('.af'), as = ov.querySelector('.as'), ap = ov.querySelector('.ap');
    ap.onclick = function () { af.click(); };
    af.onchange = async function () {
      var files = Array.prototype.slice.call(af.files).filter(function (f) { return f.type && f.type.indexOf('image/') === 0; }).slice(0, 10); af.value = '';
      if (!files.length) return;
      ap.disabled = true; as.textContent = 'Загружаем…';
      try {
        var urls = [];
        for (var i = 0; i < files.length; i++) {
          var blob = await shrink(files[i]), path = 'mod-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
          var r = await fetch(opts.base + '/storage/v1/object/order-attachments/' + path, { method: 'POST', headers: { apikey: opts.key, Authorization: 'Bearer ' + opts.key, 'Content-Type': 'image/jpeg' }, body: blob });
          if (!r.ok) throw new Error('не удалось загрузить фото');
          urls.push(opts.base + '/storage/v1/object/public/order-attachments/' + path);
        }
        var n = await opts.attach(urls, sel.value || undefined);
        as.textContent = 'Добавлено к заказу' + (n ? ' ' + n : '') + ': ' + urls.length + ' фото';
      } catch (e) { as.textContent = ''; alert(e.message === 'no_order' ? 'У клиента пока нет заказа — прикреплять некуда' : 'Не получилось: ' + e.message); }
      ap.disabled = false;
    };
    ov.querySelector('.x').onclick = function () { ov.remove(); };
    ov.addEventListener('click', function (e) { if (e.target === ov) ov.remove(); });
    ov.querySelector('.p').onclick = async function () {
      var v = vals(); if (!(v.amt > 0 && v.amt < 100000)) { alert('Введите сумму от 1 до 99 999 ₽'); return; }
      this.disabled = true;
      try { await opts.price(v.amt, v.oid, v.note); ov.remove(); } catch (e) { alert('Не получилось: ' + e.message); this.disabled = false; }
    };
    ov.querySelector('.b').onclick = async function () {
      var v = vals(); if (!confirm('Вернуть чат ассистенту?')) return;
      this.disabled = true;
      try { await opts.back(v.note, v.amt > 0 ? v.amt : 0, v.oid); ov.remove(); } catch (e) { alert('Не получилось: ' + e.message); this.disabled = false; }
    };
  };
  return { setDrafts: function (d) { drafts = d || []; } };
}

var URL_BASE='https://youyvbqdxuigvjciklfk.supabase.co';

function showLogin(err){
  stopTimers();
  app.innerHTML='<div class="login"><h1 style="margin:0">Чаты модератора</h1><div style="color:var(--g5)">Войдите по номеру телефона и паролю от аккаунта</div><input id="ph" type="tel" inputmode="tel" placeholder="+7 900 000 00 00" autocomplete="username"><input id="pw" type="password" placeholder="Пароль" autocomplete="current-password"><div class="err" id="er">'+esc(err||'')+'</div><button class="btn" id="go">Войти</button></div>';
  var go=document.getElementById('go');
  async function doLogin(){
    var d=document.getElementById('ph').value.replace(/\D/g,'');if(d.length===10)d='7'+d;if(d.length===11&&d[0]==='8')d='7'+d.slice(1);
    var pw=document.getElementById('pw').value;var er=document.getElementById('er');
    if(d.length!==11||!pw){er.textContent='Введите номер и пароль';return;}
    go.disabled=true;er.textContent='';
    var r=await post('login-with-password',{phone:d,password:pw});
    go.disabled=false;
    var uid=r&&(r.userId||r.user_id||(r.user&&r.user.id));
    if(!r||!r.ok||!r.token||!uid){er.textContent=(r&&r.error==='invalid_credentials')?'Неверный номер или пароль':'Не удалось войти';return;}
    S={uid:uid,tok:r.token};
    var t=await act('mod_list');
    if(!t||!t.ok){S=null;er.textContent='У этого аккаунта нет доступа модератора';return;}
    save();showList();
  }
  go.onclick=doLogin;document.getElementById('pw').onkeydown=function(e){if(e.key==='Enter')doLogin();};
}
function logout(){S=null;save();cur=null;showLogin();}

/* ---------- уведомления ---------- */
function beep(){
  if(!sound)return;
  try{var c=new (window.AudioContext||window.webkitAudioContext)();[0,.18].forEach(function(t,i){var o=c.createOscillator(),g=c.createGain();o.frequency.value=i?1100:800;g.gain.value=.15;o.connect(g);g.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.14);});}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
}
function notify(n){
  beep();
  try{if('Notification' in window&&Notification.permission==='granted'&&document.hidden)new Notification('Нужен администратор',{body:n.userName||n.phone||'Новый чат',tag:'mod-'+n.userId});}catch(e){}
}
function updateTitle(){var n=threads.filter(function(t){return t.awaiting&&!t.claimedBy;}).length;document.title=(n?'('+n+') ':'')+'Чаты — модератор';try{navigator.setAppBadge&&(n?navigator.setAppBadge(n):navigator.clearAppBadge());}catch(e){}}

/* ---------- список ---------- */
async function loadList(){
  var d=await act('mod_list');
  if(!d)return;
  if(!d.ok){if(d.error==='forbidden'||d.error==='unauthorized'||d.error==='bad_session'||d.error==='invalid_session')return logout();return;}
  me=d.me||'';threads=d.threads||[];
  threads.forEach(function(t){
    var need=t.awaiting&&!t.claimedBy;
    if(need&&!seen[t.userId]&&!first)notify(t);
    seen[t.userId]=need?1:0;
    if(!need)seen[t.userId]=0;
  });
  first=false;updateTitle();
  if(!cur)renderList();
}
function renderList(){
  var el=document.getElementById('list');if(!el)return;
  if(!threads.length){el.innerHTML='<div class="empty">Сейчас нет чатов, где нужен администратор.<br>Новые появятся здесь сами.</div>';return;}
  var order=threads.slice().sort(function(a,b){var ra=a.mine?0:(a.claimedBy?2:1),rb=b.mine?0:(b.claimedBy?2:1);return ra-rb||String(b.lastAt).localeCompare(String(a.lastAt));});
  el.innerHTML=order.map(function(t){
    var cls=t.mine?'mine':(t.claimedBy?'other':'');
    var tag=t.mine?'<span class="tag mine">ваш</span>':(t.claimedBy?'<span class="tag">ведёт '+esc(t.claimedBy)+'</span>':'');
    return '<div class="row" data-u="'+esc(t.userId)+'"><span class="dot '+cls+'"></span><div style="min-width:0"><b>'+esc(t.userName||t.phone||'Клиент')+'</b>'+tag+'<small>'+ago(t.lastAt)+'</small><p>'+esc((t.lastRole==='user'?'':'↳ ')+(t.lastText||''))+'</p></div></div>';
  }).join('');
  [].forEach.call(el.querySelectorAll('.row'),function(r){r.onclick=function(){openChat(r.getAttribute('data-u'));};});
}
function showList(){
  stopTimers();cur=null;curData=null;
  app.innerHTML='<header><h1>Нужен администратор<span class="sub" id="sub"></span></h1><button class="ib" id="snd" title="Звук">'+(sound?'🔔':'🔕')+'</button><button class="ib" id="nt" title="Уведомления">📣</button><button class="ib" id="out" title="Выйти">⎋</button></header><div class="view"><div class="list" id="list"></div></div>';
  document.getElementById('sub').textContent=me?'Вы: '+me:'';
  document.getElementById('snd').onclick=function(){sound=!sound;this.textContent=sound?'🔔':'🔕';if(sound)beep();};
  document.getElementById('nt').onclick=function(){if(!('Notification' in window))return toast('Браузер не поддерживает уведомления');Notification.requestPermission().then(function(p){toast(p==='granted'?'Уведомления включены':'Уведомления запрещены');});};
  document.getElementById('out').onclick=function(){if(confirm('Выйти из аккаунта?'))logout();};
  renderList();loadList();
  timers.list=setInterval(function(){if(!document.hidden)loadList();},4000);
}

/* ---------- чат ---------- */
async function openChat(uid){
  stopTimers();cur=uid;curData=null;lastMsgId=0;
  var t=threads.filter(function(x){return x.userId===uid;})[0]||{};
  app.innerHTML='<header><button class="ib" id="bk">←</button><h1 id="ttl">'+esc(t.userName||t.phone||'Клиент')+'<span class="sub" id="csub"></span></h1></header>'+
  '<div class="view"><div class="log" id="log"></div><div id="info"></div>'+
  '<div class="price" id="price"><label>Указание ассистенту (клиент не видит)</label><textarea id="note" rows="2" placeholder="Что уточнить у клиента или что делать дальше"></textarea><label style="margin-top:8px">Новая цена для клиента, ₽</label><div class="r"><select id="ord"></select></div><div class="r"><input id="amt" type="number" inputmode="numeric" placeholder="Сумма, ₽"><button class="btn" id="setp">Зафиксировать</button></div></div>'+
  '<div class="bar" id="bar"></div></div>';
  document.getElementById('bk').onclick=function(){showList();};
  await refreshChat(true);
  timers.chat=setInterval(function(){if(!document.hidden)refreshChat(false);},3000);
}
function renderMsgs(d,force){
  var log=document.getElementById('log');if(!log)return;
  var ms=(d.messages||[]).filter(function(m){return !/^\[Система\]/.test(m.text||'');});
  var lastId=ms.length?ms[ms.length-1].id:0;
  if(!force&&lastId===lastMsgId)return;
  var atBottom=log.scrollHeight-log.scrollTop-log.clientHeight<80;lastMsgId=lastId;
  log.innerHTML=ms.map(function(m){
    var dt=m.draft||{};
    if(dt.type==='sys')return '<div class="b sys">'+esc(m.text)+'</div>';
    if(m.role==='user'){var tx=String(m.text||'').replace(/\s*\[клиент указал адрес[^\]]*\]/,'').replace(/\s*\[клиент приложил фото[^\]]*\]/,'');var up=(dt.photos||[]).map(function(u){return '<img data-lb="m'+m.id+'" src="'+esc(u)+'" style="max-width:100%;max-height:180px;border-radius:10px;display:block;margin-top:4px">';}).join('');return '<div class="b user">'+esc(tx)+up+'</div>';}
    var ph=(dt.photos||[]).map(function(u){return '<img data-lb="m'+m.id+'" src="'+esc(u)+'" style="max-width:100%;max-height:180px;border-radius:10px;display:block;margin-top:4px">';}).join('');
    return '<div class="b '+(m.role==='admin'?'admin':'assistant')+'">'+(ph&&m.text==='📷 Фото'?'':esc(m.text))+ph+'</div>';
  }).join('')||'<div class="empty">Сообщений нет</div>';
  if(force||atBottom)log.scrollTop=log.scrollHeight;
}
function renderBar(d){
  var bar=document.getElementById('bar'),info=document.getElementById('info'),price=document.getElementById('price');if(!bar)return;
  var csub=document.getElementById('csub');
  if(csub)csub.textContent=(d.phone||'')+(d.mine?' · ваш чат':(d.claimedBy?' · ведёт '+d.claimedBy:''));
  var key=(d.mine?'m':(d.claimedBy?'o':'f'));
  if(bar.getAttribute('data-k')===key){if(composer)composer.setDrafts(draftOpts(d));return;}
  bar.setAttribute('data-k',key);
  if(d.mine){
    info.innerHTML='';price.classList.remove('on');
    bar.innerHTML='';
    composer=mcMount(bar,{base:URL_BASE,key:ANON,
      send:async function(t,urls){var r=await act('mod_send',{clientId:cur,text:t,photos:urls});if(!r||!r.ok)throw new Error(r&&r.error==='not_mine'?'чат уже ведёт другой администратор':'ошибка');refreshChat(true);},
      attach:async function(urls,oid){var r=await act('mod_attach',{clientId:cur,photos:urls,orderId:oid});if(!r||!r.ok)throw new Error(r&&r.error==='no_order'?'no_order':'ошибка');return r.number?'№'+r.number:'';},
      price:async function(amt,oid,note){var r=await act('mod_set_price',{clientId:cur,amount:amt,orderId:oid,note:note});if(!r||!r.ok)throw new Error({order_not_draft:'заказ уже не черновик',not_mine:'чат ведёт другой администратор',bad_amount:'неверная сумма'}[r&&r.error]||'ошибка');toast('Цена зафиксирована: '+amt+' ₽');refreshChat(true);},
      back:async function(note,amt,oid){if(amt>0){var pr=await act('mod_set_price',{clientId:cur,amount:amt,orderId:oid});if(!pr||!pr.ok)throw new Error('цена не зафиксировалась, чат не возвращён');}var r=await act('mod_back',{clientId:cur,note:note});if(!r||!r.ok)throw new Error('ошибка');toast('Передано ассистенту');showList();}});
    composer.setDrafts(draftOpts(d));
  }else if(d.claimedBy){
    price.classList.remove('on');info.innerHTML='<div class="info">Этот чат ведёт '+esc(d.claimedBy)+'. Если он отключится, чат можно будет забрать.</div>';
    bar.innerHTML='';
  }else{
    price.classList.remove('on');info.innerHTML='';
    bar.innerHTML='<button class="btn" id="cl" style="width:100%">Подключиться к чату</button>';
    document.getElementById('cl').onclick=claim;
  }
}
function draftOpts(d){return (d.orders||[]).filter(function(o){return o.status==='draft';}).map(function(o){return {id:o.id,label:'Заказ №'+o.number+' — '+(o.title||'')+(o.price?' ('+o.price+' ₽)':'')};});}
function fillOrders(d,force){
  var sel=document.getElementById('ord');if(!sel)return;
  var drafts=(d.orders||[]).filter(function(o){return o.status==='draft';});
  var sig=drafts.map(function(o){return o.id;}).join(',');
  if(!force&&sel.getAttribute('data-s')===sig)return;
  sel.setAttribute('data-s',sig);var v=sel.value;
  sel.innerHTML=drafts.map(function(o){return '<option value="'+esc(o.id)+'">Заказ №'+esc(o.number)+' — '+esc(o.title||'')+(o.price?' ('+o.price+' ₽)':'')+'</option>';}).join('')+'<option value="">Без заказа — цена для ассистента</option>';
  if(v)sel.value=v;
}
async function refreshChat(force){
  var uid=cur;if(!uid)return;
  var d=await act('mod_get',{clientId:uid});
  if(uid!==cur||!d)return;
  if(!d.ok){if(d.error==='forbidden'||d.error==='invalid_session'||d.error==='bad_session')logout();return;}
  curData=d;renderMsgs(d,force);renderBar(d);
}
async function claim(){
  var b=document.getElementById('cl');if(b)b.disabled=true;
  var r=await act('mod_claim',{clientId:cur});
  if(r&&!r.ok&&r.error==='taken')toast('Уже подключился '+(r.by||'другой администратор'));
  else if(!r||!r.ok)toast('Не получилось подключиться');
  document.getElementById('bar').removeAttribute('data-k');refreshChat(true);
}
async function send(){
  var tx=document.getElementById('tx'),v=tx.value.trim();if(!v)return;
  var sd=document.getElementById('sd');sd.disabled=true;
  var r=await act('mod_send',{clientId:cur,text:v});sd.disabled=false;
  if(r&&r.ok){tx.value='';tx.style.height='auto';refreshChat(true);}
  else{toast(r&&r.error==='not_mine'?'Чат уже ведёт другой администратор':'Не отправилось');document.getElementById('bar').removeAttribute('data-k');refreshChat(true);}
}
async function back(){
  if(!confirm('Вернуть чат ассистенту? Он пропадёт из списка.'))return;
  var amt=Math.round(Number((document.getElementById('amt')||{}).value));
  if(amt>0){var pr=await act('mod_set_price',{clientId:cur,amount:amt,orderId:(document.getElementById('ord')||{}).value||undefined});if(!pr||!pr.ok)return toast('Цена не зафиксировалась, чат не возвращён');}
  var r=await act('mod_back',{clientId:cur,note:(document.getElementById('note')||{}).value||''});
  if(r&&r.ok){toast('Передано ассистенту');showList();}else toast('Не получилось');
}
document.addEventListener('click',function(e){
  if(e.target&&e.target.id==='setp'){setPrice();}
});
async function setPrice(){
  var amt=Math.round(Number(document.getElementById('amt').value));
  if(!(amt>0&&amt<100000))return toast('Введите сумму от 1 до 99 999 ₽');
  var oid=document.getElementById('ord').value;
  var b=document.getElementById('setp');b.disabled=true;
  var r=await act('mod_set_price',{clientId:cur,amount:amt,orderId:oid||undefined,note:(document.getElementById('note')||{}).value||''});
  b.disabled=false;
  if(r&&r.ok){document.getElementById('amt').value='';document.getElementById('note').value='';toast('Цена зафиксирована: '+amt+' ₽');refreshChat(true);}
  else toast({order_not_draft:'Заказ уже не черновик',not_mine:'Чат ведёт другой администратор',bad_amount:'Неверная сумма'}[r&&r.error]||'Не получилось');
}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S){if(cur)refreshChat(false);else loadList();}});
if(S&&S.uid&&S.tok){act('mod_list').then(function(d){if(d&&d.ok){me=d.me||'';showList();}else showLogin();});}else showLogin();
})();
</script></body></html>
