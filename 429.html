<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Слишком много запросов — Мужик</title>
<meta name="robots" content="noindex, follow" />
<link rel="icon" type="image/png" href="https://мастерврайоне.рф/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: #f7f7f7; color: #121212;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  display: flex; align-items: center; justify-content: center;
}
.card {
  max-width: 420px; margin: 24px; padding: 32px 28px; text-align: center;
  background: #ffffff; border-radius: 20px;
  box-shadow: 0 2px 6px rgba(15,23,42,.05), 0 14px 32px rgba(15,23,42,.08);
}
img { width: 56px; height: 56px; border-radius: 16px; margin-bottom: 16px; }
.error-code {
  font-family: "Oswald", -apple-system, sans-serif; font-weight: 700;
  font-size: 64px; line-height: 1; letter-spacing: -0.02em;
  color: #2563eb; margin: 0 0 14px;
}
h1 {
  font-family: "Oswald", -apple-system, sans-serif; font-weight: 700;
  font-size: 22px; margin: 0 0 6px; letter-spacing: -0.01em;
}
.msg-secondary {
  font-family: "Oswald", -apple-system, sans-serif; font-weight: 700;
  font-size: 19px; line-height: 1.3; letter-spacing: -0.01em;
  color: #121212; margin: 0 0 22px;
}
p { font-size: 15px; line-height: 1.5; color: #545454; margin: 0 0 22px; }
a.btn {
  display: inline-block; background: #2563eb; color: #fff; text-decoration: none;
  font-weight: 700; font-size: 15px; padding: 13px 26px; border-radius: 999px;
}
a.btn:hover { background: #1d4ed8; }
a.secondary { display: block; margin-top: 14px; font-size: 13.5px; color: #767676; text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <img src="https://мастерврайоне.рф/logo.png" alt="Мужик" />
    <p class="error-code">429</p>
    <h1>Заявок слишком много,</h1>
    <p class="msg-secondary">а мужики, увы, не резиновые 🙂</p>
    <p>Мы уже ищем ещё мастеров рядом с вами. Подождите немного и попробуйте снова — в отличие от некоторых, мы точно вернёмся.</p>
    <a class="btn" href="https://мастерврайоне.рф/">На главную</a>
    <a class="secondary" href="https://мастерврайоне.рф/articles/">Статьи о наших услугах</a>
  </div>
</body>
</html>
