<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />

<title>Мужик — чат-помощник (тест)</title>
<link rel="icon" type="image/png" href="/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --gray-0:#ffffff; --gray-50:#f7f7f7; --gray-100:#eeeeee; --gray-200:#dddddd; --gray-300:#c4c4c4; --gray-400:#9c9c9c;
  --gray-500:#767676; --gray-600:#545454; --gray-700:#383838; --gray-800:#232323; --gray-900:#121212;
  --accent:#2563eb; --accent-strong:#1d4ed8; --accent-soft:#eff6ff; --accent-muted:#a8c8fb;
  --radius:20px; --max-width:480px;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:var(--gray-0); color:var(--gray-800);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; -webkit-tap-highlight-color:transparent; }
body { display:flex; justify-content:center; height:100vh; height:100dvh; }
.brand-block { display:flex; align-items:center; gap:10px; cursor:pointer; text-decoration:none; color:inherit; }
.brand-title { font-size:16px; font-weight:700; color:var(--gray-900); }
.brand-sub { font-size:11px; color:var(--gray-500); display:block; }
.icon-button { cursor:pointer; text-decoration:none; }
.icon-button svg { width:18px; height:18px; display:block; }
.icon-button img { width:100%; height:100%; min-width:38px; min-height:38px; object-fit:cover; border-radius:50%; }
.topbar-actions .icon-button { overflow:hidden; }
.screen.chat-screen { display:flex; flex-direction:column; padding:0 16px 6px; overflow:hidden; }
.chat-log { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; padding:8px 0 12px; position:relative; scroll-behavior:smooth; }
.chat-log::before { content:""; margin-top:auto; }
.chat-log.empty { justify-content:center; }
.chat-log.empty::before { display:none; }
.home-hero { text-align:center; padding:10px 8px; }
.chat-log:not(.empty) .home-hero { display:none; }
.bubble { max-width:86%; padding:8px 13px; border-radius:18px; font-size:15px; line-height:1.35; white-space:pre-wrap; word-wrap:break-word;
  margin-top:4px; animation:pop .22s ease-out both; box-shadow:0 1px 2px rgba(15,23,42,.05); }
.bubble.me { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:5px; }
.bubble.ai { align-self:flex-start; background:var(--gray-100); color:var(--gray-900); border-bottom-left-radius:5px; }
.bubble.sys { align-self:center; background:transparent; box-shadow:none; color:var(--gray-500); font-size:12.5px; text-align:center; padding:4px 10px; max-width:92%; }
.bubble.typing { display:inline-flex; gap:5px; align-items:center; padding:12px 14px; }
.bubble.typing i { width:7px; height:7px; border-radius:50%; background:var(--gray-400); animation:blink 1.2s infinite both; }
.bubble.typing i:nth-child(2){animation-delay:.2s} .bubble.typing i:nth-child(3){animation-delay:.4s}
@keyframes pop { from { opacity:0; transform:translateY(10px) scale(.97);} to { opacity:1; transform:none; } }
@keyframes blink { 0%,80%,100% { opacity:.25; transform:translateY(0);} 40% { opacity:1; transform:translateY(-3px);} }
.draft-card { flex:none; margin:0 0 8px; padding:10px 12px; background:var(--gray-0); border:1px solid var(--gray-200); border-radius:22px;
  box-shadow:0 2px 10px rgba(15,23,42,.08); font-size:13px; animation:pop .25s ease-out both; }
.draft-head { display:flex; align-items:center; gap:10px; }
.draft-title { flex:1; min-width:0; cursor:pointer; color:var(--gray-900); font-weight:600; font-size:14px; }
.draft-title small { display:block; color:var(--gray-500); font-weight:400; font-size:11.5px; }
.draft-title span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.draft-more { display:none; margin-top:8px; max-height:30vh; overflow-y:auto; }
.draft-card.open .draft-more { display:block; }
.draft-more div { margin:3px 0; color:var(--gray-500); } .draft-more div b { color:var(--gray-900); font-weight:500; }
.draft-btn { flex:none; padding:10px 16px; border:0; border-radius:999px; background:var(--gray-300); color:#fff; font-size:14px; font-weight:600; font-family:inherit; }
.draft-btn.on { background:var(--accent); cursor:pointer; }
.ph-row { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 0; }
.ph-row:empty { display:none; }
.ph { position:relative; width:44px; height:44px; border-radius:10px; background:var(--gray-100); overflow:visible; }
.ph img { width:100%; height:100%; object-fit:cover; border-radius:10px; display:block; }
.ph.up img { opacity:.4; }
.ph button { position:absolute; top:-6px; right:-6px; width:18px; height:18px; border:0; border-radius:50%; background:var(--gray-700); color:#fff; font-size:11px; line-height:18px; padding:0; cursor:pointer; }
.home-hero-hint { margin:10px 0 0; font-size:15px; line-height:24px; color:var(--gray-400); }
.app-shell {
  width: 100%;
  max-width: var(--max-width);
  height: 100%;
  background: var(--gray-0);
  display: flex;
  flex-direction: column;
  position: relative;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--gray-0);
  position: sticky;
  top: 0;
  z-index: 10;
}
.logo-slot {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  object-fit: cover;
  flex-shrink: 0;
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.icon-button {
  border: none;
  background: var(--gray-100);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--gray-700);
  position: relative;
}
.icon-button .badge {
  position: absolute;
  top: -2px;
  right: -2px;
  background: var(--notify-badge);
  color: var(--gray-0);
  font-size: 10px;
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 3px;
  
  box-shadow: 0 0 0 2px var(--gray-0);
}
.home-screen {
  display: flex;
  flex-direction: column;
  padding-bottom: 6px;
}
.home-hero {
  text-align: center;
  padding: 10px 8px;
  transition: opacity 0.18s ease, transform 0.18s ease;
  opacity: 1;
}
.home-hero.is-hidden {
  opacity: 0;
  transform: translateY(-6px);
  pointer-events: none;
}
.home-hero h1 {
  font-family: "Oswald", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 0.01em;
  margin: 0;
  color: var(--gray-900);
}
.composer-card {
  background: var(--gray-0);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius);
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06), 0 16px 36px rgba(15, 23, 42, 0.1);
  padding: 10px 12px;
}
.legal-footer {
  margin: 6px 4px 0;
  font-size: 9px;
  line-height: 1.3;
  color: var(--gray-500);
  text-align: center;
}
.composer-textarea {
  display: block;
  width: 100%;
  height: 24px;
  min-height: 24px;
  max-height: 160px;
  border: none;
  resize: none;
  font-size: 15px;
  line-height: 24px;
  font-family: inherit;
  color: var(--gray-900);
  outline: none;
  background: transparent;
  overflow-y: auto;
}
.composer-textarea::placeholder {
  color: var(--gray-400);
}
.composer-chip {
  border: none;
  background: var(--gray-100);
  color: var(--gray-600);
  padding: clamp(6px, 2vw, 8px) clamp(6px, 2vw, 9px);
  border-radius: 999px;
  font-size: clamp(11px, 3vw, 12.5px);
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex: 0 1 auto;
  max-width: clamp(68px, 24vw, 100px);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.composer-chip.filled {
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-weight: 600;
}
.composer-actions {
  --composer-gap: clamp(5px, 1.8vw, 7px);
  display: flex;
  align-items: center;
  gap: var(--composer-gap);
  padding-top: 0;
  margin-top: 6px;
}
.composer-tools {
  display: flex;
  gap: var(--composer-gap);
  flex-shrink: 0;
}
.composer-actions > .composer-tools:last-child {
  margin-left: auto;
}
.tool-button,
.send-button {
  border: none;
  width: clamp(26px, 7.5vw, 30px);
  height: clamp(26px, 7.5vw, 30px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 0;
}
.tool-button {
  background: var(--gray-100);
  color: var(--gray-600);
}
.tool-button svg,
.send-button svg {
  width: 46%;
  height: 46%;
  display: block;
}
.send-button {
  background: var(--gray-300);
  color: var(--gray-0);
  transition: background-color 0.15s ease;
}
.send-button.grade-2 {
  background: var(--accent-muted);
}
.send-button.grade-3 {
  background: var(--accent);
}
.tool-button.recording {
  background: var(--gray-900);
  color: var(--gray-0);
}
.field-card .composer-textarea {
  height: auto;
  min-height: 60px;
}
.screen { flex:1; min-height:0; padding:16px; overflow-y:auto; }
.screen.chat-screen { display:flex; flex-direction:column; padding:0 16px 6px; overflow:hidden; }

.mo { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(18,18,18,.45); }
.mo-card { width:100%; max-width:340px; background:#fff; border-radius:20px; padding:18px; box-shadow:0 10px 40px rgba(0,0,0,.2); font-size:14px; color:var(--gray-900); }
.mo-card h3 { margin:0 0 6px; font-size:16px; }
.mo-card p { margin:0 0 10px; color:var(--gray-600); font-size:13px; line-height:1.35; }
.mo-card input { width:100%; box-sizing:border-box; margin:0 0 8px; padding:11px 12px; border:1px solid var(--gray-300); border-radius:12px; font:inherit; font-size:15px; }
.mo-err { color:#c0392b; font-size:12.5px; min-height:16px; margin:0 0 6px; }
.mo-row { display:flex; gap:8px; }
.mo-btn { flex:1; padding:11px 10px; border:0; border-radius:999px; font:inherit; font-weight:600; font-size:14px; cursor:pointer; background:var(--gray-100); color:var(--gray-700); }
.mo-btn.pri { background:var(--accent); color:#fff; }
.mo-note { margin-top:8px; font-size:11px; color:var(--gray-500); }

.bubble.admin { align-self:flex-start; background:#e8f7ee; color:#14532d; border-bottom-left-radius:5px; }
.bubble.admin small { display:block; font-size:10.5px; opacity:.7; margin-bottom:2px; }
.pay-btn { display:block; margin-top:8px; padding:9px 14px; border:0; border-radius:999px; background:var(--accent); color:#fff; font:inherit; font-weight:600; font-size:14px; cursor:pointer; }
.tip-hint { position:fixed; top:23px; right:66px; z-index:60; background:#fff; color:var(--gray-900); font-size:12px; font-weight:600; line-height:1; padding:7px 14px; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.25); white-space:nowrap; pointer-events:none; }
.tool-button.ico { background: transparent; color: #bdbdbd; transition: color .15s ease; }
.tool-button.ico { width: clamp(30px, 8.5vw, 34px); height: clamp(30px, 8.5vw, 34px); }
.tool-button.ico svg { width: 82%; height: 82%; }
.tool-button.ico.on { color: var(--accent); }
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <a class="brand-block" href="/" title="На главную">
      <img class="logo-slot" src="/logo.png" alt="Мужик" />

      <a class="icon-button" href="/" aria-label="Как это работает" title="Как это работает">?</a>

    </div>

        <div class="composer-tools">
          <button type="button" class="tool-button" id="mic" hidden style="display:none" title="Голос в тесте недоступен"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8.5" y1="22" x2="15.5" y2="22"/></svg></button>
          <button type="button" class="send-button" id="send" aria-label="Отправить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>

  </main>
</div>
<script>
(function () {
  var URL_BASE = 'https://youyvbqdxuigvjciklfk.supabase.co';
  var GEO_KEY = '4be0a4fc-08bd-4859-9145-ac737b71c49f';
  var ANON = 'sb_publishable__cxPZ5uk7YSUwqN3vsTY7Q_Nt-N0KLw';
  var HIST_KEY = 'muzhik_chat_test_v1', DRAFT_KEY = 'muzhik_chat_draft_v1';
  var CAT = { electrics:'Электрика', plumbing:'Сантехника', windows_doors:'Окна и двери', air_conditioning:'Кондиционеры', assembly:'Сборка мебели', minor_repair:'Мелкий ремонт', household_help:'Уборка и бытовая помощь', moving_help:'Вынос и перемещение', cars:'Автомобили', computers:'Компьютеры', other:'Другое' };
  var URG = { normal:'обычная', soon:'в ближайшие часы', now:'срочно' };
  var log = document.getElementById('log'), ta = document.getElementById('text'), send = document.getElementById('send');
  var messages = [], draft = null, busy = false, draftEl = null;
  var photos = [], orderPhotos = [], MAX_PHOTOS = 5, convId = '', order = null, adminCursor = 0, waitNoted = false, locAddr = '', locSent = false, locPoint = null;
  var ACT = URL_BASE + '/functions/v1/chat-actions', G_UID = 'muzhik_guest_v1', G_TOK = 'muzhik_guest_token_v1';
  function newConv() { convId = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  function toBottom() { log.scrollTop = log.scrollHeight; }
  function add(cls, text) { log.classList.remove('empty'); var d = document.createElement('div'); d.className = 'bubble ' + cls; d.textContent = text; log.appendChild(d); toBottom(); return d; }
  function save() { ls(HIST_KEY, JSON.stringify({ messages: messages, draft: draft, photos: orderPhotos, convId: convId, order: order, adminCursor: adminCursor, locAddr: locAddr, locSent: locSent, locPoint: locPoint })); }
  function grade() { send.classList.toggle('grade-3', Boolean(ta.value.trim())); }
  function grow() { if (!ta.value) { ta.style.height = ''; return; } ta.style.height = '24px'; ta.style.height = Math.min(ta.scrollHeight, 160) + 'px'; }

  function renderDraft() {
    if (draftEl) { draftEl.remove(); draftEl = null; }
    if (order && (order.stage === 'unpaid' || order.stage === 'part_wait')) {
      draftEl = document.createElement('div'); draftEl.className = 'draft-card';
      draftEl.innerHTML = '<div class="draft-head"><div class="draft-title"><small>' + (order.stage === 'unpaid' ? 'Черновик · не оплачен' : 'Оплачен · ждём деталь') + '</small><span>Заказ ' + (order.number ? 'T-' + order.number : '') + '</span></div>' +
        '<button type="button" class="draft-btn on">' + (order.stage === 'unpaid' ? 'Оплатить' : 'Деталь получена') + '</button></div>';
      draftEl.querySelector('button').onclick = order.stage === 'unpaid' ? payModal : partReceived;
      log.parentNode.insertBefore(draftEl, document.querySelector('.composer-card')); toBottom();
      return;
    }
    if (!draft) return;
    log.classList.remove('empty');
    draftEl = document.createElement('div'); draftEl.className = 'draft-card';
    draftEl.innerHTML = '<div class="draft-head"><div class="draft-title"><small>Черновик заказа · подробнее ▾</small><span>' + esc(draft.title || '—') + '</span></div>' +
      '<button type="button" class="draft-btn ' + (draft.ready ? 'on' : '') + '">Создать заказ</button></div>' +
      '<div class="draft-more">' +
      '<div>Категория: <b>' + esc(CAT[draft.category] || 'Другое') + '</b></div>' +
      '<div>Описание: <b>' + esc(draft.description || '—') + '</b></div>' +
      '<div>Адрес: <b>' + esc(draft.address || '—') + '</b></div>' +
      '<div>Деталь: <b>' + esc({ none: 'не нужна', have: 'уже есть', need: 'нужно купить' }[draft.part] || '—') + '</b></div>' +
      '<div>Цена за работу: <b>' + (draft.price ? esc(draft.price) + ' ₽' : '—') + '</b></div></div>';
    draftEl.querySelector('.draft-title').onclick = function () { draftEl.classList.toggle('open'); };
    log.parentNode.insertBefore(draftEl, document.querySelector('.composer-card')); toBottom();
    draftEl.querySelector('button').onclick = createTestOrder;
  }

  async function geocode(addr) {
    try {
      var r = await fetch('https://geocode-maps.yandex.ru/1.x/?apikey=' + GEO_KEY + '&geocode=' + encodeURIComponent(addr) + '&format=json&results=1');
      var j = await r.json();
      var pos = j.response.GeoObjectCollection.featureMember[0].GeoObject.Point.pos.split(' ').map(Number);
      return (isFinite(pos[0]) && isFinite(pos[1])) ? { lat: pos[1], lng: pos[0] } : null;
    } catch (e) { return null; }
  }

  function getSess() {
    var u = ls('muzhik_session_v1'), t = ls('muzhik_session_token_v1');

    fetch(URL_BASE + '/rest/v1/users_public?id=eq.' + encodeURIComponent(uid) + '&select=avatar_url', { headers: { apikey: ANON, Authorization: 'Bearer ' + ANON } })
      .then(function (r) { return r.json(); }).then(function (rows) {
        if (rows && rows[0] && rows[0].avatar_url) { document.getElementById('avatar').innerHTML = '<img alt="" src="' + esc(rows[0].avatar_url) + '" />'; }
      }).catch(function () {});
  })();

  // Ошибка + маленькая кнопка «повторить» — повторно отправляет то же сообщение без перепечатывания.
  function fail(text, t, mine, canRetry) {
    var d = add('sys', text + ' ');
    if (!canRetry) return;
    var b = document.createElement('button');
    b.type = 'button'; b.title = 'Повторить отправку'; b.setAttribute('aria-label', 'Повторить отправку');
    b.style.cssText = 'border:0;background:var(--gray-100);color:var(--gray-700);border-radius:999px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer;vertical-align:middle;';
    b.innerHTML = '↻ Повторить';
    b.onclick = function () {
      if (busy) return;
      d.remove(); if (mine) mine.remove();
      ta.value = t; submit();
    };
    d.appendChild(b); toBottom();
  }

  async function submit(e) {
    if (e) e.preventDefault();
    var t = ta.value.trim();
    var ready = photos.filter(function (p) { return !p.up && p.url; });
    if (photos.some(function (p) { return p.up; })) { add('sys', 'Фото ещё загружается…'); return; }
    if ((!t && !ready.length) || busy) return;
    if (!t) t = 'Фото приложено.';
    ta.value = ''; grow(); grade(); busy = true;
    var shown = t;
    if (ready.length) {
      orderPhotos = orderPhotos.concat(ready.map(function (p, i) { return { id: 'att-' + Date.now() + '-' + i, type: 'photo', url: p.url, name: p.name || 'photo.jpg', sizeBytes: 0, uploadedAt: Date.now(), archiveNamed: false }; }));
      t += ' [клиент приложил фото: ' + ready.length + ' шт.]'; shown += '\n📷 ' + ready.length;
      photos = []; renderPhotos();
    }
    if (locAddr && !locSent) { t += ' [клиент указал адрес: ' + locAddr + ' — адрес не спрашивай]'; shown += '\n📍 ' + locAddr; locSent = true; }
    messages.push({ role: 'user', text: t }); var mine = add('me', shown);
    await ask(t, mine);
  }
  async function autoTurn(text) {
    if (busy) return;
    busy = true; messages.push({ role: 'user', text: text });
    await ask(text, null);
  }
  async function ask(t, mine) {
    var S = await ensureSession();
    if (!S) { fail('Не получилось начать диалог.', t, mine, !!mine); messages.pop(); busy = false; return; }
    var wait = add('ai typing', ''); wait.innerHTML = '<i></i><i></i><i></i>';
    try {
      var res = await fetch(URL_BASE + '/functions/v1/chat-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON },
        body: JSON.stringify({ userId: S.uid, sessionToken: S.tok, messages: messages.filter(function (m) { return m.role !== 'admin'; }), convId: convId || (newConv(), convId), category: draft && draft.category, state: stateFor(), guest: S.guest })
      });
      var data = await res.json().catch(function () { return null; });
      wait.remove();
      if (!res.ok || !data || !data.ok) {
        var err = data && data.error;
        if (err === 'unauthorized' && S.guest) { ls(G_UID, null); ls(G_TOK, null); }
        var retry = err !== 'rate_limited';
        fail(err === 'rate_limited' ? 'Лимит сообщений на сегодня исчерпан.' : err === 'unauthorized' ? (S.guest ? 'Сессия обновилась — попробуйте ещё раз.' : 'Сессия устарела — войдите на сайте заново.') : 'Не получилось ответить.', t, mine, retry && !!mine && !(err === 'unauthorized' && !S.guest));
        messages.pop();
      } else {
        if (data.waitingAdmin) {
          if (!waitNoted) { add('sys', 'Сообщение передано администратору — ответ появится здесь. ' + (data.note || '')); waitNoted = true; }
        } else {
          waitNoted = false;
          messages.push({ role: 'assistant', text: data.reply });
          add('ai', data.reply);
          if (data.draft) { if (order) { handleOrderDraft(data.draft); } else { draft = data.draft; renderDraft(); } }
          if (data.needsHuman) { add('sys', 'Диалог передан администратору — он ответит прямо здесь. Можно писать дальше.'); waitNoted = true; }
        }
      }
    } catch (x) { wait.remove(); fail('Нет связи.', t, mine, !!mine); messages.pop(); }
    busy = false; save(); toBottom();
  }
  async function callAdmin() {
    if (busy) return;
    var S = await ensureSession();
    if (!S) { add('sys', 'Не получилось связаться — попробуйте ещё раз.'); return; }
    busy = true;
    var btn = document.getElementById('calladm'); btn.disabled = true;
    try {
      var res = await fetch(URL_BASE + '/functions/v1/chat-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON },
        body: JSON.stringify({ userId: S.uid, sessionToken: S.tok, callAdmin: true, messages: [], convId: convId || (newConv(), convId), state: stateFor(), guest: S.guest })
      });
      var data = await res.json().catch(function () { return null; });
      if (!res.ok || !data || !data.ok) { add('sys', 'Не получилось позвать администратора — попробуйте ещё раз.'); }
      else { messages.push({ role: 'assistant', text: data.reply }); add('ai', data.reply); waitNoted = true; save(); toBottom(); }
    } catch (x) { add('sys', 'Нет связи.'); }
    btn.disabled = false; busy = false;
  }
  document.getElementById('calladm').addEventListener('click', callAdmin);
  send.addEventListener('click', submit);
  ta.addEventListener('input', function () { grow(); grade(); });
  ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
  restore(); grade(); setInterval(pollAdmin, 15000);
  (function () { var rs = getSess(); if (rs && !rs.guest) mergeGuest(rs); })();
})();
</script>
