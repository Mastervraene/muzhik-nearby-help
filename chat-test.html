<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#ffffff" />
<title>Мужик — чат-помощник (тест)</title>
<link rel="icon" type="image/png" href="/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --gray-0:#ffffff; --gray-50:#f7f7f7; --gray-100:#eeeeee; --gray-200:#dddddd; --gray-300:#c4c4c4; --gray-400:#9c9c9c;
  --gray-500:#767676; --gray-600:#545454; --gray-700:#383838; --gray-800:#232323; --gray-900:#121212;
  --accent:#2563eb; --accent-strong:#1d4ed8; --accent-soft:#eff6ff; --accent-muted:#a8c8fb;
  --radius:20px; --max-width:480px;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:var(--gray-0); color:var(--gray-800);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; -webkit-tap-highlight-color:transparent; }
body { display:flex; justify-content:center; height:100vh; height:100dvh; }
.brand-block { display:flex; align-items:center; gap:10px; cursor:pointer; text-decoration:none; color:inherit; }
.brand-title { font-size:16px; font-weight:700; color:var(--gray-900); }
.brand-sub { font-size:11px; color:var(--gray-500); display:block; }
.icon-button { cursor:pointer; text-decoration:none; }
.icon-button svg { width:18px; height:18px; display:block; }
.icon-button img { width:100%; height:100%; min-width:38px; min-height:38px; object-fit:cover; border-radius:50%; }
.topbar-actions .icon-button { overflow:hidden; }
.screen.chat-screen { display:flex; flex-direction:column; padding:0 16px 6px; overflow:hidden; }
.chat-log { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; padding:8px 0 12px; position:relative; scroll-behavior:smooth; }
.chat-log::before { content:""; margin-top:auto; }
.chat-log.empty { justify-content:center; }
.chat-log.empty::before { display:none; }
.home-hero { text-align:center; padding:10px 8px; }
.chat-log:not(.empty) .home-hero { display:none; }
.bubble { max-width:86%; padding:8px 13px; border-radius:18px; font-size:15px; line-height:1.35; white-space:pre-wrap; word-wrap:break-word;
  margin-top:4px; animation:pop .22s ease-out both; box-shadow:0 1px 2px rgba(15,23,42,.05); }
.bubble.me { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:5px; }
.bubble.ai { align-self:flex-start; background:var(--gray-100); color:var(--gray-900); border-bottom-left-radius:5px; }
.bubble.sys { align-self:center; background:transparent; box-shadow:none; color:var(--gray-500); font-size:12.5px; text-align:center; padding:4px 10px; max-width:92%; }
.bubble.typing { display:inline-flex; gap:5px; align-items:center; padding:12px 14px; }
.bubble.typing i { width:7px; height:7px; border-radius:50%; background:var(--gray-400); animation:blink 1.2s infinite both; }
.bubble.typing i:nth-child(2){animation-delay:.2s} .bubble.typing i:nth-child(3){animation-delay:.4s}
@keyframes pop { from { opacity:0; transform:translateY(10px) scale(.97);} to { opacity:1; transform:none; } }
@keyframes blink { 0%,80%,100% { opacity:.25; transform:translateY(0);} 40% { opacity:1; transform:translateY(-3px);} }
.draft-card { flex:none; margin:0 0 8px; padding:10px 12px; background:var(--gray-0); border:1px solid var(--gray-200); border-radius:22px;
  box-shadow:0 2px 10px rgba(15,23,42,.08); font-size:13px; animation:pop .25s ease-out both; }
.draft-head { display:flex; align-items:center; gap:10px; }
.draft-title { flex:1; min-width:0; cursor:pointer; color:var(--gray-900); font-weight:600; font-size:14px; }
.draft-title small { display:block; color:var(--gray-500); font-weight:400; font-size:11.5px; }
.draft-title span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.draft-more { display:none; margin-top:8px; max-height:30vh; overflow-y:auto; }
.draft-card.open .draft-more { display:block; }
.draft-more div { margin:3px 0; color:var(--gray-500); } .draft-more div b { color:var(--gray-900); font-weight:500; }
.draft-btn { flex:none; padding:10px 16px; border:0; border-radius:999px; background:var(--gray-300); color:#fff; font-size:14px; font-weight:600; font-family:inherit; }
.draft-btn.on { background:var(--accent); cursor:pointer; }
.ph-row { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 0; }
.ph-row:empty { display:none; }
.ph { position:relative; width:44px; height:44px; border-radius:10px; background:var(--gray-100); overflow:visible; }
.ph img { width:100%; height:100%; object-fit:cover; border-radius:10px; display:block; }
.ph.up img { opacity:.4; }
.ph button { position:absolute; top:-6px; right:-6px; width:18px; height:18px; border:0; border-radius:50%; background:var(--gray-700); color:#fff; font-size:11px; line-height:18px; padding:0; cursor:pointer; }
.home-hero-hint { margin:10px 0 0; font-size:15px; line-height:24px; color:var(--gray-400); }
.app-shell {
  width: 100%;
  max-width: var(--max-width);
  height: 100%;
  background: var(--gray-0);
  display: flex;
  flex-direction: column;
  position: relative;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: var(--gray-0);
  position: sticky;
  top: 0;
  z-index: 10;
}
.logo-slot {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  object-fit: cover;
  flex-shrink: 0;
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.icon-button {
  border: none;
  background: var(--gray-100);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--gray-700);
  position: relative;
}
.icon-button .badge {
  position: absolute;
  top: -2px;
  right: -2px;
  background: var(--notify-badge);
  color: var(--gray-0);
  font-size: 10px;
  min-width: 16px;
  height: 16px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 3px;
  
  box-shadow: 0 0 0 2px var(--gray-0);
}
.home-screen {
  display: flex;
  flex-direction: column;
  padding-bottom: 6px;
}
.home-hero {
  text-align: center;
  padding: 10px 8px;
  transition: opacity 0.18s ease, transform 0.18s ease;
  opacity: 1;
}
.home-hero.is-hidden {
  opacity: 0;
  transform: translateY(-6px);
  pointer-events: none;
}
.home-hero h1 {
  font-family: "Oswald", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: 0.01em;
  margin: 0;
  color: var(--gray-900);
}
.composer-card {
  background: var(--gray-0);
  border: 1px solid var(--gray-200);
  border-radius: var(--radius);
  box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06), 0 16px 36px rgba(15, 23, 42, 0.1);
  padding: 10px 12px;
}
.legal-footer {
  margin: 6px 4px 0;
  font-size: 9px;
  line-height: 1.3;
  color: var(--gray-500);
  text-align: center;
}
.composer-textarea {
  display: block;
  width: 100%;
  height: 24px;
  min-height: 24px;
  max-height: 160px;
  border: none;
  resize: none;
  font-size: 15px;
  line-height: 24px;
  font-family: inherit;
  color: var(--gray-900);
  outline: none;
  background: transparent;
  overflow-y: auto;
}
.composer-textarea::placeholder {
  color: var(--gray-400);
}
.composer-chip {
  border: none;
  background: var(--gray-100);
  color: var(--gray-600);
  padding: clamp(6px, 2vw, 8px) clamp(6px, 2vw, 9px);
  border-radius: 999px;
  font-size: clamp(11px, 3vw, 12.5px);
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex: 0 1 auto;
  max-width: clamp(68px, 24vw, 100px);
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.composer-chip.filled {
  background: var(--accent-soft);
  color: var(--accent-strong);
  font-weight: 600;
}
.composer-actions {
  --composer-gap: clamp(5px, 1.8vw, 7px);
  display: flex;
  align-items: center;
  gap: var(--composer-gap);
  padding-top: 0;
  margin-top: 6px;
}
.composer-tools {
  display: flex;
  gap: var(--composer-gap);
  flex-shrink: 0;
}
.composer-actions > .composer-tools:last-child {
  margin-left: auto;
}
.tool-button,
.send-button {
  border: none;
  width: clamp(26px, 7.5vw, 30px);
  height: clamp(26px, 7.5vw, 30px);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 0;
}
.tool-button {
  background: var(--gray-100);
  color: var(--gray-600);
}
.tool-button svg,
.send-button svg {
  width: 46%;
  height: 46%;
  display: block;
}
.send-button {
  background: var(--gray-300);
  color: var(--gray-0);
  transition: background-color 0.15s ease;
}
.send-button.grade-2 {
  background: var(--accent-muted);
}
.send-button.grade-3 {
  background: var(--accent);
}
.tool-button.recording {
  background: var(--gray-900);
  color: var(--gray-0);
}
.field-card .composer-textarea {
  height: auto;
  min-height: 60px;
}
.screen { flex:1; min-height:0; padding:16px; overflow-y:auto; }
.screen.chat-screen { display:flex; flex-direction:column; padding:0 16px 6px; overflow:hidden; }
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <a class="brand-block" href="/" title="На главную">
      <img class="logo-slot" src="/logo.png" alt="Мужик" />
      <div><span class="brand-title">Мужик</span><span class="brand-sub">рядом поможет</span></div>
    </a>
    <div class="topbar-actions">
      <button class="icon-button" id="reset" type="button" aria-label="Начать заново" title="Начать заново"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 10 9 10"/></svg></button>
      <a class="icon-button" href="/" aria-label="Как это работает" title="Как это работает">?</a>
      <a class="icon-button" href="/" aria-label="Поддержка" title="Поддержка">🛟</a>
      <a class="icon-button" id="avatar" href="/" aria-label="Профиль" title="Профиль">👤</a>
    </div>
  </header>
  <main class="screen chat-screen">
    <div class="chat-log empty" id="log">
      <div class="home-hero"><h1>Что нужно сделать?</h1><p class="home-hero-hint">Опишите проблему или задачу,<br>приложите фото и укажите адрес.</p></div>
    </div>
    <div class="composer-card">
      <textarea id="text" class="composer-textarea" rows="1" maxlength="1000" aria-label="Опишите проблему или задачу"></textarea>
      <div class="ph-row" id="photos"></div>
      <input type="file" id="file" accept="image/*" multiple style="display:none" />
      <div class="composer-actions">
        <div class="composer-tools"><button type="button" class="tool-button" id="plus" title="Приложить фото"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>
        <div class="composer-tools">
          <button type="button" class="tool-button" id="mic" title="Голос в тесте недоступен"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8.5" y1="22" x2="15.5" y2="22"/></svg></button>
          <button type="button" class="send-button" id="send" aria-label="Отправить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
        </div>
      </div>
    </div>
    <p class="legal-footer"><a href="/about.html" style="color:inherit;">О сервисе и реквизиты</a> · <a href="/privacy-policy.html" style="color:inherit;">Конфиденциальность</a> · <a href="/personal-data-policy.html" style="color:inherit;">Персональные данные</a></p>
  </main>
</div>
<script>
(function () {
  var URL_BASE = 'https://youyvbqdxuigvjciklfk.supabase.co';
  var GEO_KEY = '4be0a4fc-08bd-4859-9145-ac737b71c49f';
  var ANON = 'sb_publishable__cxPZ5uk7YSUwqN3vsTY7Q_Nt-N0KLw';
  var HIST_KEY = 'muzhik_chat_test_v1', DRAFT_KEY = 'muzhik_chat_draft_v1';
  var CAT = { electrics:'Электрика', plumbing:'Сантехника', windows_doors:'Окна и двери', air_conditioning:'Кондиционеры', assembly:'Сборка мебели', minor_repair:'Мелкий ремонт', household_help:'Уборка и бытовая помощь', moving_help:'Вынос и перемещение', cars:'Автомобили', computers:'Компьютеры', other:'Другое' };
  var URG = { normal:'обычная', soon:'в ближайшие часы', now:'срочно' };
  var log = document.getElementById('log'), ta = document.getElementById('text'), send = document.getElementById('send');
  var messages = [], draft = null, busy = false, draftEl = null;
  var photos = [], orderPhotos = [], MAX_PHOTOS = 5;

  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  function toBottom() { log.scrollTop = log.scrollHeight; }
  function add(cls, text) { log.classList.remove('empty'); var d = document.createElement('div'); d.className = 'bubble ' + cls; d.textContent = text; log.appendChild(d); toBottom(); return d; }
  function save() { ls(HIST_KEY, JSON.stringify({ messages: messages, draft: draft, photos: orderPhotos })); }
  function grade() { send.classList.toggle('grade-3', Boolean(ta.value.trim())); }
  function grow() { if (!ta.value) { ta.style.height = ''; return; } ta.style.height = '24px'; ta.style.height = Math.min(ta.scrollHeight, 160) + 'px'; }

  function renderDraft() {
    if (draftEl) { draftEl.remove(); draftEl = null; }
    if (!draft) return;
    log.classList.remove('empty');
    draftEl = document.createElement('div'); draftEl.className = 'draft-card';
    draftEl.innerHTML = '<div class="draft-head"><div class="draft-title"><small>Черновик заказа · подробнее ▾</small><span>' + esc(draft.title || '—') + '</span></div>' +
      '<button type="button" class="draft-btn ' + (draft.ready ? 'on' : '') + '">Создать заказ</button></div>' +
      '<div class="draft-more">' +
      '<div>Категория: <b>' + esc(CAT[draft.category] || 'Другое') + '</b></div>' +
      '<div>Описание: <b>' + esc(draft.description || '—') + '</b></div>' +
      '<div>Адрес: <b>' + esc(draft.address || '—') + '</b></div>' +
      '<div>Срочность: <b>' + esc(URG[draft.urgency] || 'обычная') + '</b></div></div>';
    draftEl.querySelector('.draft-title').onclick = function () { draftEl.classList.toggle('open'); };
    log.parentNode.insertBefore(draftEl, document.querySelector('.composer-card')); toBottom();
    draftEl.querySelector('button').onclick = createTestOrder;
  }

  async function geocode(addr) {
    try {
      var r = await fetch('https://geocode-maps.yandex.ru/1.x/?apikey=' + GEO_KEY + '&geocode=' + encodeURIComponent(addr) + '&format=json&results=1');
      var j = await r.json();
      var pos = j.response.GeoObjectCollection.featureMember[0].GeoObject.Point.pos.split(' ').map(Number);
      return (isFinite(pos[0]) && isFinite(pos[1])) ? { lat: pos[1], lng: pos[0] } : null;
    } catch (e) { return null; }
  }

  async function createTestOrder() {
    if (!draft || !draft.ready) { add('sys', 'Пока не хватает данных — ответьте на вопросы выше.'); return; }
    if (busy) return;
    var uid = ls('muzhik_session_v1'), tok = ls('muzhik_session_token_v1');
    if (!uid || !tok) { add('sys', 'Сначала войдите на сайте.'); return; }
    busy = true;
    var btn = draftEl && draftEl.querySelector('button'); if (btn) { btn.textContent = 'Создаём…'; btn.classList.remove('on'); }
    var loc = await geocode(draft.address);
    var now = new Date().toISOString();
    var order = {
      title: draft.title || draft.description.slice(0, 60), categoryId: draft.category, description: draft.description, desiredOutcome: '',
      scope: { quantity: 1, demolitionNeeded: false, accessDifficulty: 'easy' }, attachments: orderPhotos, hasVoiceTranscript: false, voiceTranscript: '',
      exactLocation: loc || { lat: 0, lng: 0 }, district: draft.address, houseNumberPublic: '', fullAddress: draft.address,
      desiredDate: '', timeWindow: '', urgency: draft.urgency, customerBudget: null,
      estimate: { min: 500, max: 500, factors: [] }, status: 'searching', timeline: [{ status: 'searching', at: now }],
      warnings: ['Тестовый заказ из чат-помощника'], isPrecedent: false, negotiation: { customerOffer: null, workerOffer: null },
      isTest: true
    };
    try {
      var res = await fetch(URL_BASE + '/functions/v1/create-order', {
        method: 'POST', headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON },
        body: JSON.stringify({ userId: uid, sessionToken: tok, order: order })
      });
      var data = await res.json().catch(function () { return null; });
      if (res.ok && data && data.ok) {
        var n = data.order && data.order.order_number;
        add('sys', 'Готово! Тестовый заказ ' + (n ? 'T-' + n : '') + ' создан' + (loc ? '' : ' (адрес на карте не определился)') + '. Он виден только вам и администратору — найдёте в «Мои заказы» на главной.');
        draft = null; renderDraft(); save();
      } else {
        add('sys', data && data.error === 'test_limit' ? 'Лимит тестовых заказов на сегодня (5) исчерпан.' : data && data.error === 'unauthorized' ? 'Сессия устарела — войдите на сайте заново.' : 'Не получилось создать заказ, попробуйте ещё раз.');
        renderDraft();
      }
    } catch (e) { add('sys', 'Нет связи, попробуйте ещё раз.'); renderDraft(); }
    busy = false;
  }

  function restore() {
    var raw = ls(HIST_KEY);
    if (raw) { try { var o = JSON.parse(raw); messages = o.messages || []; draft = o.draft || null; orderPhotos = o.photos || []; } catch (e) {} }
    messages.forEach(function (m) { add(m.role === 'user' ? 'me' : 'ai', m.text); });
    renderDraft();
    if (!messages.length) log.classList.add('empty');
  }

  document.getElementById('reset').onclick = function () {
    messages = []; draft = null; draftEl = null; photos = []; orderPhotos = []; renderPhotos(); ls(HIST_KEY, null);
    document.querySelectorAll('.chat-screen .bubble,.chat-screen .draft-card').forEach(function (n) { n.remove(); });
    log.classList.add('empty'); ta.value = ''; grow(); grade();
  };
  function renderPhotos() {
    var box = document.getElementById('photos'); box.innerHTML = '';
    photos.forEach(function (p, i) {
      var d = document.createElement('div'); d.className = 'ph' + (p.up ? ' up' : '');
      var im = document.createElement('img'); im.src = p.preview || p.url || ''; d.appendChild(im);
      var x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.onclick = function () { photos.splice(i, 1); renderPhotos(); };
      d.appendChild(x); box.appendChild(d);
    });
  }
  function shrink(file) {
    return new Promise(function (resolve) {
      var img = new Image(), u = URL.createObjectURL(file);
      img.onload = function () {
        var k = Math.min(1, 1280 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        cv.toBlob(function (b) { URL.revokeObjectURL(u); resolve(b || file); }, 'image/jpeg', 0.82);
      };
      img.onerror = function () { URL.revokeObjectURL(u); resolve(file); };
      img.src = u;
    });
  }
  async function addPhotos(files) {
    var list = Array.prototype.slice.call(files).filter(function (f) { return f.type && f.type.indexOf('image/') === 0; });
    var room = MAX_PHOTOS - photos.length - orderPhotos.length;
    if (room <= 0) { add('sys', 'Можно приложить не больше ' + MAX_PHOTOS + ' фото.'); return; }
    list.slice(0, room).forEach(async function (f) {
      var p = { up: true, preview: URL.createObjectURL(f), name: f.name }; photos.push(p); renderPhotos();
      try {
        var blob = await shrink(f), path = Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
        var r = await fetch(URL_BASE + '/storage/v1/object/order-attachments/' + path, { method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'image/jpeg' }, body: blob });
        if (!r.ok) throw new Error('upload ' + r.status);
        p.url = URL_BASE + '/storage/v1/object/public/order-attachments/' + path; p.up = false;
      } catch (e) { photos.splice(photos.indexOf(p), 1); add('sys', 'Не удалось загрузить фото.'); }
      renderPhotos();
    });
  }
  document.getElementById('plus').onclick = function () { document.getElementById('file').click(); };
  document.getElementById('file').onchange = function (e) { addPhotos(e.target.files); e.target.value = ''; };
  document.getElementById('mic').onclick = function () { add('sys', 'Голос в тестовом чате пока недоступен.'); };

  // аватарка из публичного профиля
  (function () {
    var uid = ls('muzhik_session_v1'); if (!uid) return;
    fetch(URL_BASE + '/rest/v1/users_public?id=eq.' + encodeURIComponent(uid) + '&select=avatar_url', { headers: { apikey: ANON, Authorization: 'Bearer ' + ANON } })
      .then(function (r) { return r.json(); }).then(function (rows) {
        if (rows && rows[0] && rows[0].avatar_url) { document.getElementById('avatar').innerHTML = '<img alt="" src="' + esc(rows[0].avatar_url) + '" />'; }
      }).catch(function () {});
  })();

  // Ошибка + маленькая кнопка «повторить» — повторно отправляет то же сообщение без перепечатывания.
  function fail(text, t, mine, canRetry) {
    var d = add('sys', text + ' ');
    if (!canRetry) return;
    var b = document.createElement('button');
    b.type = 'button'; b.title = 'Повторить отправку'; b.setAttribute('aria-label', 'Повторить отправку');
    b.style.cssText = 'border:0;background:var(--gray-100);color:var(--gray-700);border-radius:999px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer;vertical-align:middle;';
    b.innerHTML = '↻ Повторить';
    b.onclick = function () {
      if (busy) return;
      d.remove(); if (mine) mine.remove();
      ta.value = t; submit();
    };
    d.appendChild(b); toBottom();
  }

  async function submit(e) {
    if (e) e.preventDefault();
    var t = ta.value.trim();
    var ready = photos.filter(function (p) { return !p.up && p.url; });
    if (photos.some(function (p) { return p.up; })) { add('sys', 'Фото ещё загружается…'); return; }
    if ((!t && !ready.length) || busy) return;
    if (!t) t = 'Фото приложено.';
    var uid = ls('muzhik_session_v1'), tok = ls('muzhik_session_token_v1');
    if (!uid || !tok) { add('sys', 'Сначала войдите на сайте (мастерврайоне.рф), потом вернитесь на эту страницу.'); return; }
    ta.value = ''; grow(); grade(); busy = true;
    var shown = t;
    if (ready.length) {
      orderPhotos = orderPhotos.concat(ready.map(function (p, i) { return { id: 'att-' + Date.now() + '-' + i, type: 'photo', url: p.url, name: p.name || 'photo.jpg', sizeBytes: 0, uploadedAt: Date.now(), archiveNamed: false }; }));
      t += ' [клиент приложил фото: ' + ready.length + ' шт.]'; shown += '\n📷 ' + ready.length;
      photos = []; renderPhotos();
    }
    messages.push({ role: 'user', text: t }); var mine = add('me', shown);
    var wait = add('ai typing', ''); wait.innerHTML = '<i></i><i></i><i></i>';
    try {
      var res = await fetch(URL_BASE + '/functions/v1/chat-order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON },
        body: JSON.stringify({ userId: uid, sessionToken: tok, messages: messages, category: draft && draft.category })
      });
      var data = await res.json().catch(function () { return null; });
      wait.remove();
      if (!res.ok || !data || !data.ok) {
        var err = data && data.error;
        var retry = !(err === 'rate_limited' || err === 'unauthorized');
        fail(err === 'rate_limited' ? 'Лимит сообщений на сегодня исчерпан.' : err === 'unauthorized' ? 'Сессия устарела — войдите на сайте заново.' : 'Не получилось ответить.', t, mine, retry);
        messages.pop();
      } else {
        messages.push({ role: 'assistant', text: data.reply });
        add('ai', data.reply);
        if (data.draft) { draft = data.draft; renderDraft(); }
        if (data.needsHuman) add('sys', 'Передаю разговор администратору (в тесте — только отметка).');
      }
    } catch (x) { wait.remove(); fail('Нет связи.', t, mine, true); messages.pop(); }
    busy = false; save(); toBottom();
  }
  send.addEventListener('click', submit);
  ta.addEventListener('input', function () { grow(); grade(); });
  ta.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
  restore(); grade();
})();
</script>
</body>
</html>
